name: Frank A04 finalized wallet history backfill journal
on:
  push:
    branches:
      - dev/frank-ca-a04-history-pagination-resume-20261014
  workflow_dispatch:
permissions:
  contents: read
jobs:
  history-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 23
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test-only dependencies
        working-directory: crypto-300-profit-mission/local-agent
        run: |
          python -m pip install -e '.[dev]'
          python -m pip install numpy==2.3.3 pyflakes==3.4.0
      - name: Static and script safety gates
        working-directory: crypto-300-profit-mission/local-agent
        run: |
          python -B -m compileall -q mission_agent/mission_control/wallet_history_replay.py scripts/frank_research_history_readonly.py tests/test_frank_a04_history_resume.py tests/test_frank_a04_history_cli.py
          python -m pyflakes mission_agent/mission_control/wallet_history_replay.py scripts/frank_research_history_readonly.py tests/test_frank_a04_history_resume.py tests/test_frank_a04_history_cli.py
          node --check mission_agent/mission_control/static/app.js
      - name: Targeted real SQLite restart and 1005 signatures
        working-directory: crypto-300-profit-mission/local-agent
        run: |
          python -B -m pytest -q -p no:cacheprovider tests/test_frank_a04_history_resume.py tests/test_frank_a04_history_cli.py tests/test_frank_a04_a05_chain_capture.py tests/test_frank_a04_inner_transfer_evidence.py
      - name: Full Mission local-agent tests including actual Git replay
        working-directory: crypto-300-profit-mission/local-agent
        env:
          FRANK_EXPECT_REAL_GIT_REPLAY: '1'
        run: |
          python -B -m pytest -q -p no:cacheprovider tests
