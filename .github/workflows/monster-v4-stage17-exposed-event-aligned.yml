name: Monster Stage17 Known 2x 5x Event-Aligned 1m V4 Diagnostic
on:
  push:
    branches:
      - research/monster-v4-local-discovery-20261010
    paths:
      - 'crypto-300-profit-mission/local-agent/scripts/monster_v4_stage17_event_aligned_replay.py'
      - 'crypto-300-profit-mission/local-agent/tests/test_monster_v4_stage17_event_aligned_replay.py'
      - '.github/workflows/monster-v4-stage17-exposed-event-aligned.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: monster-stage17-exposed-research-${{ github.ref }}
  cancel-in-progress: true
jobs:
  actual-first-cross-production-v4-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify frozen 21 events, real 1m crossover source checks and no-trading rules
        working-directory: crypto-300-profit-mission/local-agent
        run: |
          python -B -m py_compile scripts/monster_v4_stage17_event_aligned_replay.py tests/test_monster_v4_stage17_event_aligned_replay.py
          python -B -m unittest discover -v -s tests -p test_monster_v4_stage17_event_aligned_replay.py
      - name: Re-download Binance official SHA256 daily 1m archive around known 2x 5x first highs and execute existing V4 D0 D1
        working-directory: crypto-300-profit-mission/local-agent
        run: |
          python -B scripts/monster_v4_stage17_event_aligned_replay.py --output /tmp/monster_stage17_event_aligned.json
      - name: Preserve all real first-cross and original production V4 episode evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: monster-stage17-exposed-event-aligned-v4-official-1m
          path: /tmp/monster_stage17_event_aligned.json
          if-no-files-found: warn
          retention-days: 30
