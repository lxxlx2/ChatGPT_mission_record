permissions:
  contents: read

jobs:
  proof_only:
    name: Frozen source and model output QA
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      MODEL_DIR: crypto-300-profit-mission/research
      FROZEN_BLOB_SHA: 3761b9140d0c64b1ffd8d8d243d63a2a1a4fc690
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Confirm frozen Git input blob
        shell: bash
        run: |
          actual="$(git hash-object "$MODEL_DIR/BSC_MEME_23_EOA_19_CA_EVIDENCE_COMPLETENESS_OVERLAY_V21_2026-10-12.json")"
          test "$actual" = "$FROZEN_BLOB_SHA"
      - name: Unit tests (stdlib only; no RPC/no secrets)
        run: |
          python3 -B -m unittest discover -s "$MODEL_DIR" -p "test_bsc_meme_address_model_v1*.py" -v
          python3 -B -m unittest discover -s "$MODEL_DIR" -p "test_bsc_meme_address_model_v1_bulk16.py" -v
      - name: P4-C all 23 original wallet x 19 exact CA actual negative source scope
        shell: bash
        run: |
          python3 -B "$MODEL_DIR/bsc_meme_address_model_v1_p4c_closed_grid23x19.py" --source-dir "$MODEL_DIR" --output /tmp/bsc-p4c-23x19-closed.json
          python3 -B - <<'PY'
          import json
          from pathlib import Path
          root=Path("crypto-300-profit-mission/research")
          a=json.loads(Path("/tmp/bsc-p4c-23x19-closed.json").read_text(encoding="utf-8"))
          b=json.loads((root/"bsc-meme-address-model-v1-p4c-23x19-native-economic-evidence-grid-2026-10-15.json").read_text(encoding="utf-8"))
          assert a==b,"23 x 19 original frozen economic eligibility source replay drift"
          s=a["summary"]
          assert (s["frozen_wallet_candidates"],s["frozen_major_exact_CAs"],s["implicit_wallet_CAs"])==(23,19,437)
          assert (s["verified_native_negative_rounds"],s["verified_native_positive_rounds"],s["not_economically_audited_cells"])==(1,0,436)
          assert not s["profit_rank_ready"] and s["qualified_public_entry_follower_signals"]==0
          assert s["production"]=="NO_GO"
          print("PASS 23 wallet x 19 major economic ledger: 1 DDAC Dragon real loser, 436 not economically audited, P5 not qualified")
          PY
      - name: P4-C original DDAC Dragon fully closed TokenSale and negative BNB economic replay
        shell: bash
        run: |
          python3 -B "$MODEL_DIR/bsc_meme_address_model_v1_p4c_ddac_dragon_closed.py" --source-dir "$MODEL_DIR" --output /tmp/bsc-p4c-ddac-dragon-real-loss.json
          python3 -B - <<'PY'
          import json
          from pathlib import Path
          root=Path("crypto-300-profit-mission/research")
          actual=json.loads(Path("/tmp/bsc-p4c-ddac-dragon-real-loss.json").read_text(encoding="utf-8"))
          expected=json.loads((root/"bsc-meme-address-model-v1-p4c-dragon-ddac-closed-native-loss-2026-10-15.json").read_text(encoding="utf-8"))
          assert actual==expected,"Original Four TokenSale + exact BNB wallet economic result drift"
          s=actual["summary"]
          assert (s["frozen_wallets"],s["frozen_major_CAs"],s["original_signed_owner_buys_economically_closed"],
                  s["actual_negative_native_owner_rounds"],s["actual_positive_native_owner_rounds"])==(23,19,1,1,0)
          f=actual["round"]
          assert (f["exit_venue_verified_successful"],f["residual_token_raw"],
                  f["native_closed_owner_round_net_wei"])==("FOUR_MEME_TOKENSALE","0","-92169615514614272")
          assert f["exit_event_implied_prepay_credit_wei"]==f["exit_native_balance_plus_gas_wei"]
          assert f["buyer_follower_entry_after_1_5_15min"]=="UNRESOLVED"
          assert s["market_U_fully_qualified"]==0 and s["live_production"]=="NO_GO"
          print("PASS DDAC genuine Dragon fully sold early trade, owner BNB net -0.092169615514614272, 23x19 kept, no fake profitable follow")
          PY
      - name: P4-B frozen 19-CA whole market entrance real buy witness ledger
        shell: bash
        run: |
          python3 -B "$MODEL_DIR/bsc_meme_address_model_v1_p4b_market19.py" --source-dir "$MODEL_DIR" --output /tmp/bsc-p4b-market19.json
          python3 -B - <<'PY'
          import json
          from pathlib import Path
          r=Path("crypto-300-profit-mission/research")
          actual=json.loads(Path("/tmp/bsc-p4b-market19.json").read_text(encoding="utf-8"))
          expected=json.loads((r/"bsc-meme-address-model-v1-p4b-19ca-unified-early-market-buy-evidence-2026-10-14.json").read_text(encoding="utf-8"))
          assert actual==expected,"P4B 19 CA source-pinned whole-market replay mismatch"
          s=actual["summary"]
          assert (s["frozen_major_exact_CAs"],s["original_23_EOA_candidates"],s["full_wallet_CA_denominator"])==(19,23,437)
          assert (s["source_original_signed_early_buy_market_witnesses"],s["earlier_signed_buy_witnesses_within_frozen_23"],s["earlier_signed_buy_witnesses_outside_frozen_23"],s["remaining_major_CAs_not_yet_signed_early_buy_audited"])==(3,1,2,16)
          assert s["global_actual_U_and_sell_capacity_fully_qualified"]==0 and s["actual_profit_ranks"]==0
          assert s["production"]=="NO_GO"
          assert all(x["historical_signed_roundtrip_PnL"]=="UNRESOLVED" and x["following_at_1_5_15min"]=="UNRESOLVED" for x in actual["rows"])
          print("PASS 19/19 original market CA; 3 signed early buys incl one original 23-wallet; no false U or PnL")
          PY
      - name: P4-B original Flap 2026 launchpad signer buys with real quotes and taxes
        shell: bash
        run: |
          python3 -B "$MODEL_DIR/bsc_meme_address_model_v1_p4b_flap_major2.py" --source-dir "$MODEL_DIR" --output /tmp/bsc-p4b-flap-major2.json
          python3 -B - <<'PY'
          import json
          from pathlib import Path
          root=Path("crypto-300-profit-mission/research")
          actual=json.loads(Path("/tmp/bsc-p4b-flap-major2.json").read_text(encoding="utf-8"))
          expected=json.loads((root/"bsc-meme-address-model-v1-p4b-flap-major2-original-buys-and-quotes-2026-10-14.json").read_text(encoding="utf-8"))
          assert actual==expected,"Flap original contract event/tx owner receipt/tax economic source drift"
          assert actual["summary"]["source_original_signed_purchases"]==2
          assert actual["summary"]["signer_recipient_inventory_matches"]==2
          assert actual["summary"]["closed_PnL"]==0
          assert actual["summary"]["production"]=="NO_GO"
          assert all(x["original_EOA_signer"]==x["final_ERC20_recipient"]
                     and x["original_EOA_signer"]!=x["portal_TokenBought_intermediate_buyer"]
                     and x["buyer_in_frozen_23"]=="NO"
                     and x["causal_profit"]=="UNRESOLVED"
