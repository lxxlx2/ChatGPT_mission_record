          s=actual["summary"]
          assert (s["wallets"],s["major_exact_CAs"],s["implicit_wallet_CA_cells"])==(23,19,437)
          assert (s["one_source_proven_owner_signed_pre_dex_buy"],s["remaining_not_audited_owner_early_trade_cells"])==(1,436)
          assert (s["market_U_qualified"],s["repeat_profit_ranks"],s["production"])==(0,0,"NO_GO")
          print("PASS all 437 early owner trade evidence cells; one DDAC pre-DEX buy; 436 not audited are UNKNOWN")
          PY
      - name: P4-B early 19 CA launch-transfer/Helper3 and actual 2026 DDAC Dragon purchase
        shell: bash
        run: |
          python3 -B "$MODEL_DIR/bsc_meme_address_model_v1_p4b_early_origin19.py" --source-dir "$MODEL_DIR" --output /tmp/bsc-p4b-19-early-origin.json
          python3 -B "$MODEL_DIR/bsc_meme_address_model_v1_p4b_dragon_ddac.py" --source-dir "$MODEL_DIR" --output /tmp/bsc-p4b-ddac-dragon-buy.json
          python3 -B - <<'PY'
          import json
          from pathlib import Path
          root=Path("crypto-300-profit-mission/research")
          checks=[
            ("/tmp/bsc-p4b-19-early-origin.json","bsc-meme-address-model-v1-p4b-19ca-early-launch-origin-2026-10-14.json"),
            ("/tmp/bsc-p4b-ddac-dragon-buy.json","bsc-meme-address-model-v1-p4b-dragon-ddac-real-pre-dex-buy-2026-10-14.json"),
          ]
          for out,frozen in checks:
              actual=json.loads(Path(out).read_text(encoding="utf-8"))
              expected=json.loads((root/frozen).read_text(encoding="utf-8"))
              assert actual==expected, f"source-pinned Dragon/19-CA historical replay drift: {frozen}"
          a=json.loads(Path(checks[0][0]).read_text(encoding="utf-8"))
          b=json.loads(Path(checks[1][0]).read_text(encoding="utf-8"))
          assert (a["summary"]["exact_CAs"],a["summary"]["token_transfer_initial_block_precedes_scoped_dex"],a["summary"]["canonical_fourmeme_v2_at_pre_scoped_dex"])==(19,19,12)
          assert a["summary"]["actually_proven_first_market_U"]==0
          assert b["fact"]["buyer_EOA"]=="0xddac928a240bdace3994c2cc0783d4e29a002127"
          assert b["fact"]["TokenPurchase_amount_token_raw"]==b["fact"]["original_erc20_transfer_raw_amount"]
          assert b["fact"]["realized_net_PnL"]=="UNRESOLVED"
          assert b["summary"]["production"]=="NO_GO"
          print("PASS 19/19 pre-DEX early transfers, 12 canonical Four.meme manager witnesses, signed DDAC Dragon 0.8 BNB pre-DEX buy, no fake PnL")
          PY
      - name: P4-B frozen 19 historic original V2 0.01-WBNB route quotes and no-sellability gate
        shell: bash
        run: |
          python3 -B "$MODEL_DIR/bsc_meme_address_model_v1_p4b_router_quotes19.py" --source-dir "$MODEL_DIR" --output /tmp/bsc-p4b-19-router-math.json
          python3 -B - <<'PY'
