permissions:
  contents: read

jobs:
  proof_only:
    name: Frozen source and model output QA
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      MODEL_DIR: crypto-300-profit-mission/research
      FROZEN_BLOB_SHA: 3761b9140d0c64b1ffd8d8d243d63a2a1a4fc690
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Assert checked-out source SHA on PR or manual dispatch
        shell: bash
        env:
          REVIEWED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          [[ "$REVIEWED_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "invalid REVIEWED_HEAD_SHA (need 40 lowercase hex)" >&2; exit 1; }
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            [[ "$EVENT_PR_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "invalid EVENT_PR_HEAD_SHA for pull_request" >&2; exit 1; }
            test "$REVIEWED_HEAD_SHA" = "$EVENT_PR_HEAD_SHA" || { echo "PR expected SHA differs from PR head" >&2; exit 1; }
          elif [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            test -z "$EVENT_PR_HEAD_SHA" || { echo "workflow_dispatch must not contain PR head" >&2; exit 1; }
            [[ "$EVENT_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "invalid EVENT_SHA for workflow_dispatch" >&2; exit 1; }
            test "$REVIEWED_HEAD_SHA" = "$EVENT_SHA" || { echo "manual expected SHA differs from github.sha" >&2; exit 1; }
          else
            echo "Unsupported event for BSC read-only QA: $EVENT_NAME" >&2
            exit 1
          fi
          test "$(git rev-parse HEAD)" = "$REVIEWED_HEAD_SHA" || { echo "checked-out HEAD differs from expected source SHA" >&2; exit 1; }
          echo "PASS $EVENT_NAME direct source SHA checkout $REVIEWED_HEAD_SHA"
      - name: Confirm frozen Git input blob
        shell: bash
        run: |
          actual="$(git hash-object "$MODEL_DIR/BSC_MEME_23_EOA_19_CA_EVIDENCE_COMPLETENESS_OVERLAY_V21_2026-10-12.json")"
          test "$actual" = "$FROZEN_BLOB_SHA" || { echo "frozen Git input blob mismatch" >&2; exit 1; }
      - name: Unit tests (stdlib only; no RPC/no secrets)
        run: |
          python3 -B -m unittest discover -s "$MODEL_DIR" -p "test_bsc_meme_address_model_v1*.py" -v
          python3 -B -m unittest discover -s "$MODEL_DIR" -p "test_bsc_meme_address_model_v1_bulk16.py" -v
      - name: P4-B Flap two real original-signer source replays exact committed JSON (offline only)
        shell: bash
        run: |
          set -euo pipefail
          python3 -B crypto-300-profit-mission/research/bsc_meme_address_model_v1_p4b_flap_nplus1_two_sided_quotes.py > "$RUNNER_TEMP/p4b-flap-nplus1.json"
          python3 -B crypto-300-profit-mission/research/bsc_meme_address_model_v1_p4b_flap_original_quote_portal.py > "$RUNNER_TEMP/p4b-flap-portal.json"
          python3 - "$RUNNER_TEMP/p4b-flap-nplus1.json" "$RUNNER_TEMP/p4b-flap-portal.json" <<'PY'
          import json
          import sys
          from pathlib import Path
          root=Path("crypto-300-profit-mission/research")
          cases=(
            (Path(sys.argv[1]), root/"bsc-meme-address-model-v1-p4b-2026-flap-nplus1-two-sided-expected-replay-2026-10-17.json"),
            (Path(sys.argv[2]), root/"bsc-meme-address-model-v1-p4b-2026-flap-actual-portal-payment-expected-replay-2026-10-17.json"),
          )
          for actual_file, expected_file in cases:
              actual=json.loads(actual_file.read_text(encoding="utf-8"))
              expected=json.loads(expected_file.read_text(encoding="utf-8"))
              assert actual==expected, f"Frozen P4-B source replay differs from committed expected: {expected_file}"
              assert actual["summary"]["P5"]=="BLOCKED" and actual["summary"]["production"]=="NO_GO"
              print(f"PASS strict P4-B Flap source-only deterministic comparison: {expected_file.name}")
          PY
      - name: C0 historical source grades and P4-B 2026 five-owner U static replay
