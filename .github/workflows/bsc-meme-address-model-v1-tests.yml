          print("PASS two source-pinned 2026 Flap early owner signed buys with distinct quotes 1%/3% tax; no exit PnL")
          PY
      - name: P4-B 23-wallet 19-CA early original trade evidence
        shell: bash
        run: |
          python3 -B "$MODEL_DIR/bsc_meme_address_model_v1_p4b_wallet_early_grid23x19.py" --source-dir "$MODEL_DIR" --output /tmp/bsc-p4b-23x19.json
