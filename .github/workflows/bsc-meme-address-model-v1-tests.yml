  macos_bash32_qa:
    name: macOS /bin/bash 3.2 offline BSC regressions
    runs-on: macos-15
    timeout-minutes: 12
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify real macOS /bin/bash 3.2 and exact source checkout
        shell: bash
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(uname -s)" = "Darwin"
          /bin/bash -c 'printf "SYSTEM_BASH_VERSION=%s\\n" "$BASH_VERSION"; test "${BASH_VERSINFO[0]}" -eq 3; test "${BASH_VERSINFO[1]}" -eq 2'
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "invalid macOS source SHA" >&2; exit 1; }
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA" || { echo "macOS source SHA checkout mismatch" >&2; exit 1; }
          echo "PASS macOS native Bash 3.2 source checkout at $SOURCE_SHA"
      - name: Reproduce missing manual SHA and run all BSC source-only tests on macOS
        shell: bash
        run: |
          set -euo pipefail
          /bin/bash --version
          python3 -B -m unittest discover -s crypto-300-profit-mission/research -p 'test_bsc_meme_address_model_v1_workflow_event_identity.py' -v
          python3 -B -m unittest discover -s crypto-300-profit-mission/research -p 'test_bsc*.py'
      - name: macOS P4-B Flap expected JSON source-only replay parity
        shell: bash
        run: |
          set -euo pipefail
          python3 -B crypto-300-profit-mission/research/bsc_meme_address_model_v1_p4b_flap_nplus1_two_sided_quotes.py > "$RUNNER_TEMP/p4b-flap-nplus1.json"
          python3 -B crypto-300-profit-mission/research/bsc_meme_address_model_v1_p4b_flap_original_quote_portal.py > "$RUNNER_TEMP/p4b-flap-portal.json"
          python3 - "$RUNNER_TEMP/p4b-flap-nplus1.json" "$RUNNER_TEMP/p4b-flap-portal.json" <<'PY'
          import json
          import sys
          from pathlib import Path
          root=Path("crypto-300-profit-mission/research")
          cases=(
            (Path(sys.argv[1]), root/"bsc-meme-address-model-v1-p4b-2026-flap-nplus1-two-sided-expected-replay-2026-10-17.json"),
            (Path(sys.argv[2]), root/"bsc-meme-address-model-v1-p4b-2026-flap-actual-portal-payment-expected-replay-2026-10-17.json"),
          )
          for actual_file, expected_file in cases:
              actual=json.loads(actual_file.read_text(encoding="utf-8"))
              expected=json.loads(expected_file.read_text(encoding="utf-8"))
              assert actual==expected, f"Frozen P4-B source replay differs from committed expected: {expected_file}"
              assert actual["summary"]["P5"]=="BLOCKED" and actual["summary"]["production"]=="NO_GO"
              print(f"PASS strict P4-B Flap source-only deterministic comparison: {expected_file.name}")
          PY
