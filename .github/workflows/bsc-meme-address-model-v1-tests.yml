          ledger = json.loads((p / "bsc-meme-address-model-v1-p2-evidence-ledger-2026-10-13.json").read_text(encoding="utf-8"))
          p1 = p / "bsc-meme-address-model-v1-baseline-2026-10-13.json"
          actual_p1_sha = subprocess.check_output(["git", "hash-object", str(p1)], text=True).strip()
          assert ledger["baseline_artifact_git_blob_sha"] == actual_p1_sha
          assert ledger["frozen_source_sha"] == "3761b9140d0c64b1ffd8d8d243d63a2a1a4fc690"
          for source in ledger["source_manifest"]:
              actual = subprocess.check_output(["git", "hash-object", source["path"]], text=True).strip()
              assert actual == source["blob_sha"], f"source drift: {source['path']}"
          blockers = json.loads((p / "bsc-meme-address-model-v1-p2-2026-eligibility-blocker-queue-2026-10-13.json").read_text(encoding="utf-8"))
          episodes = {(e["wallet"], e["exact_ca"], e["episode_index"]) for e in ledger["episodes"]}
          baseline = json.loads(p1.read_text(encoding="utf-8"))
          cohort = {w["wallet"]: {c["ca"] for c in w["cells"] if c["ERC20_presence"] == "PRESENT"}
                    for w in baseline["wallets"]}
          for source in blockers["source_manifest"].values():
              actual = subprocess.check_output(["git", "hash-object", source["path"]], text=True).strip()
              assert actual == source["git_blob_sha"], f"blocker source drift: {source['path']}"
          assert len(blockers["items"]) == 8
          for item in blockers["items"]:
              assert item["wallet"] in cohort and item["ca"] in cohort[item["wallet"]]
              admitted = {i for wallet, ca, i in episodes
                          if wallet == item["wallet"] and ca == item["ca"]}
              assert admitted == set(item["audited_closed_episode_indices"]), (
                  "Only explicitly verified signed same-CA episodes may enter P2"
              )
              assert admitted.isdisjoint(item["blocked_specific_episode_indices"]), (
                  "Unverified episodes falsely counted as owner-signed settled trades"
              )
              assert item["realized_final_PnL"] == "UNRESOLVED"
              assert item["entire_CA_profit_pnl_state"] == "UNRESOLVED"
          print("PASS eight high-priority partial/open/signature-unknown P2 exclusions source-pinned")
          stage3 = json.loads((p / "bsc-meme-address-model-v1-p2-stage3-adff-2adf-owner-closed-rounds-2026-10-13.json").read_text(encoding="utf-8"))
          assert len(stage3["sample_rounds"]) == 3
          assert stage3["summary"]["source_inventory_zero_cycles"] == 28
          assert stage3["summary"]["source_quantity_segments_not_economic"] == 25
          for src in stage3["source_git_refs"]:
              actual = subprocess.check_output(["git", "hash-object", src["path"]], text=True).strip()
              assert actual == src["blob_sha"], f"Stage3 raw source drift: {src['path']}"
          print("PASS Stage3 exactly 3 signer-verified rounds, 25 other raw-only segments disallowed")
          stage4_plan = json.loads((p / "bsc-meme-address-model-v1-p2-stage4-precommitted-2026-10-13.json").read_text(encoding="utf-8"))
          stage4 = json.loads((p / "bsc-meme-address-model-v1-p2-stage4-two-negative-2026-signed-rounds-2026-10-13.json").read_text(encoding="utf-8"))
          for src in stage4_plan["source_manifest"]:
              actual = subprocess.check_output(["git", "hash-object", src["path"]], text=True).strip()
              assert actual == src["git_blob_sha"], f"Stage4 input source drift: {src['path']}"
          assert stage4["selection_git_sha"] == subprocess.check_output(
              ["git", "hash-object", str(p / "bsc-meme-address-model-v1-p2-stage4-precommitted-2026-10-13.json")],
              text=True).strip()
          assert len(stage4["rounds"]) == 2
          assert stage4["summary"]["original_owner_successful_txs"] == 6
          assert stage4["summary"]["unique_native_account_blocks"] == 5
          print("PASS Stage4 source precommit, two negative signed rounds and unique native block de-dup")
          bulk_plan = json.loads((p / "bsc-meme-address-model-v1-p2-bulk16-precommit-2026-10-13.json").read_text(encoding="utf-8"))
          bulk_gate = json.loads((p / "bsc-meme-address-model-v1-p2-bulk16-gate-decisions-2026-10-13.json").read_text(encoding="utf-8"))
          bulk_outcome = json.loads((p / "bsc-meme-address-model-v1-p2-bulk16-verified-outcomes-2026-10-13.json").read_text(encoding="utf-8"))
          for doc in [bulk_plan, bulk_outcome]:
              for src in doc["source_manifest"]:
                  actual = subprocess.check_output(["git", "hash-object", src["path"]], text=True).strip()
                  expected = src.get("sha") or src.get("git_blob_sha")
                  assert actual == expected, f"bulk manifest drift: {src['path']}"
          plan_sha = subprocess.check_output(["git", "hash-object", str(p / "bsc-meme-address-model-v1-p2-bulk16-precommit-2026-10-13.json")], text=True).strip()
          gate_sha = subprocess.check_output(["git", "hash-object", str(p / "bsc-meme-address-model-v1-p2-bulk16-gate-decisions-2026-10-13.json")], text=True).strip()
          assert bulk_gate["frozen_selection_blob_sha"] == plan_sha
          assert bulk_outcome["source_manifest"][1]["git_blob_sha"] == gate_sha
          assert bulk_outcome["summary"]["origin_owner_gate_passed_cycles"] == 13
          assert (bulk_outcome["summary"]["positive_native_scope_cycles"],
                  bulk_outcome["summary"]["negative_native_scope_cycles"]) == (9, 4)
          assert bulk_outcome["summary"]["unique_native_wallet_balance_blocks"] == 31
          print("PASS 16 precommitted raw cycles, 39 tx, 13 signed economic cycles, 31 archived unique blocks, 9pos 4neg, three blocked")
          print("PASS P2 source Git blobs pinned to exact evidence originals")
          PY
