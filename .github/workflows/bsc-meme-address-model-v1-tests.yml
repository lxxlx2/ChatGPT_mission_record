name: BSC address model V1 (read-only research)

on:
  pull_request:
    paths:
      - ".github/workflows/bsc-meme-address-model-v1-tests.yml"
      - "crypto-300-profit-mission/research/bsc_meme_address_model_v1.py"
      - "crypto-300-profit-mission/research/bsc_meme_address_model_v1_p2.py"
      - "crypto-300-profit-mission/research/bsc_meme_address_model_v1_p3.py"
      - "crypto-300-profit-mission/research/bsc_meme_address_model_v1_p3_swap.py"
      - "crypto-300-profit-mission/research/bsc_meme_address_model_v1_p3_batch.py"
      - "crypto-300-profit-mission/research/bsc_meme_address_model_v1_p4.py"
      - "crypto-300-profit-mission/research/bsc_meme_address_model_v1_p4_funding.py"
      - "crypto-300-profit-mission/research/bsc_meme_address_model_v1_p4_factory190.py"
      - "crypto-300-profit-mission/research/bsc_meme_address_model_v1_p4_first_liquidity.py"
      - "crypto-300-profit-mission/research/bsc_meme_address_model_v1_p4_liquidity19.py"
      - "crypto-300-profit-mission/research/bsc_meme_address_model_v1_p4_competing22.py"
      - "crypto-300-profit-mission/research/bsc_meme_address_model_v1_p4_competing_first4.py"
      - "crypto-300-profit-mission/research/test_bsc_meme_address_model_v1_p4_competing_first4.py"
      - "crypto-300-profit-mission/research/bsc_meme_address_model_v1_p4_priority4_competitors.py"
      - "crypto-300-profit-mission/research/test_bsc_meme_address_model_v1_p4_priority4_competitors.py"
      - "crypto-300-profit-mission/research/bsc_meme_address_model_v1_p4_competing4_creation.py"
      - "crypto-300-profit-mission/research/bsc_meme_address_model_v1_p4_competing17.py"
      - "crypto-300-profit-mission/research/test_bsc_meme_address_model_v1_p4_competing17.py"
      - "crypto-300-profit-mission/research/test_bsc_meme_address_model_v1_p4_competing4_creation.py"
      - "crypto-300-profit-mission/research/test_bsc_meme_address_model_v1_p4_competing22.py"
      - "crypto-300-profit-mission/research/bsc_meme_address_model_v1_p4_competing4_origin.py"
      - "crypto-300-profit-mission/research/test_bsc_meme_address_model_v1_p4_competing4_origin.py"
      - "crypto-300-profit-mission/research/bsc-meme-address-model-v1-p4-*.json"
      - "crypto-300-profit-mission/research/bsc-meme-address-model-v1-implementation-plan-2026-10-13.md"
      - "crypto-300-profit-mission/research/test_bsc_meme_address_model_v1_p4_liquidity19.py"
      - "crypto-300-profit-mission/research/test_bsc_meme_address_model_v1_p4_first_liquidity.py"
      - "crypto-300-profit-mission/research/test_bsc_meme_address_model_v1_p4_factory190.py"
      - "crypto-300-profit-mission/research/test_bsc_meme_address_model_v1_p4_funding.py"
      - "crypto-300-profit-mission/research/test_bsc_meme_address_model_v1_p4.py"
      - "crypto-300-profit-mission/research/test_bsc_meme_address_model_v1_p3_batch.py"
      - "crypto-300-profit-mission/research/test_bsc_meme_address_model_v1_p3_swap.py"
      - "crypto-300-profit-mission/research/test_bsc_meme_address_model_v1_p3.py"
      - "crypto-300-profit-mission/research/test_bsc_meme_address_model_v1.py"
      - "crypto-300-profit-mission/research/test_bsc_meme_address_model_v1_p2.py"
      - "crypto-300-profit-mission/research/test_bsc_meme_address_model_v1_stage4.py"
      - "crypto-300-profit-mission/research/test_bsc_meme_address_model_v1_bulk16.py"
      - "crypto-300-profit-mission/research/bsc-meme-address-model-v1-*.json"
      - "crypto-300-profit-mission/research/bsc-meme-address-model-v1-*.md"
      - "crypto-300-profit-mission/research/README_BSC_MEME_TOP_TRADERS.md"
      - "crypto-300-profit-mission/research/BSC_MEME_23_EOA_19_CA_EVIDENCE_COMPLETENESS_OVERLAY_V21_2026-10-12.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proof_only:
    name: Frozen source and model output QA
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      MODEL_DIR: crypto-300-profit-mission/research
      FROZEN_BLOB_SHA: 3761b9140d0c64b1ffd8d8d243d63a2a1a4fc690
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Confirm frozen Git input blob
        shell: bash
        run: |
          actual="$(git hash-object "$MODEL_DIR/BSC_MEME_23_EOA_19_CA_EVIDENCE_COMPLETENESS_OVERLAY_V21_2026-10-12.json")"
          test "$actual" = "$FROZEN_BLOB_SHA"
      - name: Unit tests (stdlib only; no RPC/no secrets)
        run: |
          python3 -B -m unittest discover -s "$MODEL_DIR" -p "test_bsc_meme_address_model_v1*.py" -v
          python3 -B -m unittest discover -s "$MODEL_DIR" -p "test_bsc_meme_address_model_v1_bulk16.py" -v
      - name: P4 full 17 competing first active source and event semantic replay
        shell: bash
        run: |
          python3 -B "$MODEL_DIR/bsc_meme_address_model_v1_p4_competing17.py" --source-dir "$MODEL_DIR" --output /tmp/bsc-p4-17-actual.json
          python3 -B - <<'PY'
          import json
          from pathlib import Path
          root=Path("crypto-300-profit-mission/research")
          actual=json.loads(Path("/tmp/bsc-p4-17-actual.json").read_text(encoding="utf-8"))
          frozen=json.loads((root/"bsc-meme-address-model-v1-p4-competing17-first-active-unified-2026-10-14.json").read_text(encoding="utf-8"))
          assert actual == frozen, "17 pool source chain / frozen output mismatch"
          assert len(actual["rows"])==17
          assert sum(x["delay_blocks"]==0 for x in actual["rows"])==15
          assert [x["delay_blocks"] for x in actual["rows"] if x["delay_blocks"]>0]==[10,17]
          assert all(x["first_global_trade"]=="UNRESOLVED" and x["follower_profit"]=="UNRESOLVED" for x in actual["rows"])
          assert actual["summary"]["production"]=="NO_GO"
          print("PASS frozen 17/17 competing pools; 15 creation active, two genuine Swap-activated pools; no market/alpha claim")
          PY
      - name: P3 frozen 23-wallet original-signer semantic replay
        shell: bash
        run: |
          python3 -B "$MODEL_DIR/bsc_meme_address_model_v1_p3.py" --source-dir "$MODEL_DIR" --output /tmp/bsc-model-v1-p3-actual.json
          python3 -B - <<'PY'
          import json
          from pathlib import Path
          model = Path("crypto-300-profit-mission/research")
          frozen = json.loads((model / "bsc-meme-address-model-v1-p3-signer-evidence-overlay-2026-10-13.json").read_text(encoding="utf-8"))
          fresh = json.loads(Path("/tmp/bsc-model-v1-p3-actual.json").read_text(encoding="utf-8"))
          assert frozen == fresh, "P3 provenance/source regression: STOP"
          assert fresh["summary"]["original_hashes_pending"] == 55
          assert fresh["summary"]["confirmed_owner_market_swaps"] == 0
          assert all(x["recent_30d_true_owner_market_swap"] == "UNRESOLVED" for x in fresh["wallets"])
          print("PASS P3 pinned 23-wallet 19-CA overlay / 71 original hashes / no false swap or PnL")
          PY
      - name: P3 full 71-hash original-signer replay (no false executed swaps)
        shell: bash
        run: |
          python3 -B "$MODEL_DIR/bsc_meme_address_model_v1_p3.py" --full-source --source-dir "$MODEL_DIR" --output /tmp/bsc-model-v1-p3-full71.json
          python3 -B - <<'PY'
          import json
          from pathlib import Path
          a = json.loads(Path("/tmp/bsc-model-v1-p3-full71.json").read_text(encoding="utf-8"))
          s = a["summary"]
          assert len(a["source_manifest"]) == 13
          assert (s["wallets"], s["exact_CA"], s["erc20_transfer_events"]) == (23, 19, 89)
          assert (s["original_hashes_read"], s["original_hashes_parsed"], s["original_hashes_unreadable"]) == (71, 70, 1)
          assert (s["confirmed_owner_original_wallet_tx_pairs"],
                  s["confirmed_third_party_original_wallet_tx_pairs"],
                  s["unread_wallet_tx_pairs"]) == (38, 36, 1)
          assert s["original_hashes_pending"] == 0
          assert s["confirmed_owner_market_swaps"] == 0 and s["production"] == "NO_GO"
          assert all(w["recent_30d_true_owner_market_swap"] == w["realized_profit"] == "UNRESOLVED"
                     for w in a["wallets"])
          print("PASS P3 71 original tx / 70 parsed / 1 unreadable / 38 owner / 36 third-party wallet pairings; no executable market swap evidence asserted")
          PY
      - name: P3 witnessed real owner Meme swap and no PnL/alpha claims
        shell: bash
        run: |
          python3 -B "$MODEL_DIR/bsc_meme_address_model_v1_p3_swap.py" --source-dir "$MODEL_DIR" --output /tmp/bsc-p3-proven-owner-swap.json
          python3 -B - <<'PY'
          import json
          from pathlib import Path
          out = json.loads(Path("/tmp/bsc-p3-proven-owner-swap.json").read_text(encoding="utf-8"))
          s = out["summary"]
          assert (s["wallets"], s["frozen_CAs"], s["original_hashes_read"],
                  s["wallets_with_verified_recent_true_swap"],
                  s["remaining_owner_original_pairs_without_full_swap_evidence"]) == (23,19,71,1,37)
          assert len(out["source_manifest"]) == 14 and s["production"] == "NO_GO"
          assert s["realized_PnL_rank_available"] is False and s["followable_alpha_proven"] is False
          assert [r["wallet"] for r in out["wallets"]
                  if r["recent_true_owner_meme_swap_state"] == "VERIFIED_ACTIVE_ON_FROZEN_19_CA"] == [
                      "0xa83b73f5644cde337b61da79589f10ea15548811"]
          assert all(r["realized_PnL"] == "UNRESOLVED" for r in out["wallets"])
          print("PASS one 2026-10-12 A83B/TST real owner-signed V3 pool swap; 22 wallet states unknown; no profit/followability claim")
          PY
      - name: P3 37 frozen owner tx pool-route and receipt causal gates
        shell: bash
        run: |
          python3 -B "$MODEL_DIR/bsc_meme_address_model_v1_p3_batch.py" --source-dir "$MODEL_DIR" --output /tmp/bsc-p3-batch37.json
          python3 -B - <<'PY'
          import json
          from pathlib import Path
          d = json.loads(Path("/tmp/bsc-p3-batch37.json").read_text(encoding="utf-8"))
          s = d["summary"]
          assert (s["wallets"],s["candidate_owner_tx_excluding_prior"],
                  s["new_confirmed_owner_swap_txs"],s["prior_confirmed_owner_swap_txs"],
                  s["total_confirmed_owner_swap_txs"]) == (23,37,19,1,20)
          assert (s["pool_swap_seen_but_receipt_status_unverified"],
                  s["direct_pool_swap_not_found_routing_unknown"],
                  s["historical_verified_pools"]) == (4,14,11)
          assert (s["wallets_with_confirmed_frozen_CA_recent_swap"],
                  s["wallets_without_confirmed_swap_still_unknown"]) == (7,16)
          assert all(w["lifetime_pnl"] == "UNRESOLVED" and w["follower_alpha"] == "UNRESOLVED"
                     for w in d["wallets"])
          assert s["production"] == "NO_GO"
          ready = [w for w in d["wallets"] if w["latest_verified_swap_UTC"]]
          assert len(ready) == 7
          assert sum(w["latest_verified_swap_UTC"] is None for w in d["wallets"]) == 16
          assert next(w for w in ready if w["wallet"].startswith("0xa83b"))["latest_verified_swap_UTC"] == "2026-10-12T07:57:23.000Z"
          print("PASS P3 37-batch: 19 proven swap + 4 receipt-unknown + 14 route-unknown; total 20 with prior, 7 UTC verified wallets, NO_GO")
          PY
      - name: P4 23-wallet source-pinned P2/P3 cross-phase readiness matrix
        shell: bash
        run: |
          python3 -B "$MODEL_DIR/bsc_meme_address_model_v1_p4.py" --source-dir "$MODEL_DIR" --output /tmp/bsc-model-v1-p4-actual.json
          python3 -B - <<'PY'
          import json
          from pathlib import Path
          model = Path("crypto-300-profit-mission/research")
          a = json.loads(Path("/tmp/bsc-model-v1-p4-actual.json").read_text(encoding="utf-8"))
          b = json.loads((model / "bsc-meme-address-model-v1-p4-p2p3-readiness-matrix-2026-10-13.json").read_text(encoding="utf-8"))
          assert a == b, "P4 source output differs from committed 23-wallet matrix"
          s = a["summary"]
          assert (s["wallets"],s["strict19CA_30day_owner_swap_verified_wallets"],
                  s["sampled_two_plus_major_positive_with_recent_activity"],
                  s["recent_active_but_economics_incomplete"],s["recent_swap_unknown_wallets"]) == (23,7,4,3,16)
          assert s["full_2026_economic_PnL_proven_wallets"] == s["qualified_major_misses_proven"] == 0
          assert not s["executable_follower_alpha_proven"] and s["production"] == "NO_GO"
          print("PASS P4 23 complete P2/P3 comparator rows: 4 research priority, 3 active economics incomplete, 16 unknown, no traded PnL or follower alpha")
          PY
      - name: P4 pinned 4-wallet capital and native funding probe replay
        shell: bash
        run: |
          python3 -B "$MODEL_DIR/bsc_meme_address_model_v1_p4_funding.py" --source-dir "$MODEL_DIR" --output /tmp/bsc-model-v1-p4-funding.json
          python3 -B - <<'PY'
          import json
          from pathlib import Path
          d = json.loads(Path("/tmp/bsc-model-v1-p4-funding.json").read_text(encoding="utf-8"))
          s = d["summary"]
          assert (s["wallets"], s["funding_probed_wallets"], s["other_wallets_unprobed"]) == (23,4,19)
          assert (s["native_external_inbound_windows_fully_paginated"],
                  s["selected_quote_windows_fully_paginated"],s["selected_quote_windows_partial"]) == (4,3,1)
          assert (s["native_external_inbound_records"], s["known_selected_ERC20_inbound_records"]) == (20,28)
          assert s["control_attribution_proven"] == 0 and s["qualified_major_opportunity_misses"] == "UNRESOLVED"
          assert s["production"] == "NO_GO"
          assert len(d["source_manifest"]) == 9
          assert all(x["common_controller"] == x["qualified_missed_opportunity"] == "UNRESOLVED"
                     for x in d["wallets"])
          print("PASS P4 funding: 4 BNB/quote historical snapshots + 4 complete native inbound windows, DDAC quote partial, 23 retained, NO_GO")
          PY
      - name: P4 19 frozen major CAs x 190 factory historical calls replay
        shell: bash
        run: |
          python3 -B "$MODEL_DIR/bsc_meme_address_model_v1_p4_factory190.py" --source-dir "$MODEL_DIR" --output /tmp/bsc-p4-factory190.json
          python3 -B - <<'PY'
          import json
          from pathlib import Path
          d = Path("crypto-300-profit-mission/research")
          a = json.loads(Path("/tmp/bsc-p4-factory190.json").read_text(encoding="utf-8"))
          b = json.loads((d / "bsc-meme-address-model-v1-p4-19ca-factory190-discovery-2026-10-13.json").read_text(encoding="utf-8"))
          assert a == b, "P4 factory190 source replay vs Git mismatch"
          s = a["summary"]
          assert (s["major_exact_CAs"],s["required_factory_calls"],s["parsed_factory_calls"],
                  s["factory_nonzero_slots"],s["factory_zero_slots"]) == (19,190,190,161,29)
          assert len(a["source_manifest"]) == 16 and s["production"] == "NO_GO"
          assert s["code_verified_for_nonzero_pools"] == 0
          assert s["first_executable_timestamp_confirmed"] == s["qualified_profitable_misses"] == 0
          print("PASS 190/190 pinned historical factories, 19 major CAs, 161 addresses; NO tradability or PnL inferred")
          PY
      - name: P4 original PairCreated Mint Sync 4-wallet liquidity evidence
        shell: bash
        run: |
          python3 -B "$MODEL_DIR/bsc_meme_address_model_v1_p4_first_liquidity.py" --source-dir "$MODEL_DIR" --output /tmp/bsc-p4-initial-reserves.json
          python3 -B - <<'PY'
          import json
          from pathlib import Path
          d = json.loads(Path("/tmp/bsc-p4-initial-reserves.json").read_text(encoding="utf-8"))
          s = d["summary"]
          assert (s["priority_wallets"], s["source_confirmed_V2_WBNB_pair_creations"],
                  s["initial_Mint_and_Sync_same_creation_tx"], s["positive_initial_WBNB_reserves"],
                  s["same_block_swap_confirmed_pools"]) == (4,4,4,4,2)
          assert {x["token"]:x["first_positive_WBNB_reserve_BNB"] for x in d["rows"]} == {
              "龙虾": "17.639999998157599996", "币安人生": "17.639999998157599996",
              "MARSCOIN": "0.00103", "牛来": "0.1"
          }
          assert s["qualified_follower_entry_proven"] == s["profit_proven"] == 0
          assert s["production"] == "NO_GO"
          print("PASS 4 historical V2 PairCreated+Mint+Sync first liquidity; no full-universe first tradable or alpha")
          PY
      - name: P4 19 V2 WBNB first positive liquidity all exact CAs
        shell: bash
        run: |
          python3 -B "$MODEL_DIR/bsc_meme_address_model_v1_p4_liquidity19.py" --source-dir "$MODEL_DIR" --output /tmp/bsc-p4-v2-liquidity19.json
          python3 -B - <<'PY'
          import json
          from pathlib import Path
          model = Path("crypto-300-profit-mission/research")
          a=json.loads(Path("/tmp/bsc-p4-v2-liquidity19.json").read_text(encoding="utf-8"))
          b=json.loads((model/"bsc-meme-address-model-v1-p4-19ca-v2-wbnb-first-positive-liquidity-2026-10-14.json").read_text(encoding="utf-8"))
          assert a==b, "P4 19CA first liquidity replay differs from source-pinned Git artifact"
          s=a["summary"]
          assert (s["exact_major_CAs"],s["v2_wbnb_pool_creation_verified"],
                  s["first_positive_v2_wbnb_reserves_verified"],
                  s["first_positive_same_creation_tx"],s["delayed_first_liquidity"])==(19,19,19,18,1)
          assert s["delayed_giggle_blocks"] == 407
          assert (s["global_first_tradable_proven"],s["qualified_misses_proven"],
                  s["follower_alpha_proven"]) == (0,0,0)
          assert s["production"]=="NO_GO"
          print("PASS P4 full 19 CAs V2 first positive liquidity: 18 creation mints + GIGGLE 407-block delay, no inferred follower alpha")
          PY
      - name: P4 competing historical V2 V3 first-liquidity cross-venue guards
        shell: bash
        run: |
          python3 -B "$MODEL_DIR/bsc_meme_address_model_v1_p4_competing22.py" --source-dir "$MODEL_DIR" --output /tmp/bsc-p4-competing22.json
          python3 -B - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("/tmp/bsc-p4-competing22.json").read_text(encoding="utf-8"))
          f=Path("crypto-300-profit-mission/research/bsc-meme-address-model-v1-p4-19ca-competing22-liquidity-snapshot-2026-10-14.json")
          assert d==json.loads(f.read_text(encoding="utf-8")), "22 pool evidence replay mismatches pinned source"
          s=d["summary"]
          assert (s["major_CAs"],s["source_competing_slots"],s["provider_reads_complete"])==(19,22,22)
          assert (s["V2_USDT_with_positive_reserves"],s["V3_active_initialized_at_V2_baseline"],
                  s["V3_no_active_liquidity_at_baseline"]) == (2,15,5)
          assert (s["earlier_first_positive_proven"],s["qualified_misses_proven"]) == (0,0)
          assert s["production"]=="NO_GO"
          print("PASS 171 historical factory reads; 22 competing pool liquidity snapshots: 17 active/5 inactive, no inferred first global entry")
          PY
      - name: P4 four source-pinned competing creation and early-liquidity proofs
        shell: bash
        run: |
          python3 -B "$MODEL_DIR/bsc_meme_address_model_v1_p4_competing4_creation.py" --source-dir "$MODEL_DIR" --output /tmp/bsc-p4-competitor4.json
          python3 -B - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path("/tmp/bsc-p4-competitor4.json").read_text(encoding="utf-8"))
          s=a["summary"]
          assert (s["precommitted_competing_pools"],s["creation_event_audited"],
                  s["unexamined_other_active_competitors"],s["inactive_at_reference_retained"]) == (17,4,13,5)
          assert (s["positive_active_at_creation"],s["initial_mint_but_zero_active"],
                  s["earliest_global_executable_trades"],s["qualified_wallet_misses"]) == (3,1,0,0)
          assert [r["creation_initial_USDT"] for r in a["rows"]] == [
              "20","538.70512342330123571","0","13.18055194816814023"]
          assert s["production"] == "NO_GO" and len(a["source_manifest"]) == 10
          print("PASS four original V2/V3 pool creations: 3 in-range positives, one out-of-range; 13 pending, five inactive preserved; no alpha")
          PY
      - name: P4 priority competing-pool raw creation and active liquidity source audit
        shell: bash
        run: |
          python3 -B "$MODEL_DIR/bsc_meme_address_model_v1_p4_priority4_competitors.py" --source-dir "$MODEL_DIR" --output /tmp/bsc-p4-competitors.json
          python3 -B - <<'PY'
          import json
          from pathlib import Path
          path=Path("crypto-300-profit-mission/research")
          a=json.loads(Path("/tmp/bsc-p4-competitors.json").read_text(encoding="utf-8"))
          b=json.loads((path/"bsc-meme-address-model-v1-p4-priority4-competitor-creation-verified-2026-10-14.json").read_text(encoding="utf-8"))
          assert a==b, "competing source-pinned model differs from Git artifact"
          s=a["summary"]
          assert (s["competing_pools"],s["active_at_creation"],s["inactive_at_creation"])==(4,3,1)
          assert s["full_market_earliest_tradability"]==0 and s["qualified_misses"]==0 and s["production"]=="NO_GO"
          assert a["rows"][2]["v3_liquidity_at_creation_wei"]=="0"
          print("PASS four original competing pool creation witnesses, 3 active and 1 out-of-range. NO_GO")
          PY
      - name: P4 first active cross-pool priority 4 historical source replay
        shell: bash
        run: |
          python3 -B "$MODEL_DIR/bsc_meme_address_model_v1_p4_competing_first4.py" --source-dir "$MODEL_DIR" --output /tmp/bsc-p4-priority4-first-active.json
          python3 -B - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("/tmp/bsc-p4-priority4-first-active.json").read_text(encoding="utf-8"))
          expected=json.loads(Path("crypto-300-profit-mission/research/bsc-meme-address-model-v1-p4-priority4-competing-first-active-2026-10-14.json").read_text(encoding="utf-8"))
          assert d == expected
          s=d["summary"]
          assert (s["frozen_competitor_pools"],s["positive_at_creation"],
                  s["delayed_in_range_active"],s["qualified_misses"]) == (4,3,1,0)
          assert s["production"]=="NO_GO"
          assert all(x["first_globally_tradable"]=="UNRESOLVED" for x in d["rows"])
          print("PASS priority 4 competitor pool initial-liquidity: one delayed in-range Mint +17 blocks; no follower alpha inferred")
          PY
      - name: P4 immutable 4 competitor creation liquidity and false-alpha guards
        shell: bash
        run: |
