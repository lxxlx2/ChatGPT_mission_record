          expected=json.loads((r/"bsc-meme-address-model-v1-p4b-19ca-v2-001wbnb-router-math-quotes-2026-10-14.json").read_text(encoding="utf-8"))
          assert actual==expected, "19 CA historical quote state or fixed original amount drift"
          s=actual["summary"]
          assert (s["exact_CAs"],s["raw_historical_pair_reads_complete"],s["raw_historical_v2_router_buy_quotes_complete"],s["reserve_formula_cross_checks_passed"])==(19,19,19,19)
