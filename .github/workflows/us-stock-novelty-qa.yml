name: US Stock Daily Novelty QA (push only)
on:
  push:
    branches: [main]
    paths:
      - 'us-stock-daily/scripts/novelty_gate.mjs'
      - 'us-stock-daily/tests/test_novelty_gate.mjs'
      - 'airdrop-tge-monitor/scripts/action_gate.mjs'
      - 'airdrop-tge-monitor/tests/test_action_gate.mjs'
      - 'us-stock-daily/delivery-pending/*.json'
      - '.github/workflows/us-stock-novelty-qa.yml'
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check regression tests
        run: node --test us-stock-daily/tests/test_novelty_gate.mjs
      - name: Check existing TGE action gate regressions
        run: node --test airdrop-tge-monitor/tests/test_action_gate.mjs
      - name: Check changed report manifests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p us-stock-daily/delivery-qa
          for f in $(git diff --name-only HEAD^ HEAD -- 'us-stock-daily/delivery-pending/*.json'); do
            if [[ -f "$f" ]]; then
              draft_status=$(node -e 'const fs=require("fs");const x=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));process.stdout.write(String(x.qa_status||x.status||""))' "$f")
              if [[ "$draft_status" == "SUPERSEDED_DELIVERED_DO_NOT_SEND" ]]; then
                echo "Superseded historical draft, audit-only; skip editorial QA and never resend: $f"
                continue
              fi
              node us-stock-daily/scripts/novelty_gate.mjs "$f"
              day=$(basename "$f" .json)
              manifest_sha=$(git hash-object "$f")
              gate_sha=$(git hash-object us-stock-daily/scripts/novelty_gate.mjs)
              printf '{"schema":"US_STOCK_NOVELTY_CI_V1","status":"NOVELTY_QA_PASS","report_date":"%s","manifest_blob_sha":"%s","gate_blob_sha":"%s","limitation":"Does not verify external facts or Gmail delivery"}\n' "$day" "$manifest_sha" "$gate_sha" > "us-stock-daily/delivery-qa/$day.json"
            fi
          done
      - name: Persist GitHub Node self-test proof (not report receipt)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p us-stock-daily/delivery-qa
          gate_sha=$(git hash-object us-stock-daily/scripts/novelty_gate.mjs)
          printf '{"status":"NODE_TESTS_PASSED_NOT_A_DAILY_REPORT","gate_sha":"%s"}\n' "$gate_sha" > us-stock-daily/delivery-qa/_ci-selftest.json
          git add -- us-stock-daily/delivery-qa/
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'us-stock-daily: GitHub Node novelty self-test [skip ci]'
          git push origin HEAD:main
