name: Frank F1d bounded synthetic process observation

on:
  push:
    branches: [feature/frank-c2a-f1d-offline-bounded-process-observer-20261026]
  pull_request:
    branches: [feature/frank-c2a-f1c-offline-release-supervisor-20261026]

permissions:
  contents: read

jobs:
  bounded-fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pinned fixture test dependency
        run: python -m pip install pytest==8.3.5
      - name: Compile all isolated F1 - F1d modules and test files
        working-directory: crypto-300-profit-mission/local-agent
        run: |
          python -B -m py_compile scripts/frank_c2a_f1_evidence.py scripts/frank_c2a_f1b_offline_recovery.py scripts/frank_c2a_f1c_offline_supervisor.py scripts/frank_c2a_f1d_offline_process_observer.py tests/test_frank_c2a_f1_evidence.py tests/test_frank_c2a_f1b_offline_recovery.py tests/test_frank_c2a_f1c_offline_supervisor.py tests/test_frank_c2a_f1d_offline_process_observer.py
      - name: Test all synthetic F1 through F1d scenarios
        working-directory: crypto-300-profit-mission/local-agent
        env:
          PYTHONPATH: .
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -B -m pytest -q -p no:cacheprovider tests/test_frank_c2a_f1_evidence.py tests/test_frank_c2a_f1b_offline_recovery.py tests/test_frank_c2a_f1c_offline_supervisor.py tests/test_frank_c2a_f1d_offline_process_observer.py
