name: Meme FOMO Crosschain Readonly Tests
on:
  push:
    branches:
      - review/meme-ca-v3-integrate-main-20261008
    paths:
      - 'crypto-300-profit-mission/local-agent/mission_agent/meme/fomo_crosschain.py'
      - 'crypto-300-profit-mission/local-agent/scripts/audit_frank_fomo_crosschain.py'
      - 'crypto-300-profit-mission/local-agent/tests/test_fomo_crosschain.py'
      - '.github/workflows/meme-fomo-crosschain-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: meme-fomo-crosschain-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test-readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: 'crypto-300-profit-mission/local-agent/pyproject.toml'
      - name: Install pinned test dependencies
        working-directory: crypto-300-profit-mission/local-agent
        run: |
          python -m pip install -e '.[dev]'
          python -m pip install 'numpy==2.3.3'
      - name: Compile new code
        working-directory: crypto-300-profit-mission/local-agent
        run: |
          python -B -m py_compile mission_agent/meme/fomo_crosschain.py scripts/audit_frank_fomo_crosschain.py tests/test_fomo_crosschain.py
      - name: Offline FOMO proof tests
        working-directory: crypto-300-profit-mission/local-agent
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -B -m pytest -q -p no:cacheprovider tests/test_fomo_crosschain.py
      - name: Full local-agent regressions
        working-directory: crypto-300-profit-mission/local-agent
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -B -m pytest -q -p no:cacheprovider
