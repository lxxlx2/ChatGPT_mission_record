name: Monster V4 Research Baseline
on:
  push:
    branches:
      - research/monster-v4-local-discovery-20261010
  pull_request:
    paths:
      - 'crypto-300-profit-mission/monster/**'
      - 'crypto-300-profit-mission/local-agent/mission_agent/early/forward_observation.py'
      - 'crypto-300-profit-mission/local-agent/tests/test_monster_forward_observation.py'
      - 'crypto-300-profit-mission/local-agent/scripts/monster_v4_neutral_control_replay.py'
      - 'crypto-300-profit-mission/local-agent/tests/test_monster_v4_neutral_control_replay.py'
      - 'crypto-300-profit-mission/local-agent/config/monster_v4_research_candidate.json'
      - 'crypto-300-profit-mission/local-agent/scripts/monster_v4_baseline_audit.py'
      - 'crypto-300-profit-mission/local-agent/tests/test_monster_v4_baseline_audit.py'
      - 'crypto-300-profit-mission/local-agent/scripts/monster_v4_export_event_packet.py'
      - 'crypto-300-profit-mission/local-agent/tests/test_monster_v4_export_event_packet.py'
      - 'crypto-300-profit-mission/local-agent/scripts/monster_full_market_history_diagnostic.py'
      - 'crypto-300-profit-mission/local-agent/tests/test_monster_full_market_history_diagnostic.py'
      - '.github/workflows/monster-v4-research-baseline.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: monster-v4-research-${{ github.ref }}
  cancel-in-progress: true

jobs:
  anti-drift-budget:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.ref == 'research/monster-v4-local-discovery-20261010'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check Monster anti-drift owner contract and weekly budgets
        shell: bash
        run: |
          python3 - <<'PY'
          import datetime as dt
          import json
          import pathlib
          import re
          import subprocess
          import sys

          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()

          root = pathlib.Path('crypto-300-profit-mission/monster')
          gov = root / 'governance'
          contract = gov / 'MONSTER_ANTI_DRIFT_OPERATING_CONTRACT_20261028.md'
          budget_path = gov / 'budget.json'
          baseline = '8a993f7805c1acf96555b069fb7909876bd42bec'
          expected = {str(contract): 'eb644b329e5a9e1ec11759095b6ac908dc092a3d', str(budget_path): 'e827bd01d25d30579dcfaee3b256924468ee6195'}
          for path, sha in expected.items():
              if git('hash-object', path) != sha:
                  raise SystemExit('OWNER_FROZEN_CONTRACT_MODIFIED: ' + path)
          if subprocess.run(['git', 'merge-base', '--is-ancestor', baseline, 'HEAD']).returncode:
              raise SystemExit('ANCHOR_NOT_ANCESTOR: cannot trust budget counts')
          budget = json.loads(budget_path.read_text())
          limits = {
              'commits': budget['max_commits_per_week'],
              'new_monster_md': budget['max_new_monster_md_per_week'],
              'new_scripts': budget['max_new_scripts_per_week'],
              'new_workflows': budget['max_new_workflows'],
          }
          if budget['phase'] != 'P0_KILL_TEST' or budget['paid_source_usd'] != 0:
              raise SystemExit('UNAUTHORIZED_PHASE_OR_SPEND')
          if any(type(value) is not int or value < 0 for value in limits.values()):
              raise SystemExit('INVALID_BUDGET_LIMITS')
          commits = git('rev-list', '--first-parent', '--reverse', baseline + '..HEAD').splitlines()
          weeks = {}
          for sha in commits:
              stamp = dt.datetime.fromisoformat(git('show','-s','--format=%cI',sha))
              stamp = stamp.astimezone(dt.timezone.utc)
              monday = (stamp - dt.timedelta(days=stamp.weekday())).date().isoformat()
              c = weeks.setdefault(monday, dict.fromkeys(limits, 0))
              c['commits'] += 1
              added = git('diff-tree','--no-commit-id','--name-only','-r','--diff-filter=A',sha).splitlines()
              for path in added:
                  if path.startswith('.github/workflows/') and path.endswith(('.yml','.yaml')):
                      c['new_workflows'] += 1
                  if path.startswith('crypto-300-profit-mission/monster/') and path.endswith('.md'):
                      c['new_monster_md'] += 1
                  if path.endswith('.py') and (path.startswith('crypto-300-profit-mission/monster/')
                        or path.startswith('crypto-300-profit-mission/local-agent/mission_agent/early/')
                        or (path.startswith('crypto-300-profit-mission/local-agent/scripts/')
                            and 'monster' in path.lower())):
                      c['new_scripts'] += 1
                  if re.search(r'monster.*stage[_-]?[0-9]+', path, re.IGNORECASE):
                      raise SystemExit('NEW_MONSTER_STAGE_FILE_FORBIDDEN: ' + path)
          for week, observed in sorted(weeks.items()):
              for name, used in observed.items():
                  if used > limits[name]:
                      raise SystemExit(f'WEEKLY_BUDGET_EXCEEDED week={week} {name}={used}/{limits[name]}')
              print('MONSTER_BUDGET_WEEK',week,json.dumps(observed,sort_keys=True))
          this_week = (dt.datetime.now(dt.timezone.utc)
                        - dt.timedelta(days=dt.datetime.now(dt.timezone.utc).weekday())).date().isoformat()
          reports = sorted((gov / 'weekly').glob('*.md'))
          for report in reports:
              lines = report.read_text().splitlines()
              if len(lines) > 60:
                  raise SystemExit('WEEKLY_REPORT_OVER_60_LINES: ' + str(report))
              if not any(line.startswith('## 本周唯一指标：N_VALID = ') for line in lines):
                  raise SystemExit('WEEKLY_REPORT_NO_MEASURABLE_P0_N: '+str(report))
          if dt.datetime.now(dt.timezone.utc) >= dt.datetime.fromisoformat(budget['phase_deadline_utc'].replace('Z','+00:00')):
              raise SystemExit('P0_PHASE_DEADLINE_REACHED_OWNER_DECISION_REQUIRED')
          print('ANTI_DRIFT_BUDGET_PASS',len(commits),'new commits',len(reports),'weekly reports')
          PY

  historical-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test finite BSC V2 forward observer and RPC batch fail-closed
        working-directory: crypto-300-profit-mission/local-agent
        run: |
          PYTHONPATH=. python -B -m py_compile mission_agent/early/forward_observation.py tests/test_monster_forward_observation.py
          PYTHONPATH=. python -B -m unittest discover -v -s tests -p test_monster_forward_observation.py
      - name: Compile baseline script and tests
        run: python -B -m py_compile crypto-300-profit-mission/local-agent/scripts/monster_v4_baseline_audit.py crypto-300-profit-mission/local-agent/tests/test_monster_v4_baseline_audit.py
      - name: Reproduce evidence and independently check frozen config/validation
        working-directory: crypto-300-profit-mission/local-agent
        run: python -B -m unittest discover -v -s tests -p test_monster_v4_baseline_audit.py
      - name: Compile and test read-only Mac evidence exporter
        working-directory: crypto-300-profit-mission/local-agent
        run: |
          python -B -m py_compile scripts/monster_v4_export_event_packet.py tests/test_monster_v4_export_event_packet.py
          python -B -m unittest discover -v -s tests -p test_monster_v4_export_event_packet.py
      - name: Full-universe research replay synthetic tests
        working-directory: crypto-300-profit-mission/local-agent
        run: |
          python -B -m py_compile scripts/monster_full_market_history_diagnostic.py tests/test_monster_full_market_history_diagnostic.py
          python -B -m unittest discover -v -s tests -p test_monster_full_market_history_diagnostic.py
      - name: Hermetic Monster V4 shadow queue and failure-recovery regression
        working-directory: crypto-300-profit-mission/local-agent
        run: |
          python -B -m py_compile scripts/monster_v4_shadow.py tests/test_monster_v4_shadow.py
          python -B -m unittest discover -v -s tests -p test_monster_v4_shadow.py
      - name: Monster offline opportunity inspector real D0 D1 D2 lifecycle
        working-directory: crypto-300-profit-mission/local-agent
        run: |
          python -B -m py_compile scripts/monster_v4_opportunity_snapshot.py tests/test_monster_v4_opportunity_snapshot.py
          python -B -m unittest discover -v -s tests -p test_monster_v4_opportunity_snapshot.py
      - name: Frozen exposed-market economic no-go research gate
        working-directory: crypto-300-profit-mission/local-agent
        run: |
          python -B -m py_compile scripts/monster_v4_economic_readiness.py tests/test_monster_v4_economic_readiness.py
          python -B -m unittest discover -v -s tests -p test_monster_v4_economic_readiness.py
          python -B scripts/monster_v4_economic_readiness.py --format text
      - name: Monster D2 read-only 30 USDT executable order-book model regressions
        working-directory: crypto-300-profit-mission/local-agent
        run: |
          python -B -m py_compile scripts/monster_v4_d2.py tests/test_monster_v4_d2.py
          python -B -m unittest discover -v -s tests -p test_monster_v4_d2.py
          python -B scripts/monster_v4_d2_evidence.py
      - name: Historical 1m Binance source and true-time D0 price probe (NOT full V4 replay)
        working-directory: crypto-300-profit-mission/local-agent
        run: |
          python -B -m py_compile scripts/monster_v4_historical_price_probe.py tests/test_monster_v4_historical_price_probe.py
          python -B -m unittest discover -v -s tests -p test_monster_v4_historical_price_probe.py
          python -B scripts/monster_v4_historical_price_probe.py
      - name: Audit all 60 officially collected historical sources and early-listing gaps
        working-directory: crypto-300-profit-mission/local-agent
        run: |
          python -B -m py_compile scripts/monster_v4_history_source_quality.py tests/test_monster_v4_history_source_quality.py
          python -B -m unittest discover -v -s tests -p test_monster_v4_history_source_quality.py
          python -B scripts/monster_v4_history_source_quality.py > /tmp/monster_v4_stage7_quality.json
          python -c 'import json; d=json.load(open("/tmp/monster_v4_stage7_quality.json")); print(json.dumps({"SOURCE60_AUDIT_COUNTS":d["status_counts"],"BY_COHORT":d["cohorts"],"NEW_LISTING":d["new_listing_proxy_valid_24h_warmup"]}))'
      - name: Stage7 authentic 60h 1m data same-production D0 and D1 replay, skip gap cases
        working-directory: crypto-300-profit-mission/local-agent
        run: |
          python -B -m py_compile scripts/monster_v4_historical_replay.py tests/test_monster_v4_historical_replay.py
          python -B -m unittest discover -v -s tests -p test_monster_v4_historical_replay.py
          python -B scripts/monster_v4_historical_replay.py --output /tmp/monster_v4_stage7_actual.json > /tmp/monster_v4_stage7_stdout.json
          python -c 'import json; d=json.load(open("/tmp/monster_v4_stage7_actual.json")); print(json.dumps({"STAGE7_REAL_BINANCE_REPLAY_SUMMARY":d["summary"],"PER_CASE":[{"symbol":x["symbol"],"cohort":x["cohort"],"watches":x["watch_count"],"setups":x["d1_setups"],"first_watch":x["first_watch_utc"],"old_anchor":x["old_research_watch_utc"]} for x in d["cases"]],"SKIPPED":d["skipped"]},sort_keys=True))'
      - name: Stage8 authentic-source purely exploratory volume and price causal feature comparison
        working-directory: crypto-300-profit-mission/local-agent
        run: |
          python -B -m py_compile scripts/monster_v4_causal_feature_research.py tests/test_monster_v4_causal_feature_research.py
          python -B -m unittest discover -v -s tests -p test_monster_v4_causal_feature_research.py
          python -B scripts/monster_v4_causal_feature_research.py > /tmp/monster_v4_stage8_research.json
          python -c 'import json; d=json.load(open("/tmp/monster_v4_stage8_research.json")); print(json.dumps({"STAGE8_CAUSAL_RESEARCH":d["summary"],"RULES":d["rules"],"CASES":d["frozen_historical_event_cases"],"NOT_UNSEEN_VALIDATION":d["thresholds_pre_exposed_to_2021_2026_data"]},sort_keys=True))'
      - name: Stage9 historical first-listing short 24h warmup via same V4 D0 and D1 (separate stratum)
        working-directory: crypto-300-profit-mission/local-agent
        run: |
          python -B -m py_compile scripts/monster_v4_short_history_replay.py tests/test_monster_v4_short_history_replay.py
          python -B -m unittest discover -v -s tests -p test_monster_v4_short_history_replay.py
          python -B scripts/monster_v4_short_history_replay.py > /tmp/monster_stage9_short.json
          python -c 'import json; d=json.load(open("/tmp/monster_stage9_short.json")); print(json.dumps({"STAGE9_SHORT_HISTORY_SUMMARY":d["cohorts"],"ELIGIBLE":d["eligible"],"SOURCE_FAILURES":d["source_failures"],"NEW_LISTING_CASES":d["new_listing_venue_cases"],"CASES":[{"venue":x["venue"],"symbol":x["symbol"],"first":x["first_available_utc"],"watch":x["first_watch_utc"],"setup":x["d1_setups"],"minutes_before_anchor":x["first_available_minutes_before_old_watch"]} for x in d["cases"]],"REJECTED":d["rejected"]},sort_keys=True))'
      - name: Stage10 pre-registered 24 symbol-time neutral-control true V4 D0/D1 replay
        working-directory: crypto-300-profit-mission/local-agent
        run: |
          python -B -m py_compile scripts/monster_v4_neutral_control_replay.py tests/test_monster_v4_neutral_control_replay.py
          python -B -m unittest discover -v -s tests -p test_monster_v4_neutral_control_replay.py
          python -B scripts/monster_v4_neutral_control_replay.py --output /tmp/monster_stage10_actual_neutral.json
      - name: Monster macOS isolated installation and rollback contract (hermetic)
        working-directory: crypto-300-profit-mission/local-agent
        run: |
          python -B -m py_compile scripts/monster_v4_mac_service.py tests/test_monster_v4_mac_service.py
          python -B -m unittest discover -v -s tests -p test_monster_v4_mac_service.py
      - name: Stage5 frozen 60-case plus 18 short-listing integrity gate
        working-directory: crypto-300-profit-mission/local-agent
        run: |
          python -B -m py_compile scripts/monster_stage5_integrity.py tests/test_monster_stage5_integrity.py
          python -B -m unittest discover -v -s tests -p test_monster_stage5_integrity.py
          python -B scripts/monster_stage5_integrity.py
      - name: Print research-only machine summary
        working-directory: crypto-300-profit-mission/local-agent
        run: python -B scripts/monster_v4_baseline_audit.py
