name: Monster V4 Research Baseline
on:
  push:
    branches:
      - research/monster-v4-local-discovery-20261010
    paths:
      - 'crypto-300-profit-mission/monster/**'
      - 'crypto-300-profit-mission/local-agent/config/monster_v4_research_candidate.json'
      - 'crypto-300-profit-mission/local-agent/scripts/monster_v4_baseline_audit.py'
      - 'crypto-300-profit-mission/local-agent/tests/test_monster_v4_baseline_audit.py'
      - 'crypto-300-profit-mission/local-agent/scripts/monster_v4_export_event_packet.py'
      - 'crypto-300-profit-mission/local-agent/tests/test_monster_v4_export_event_packet.py'
      - 'crypto-300-profit-mission/local-agent/scripts/monster_full_market_history_diagnostic.py'
      - 'crypto-300-profit-mission/local-agent/tests/test_monster_full_market_history_diagnostic.py'
      - 'crypto-300-profit-mission/local-agent/scripts/monster_v4_shadow.py'
      - 'crypto-300-profit-mission/local-agent/tests/test_monster_v4_shadow.py'
      - 'crypto-300-profit-mission/local-agent/scripts/monster_stage5_integrity.py'
      - 'crypto-300-profit-mission/local-agent/tests/test_monster_stage5_integrity.py'
      - '.github/workflows/monster-v4-research-baseline.yml'
  pull_request:
    paths:
      - 'crypto-300-profit-mission/monster/**'
      - 'crypto-300-profit-mission/local-agent/config/monster_v4_research_candidate.json'
      - 'crypto-300-profit-mission/local-agent/scripts/monster_v4_baseline_audit.py'
      - 'crypto-300-profit-mission/local-agent/tests/test_monster_v4_baseline_audit.py'
      - 'crypto-300-profit-mission/local-agent/scripts/monster_v4_export_event_packet.py'
      - 'crypto-300-profit-mission/local-agent/tests/test_monster_v4_export_event_packet.py'
      - 'crypto-300-profit-mission/local-agent/scripts/monster_full_market_history_diagnostic.py'
      - 'crypto-300-profit-mission/local-agent/tests/test_monster_full_market_history_diagnostic.py'
      - '.github/workflows/monster-v4-research-baseline.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: monster-v4-research-${{ github.ref }}
  cancel-in-progress: true

jobs:
  historical-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile baseline script and tests
        run: python -B -m py_compile crypto-300-profit-mission/local-agent/scripts/monster_v4_baseline_audit.py crypto-300-profit-mission/local-agent/tests/test_monster_v4_baseline_audit.py
      - name: Reproduce evidence and independently check frozen config/validation
        working-directory: crypto-300-profit-mission/local-agent
        run: python -B -m unittest discover -v -s tests -p test_monster_v4_baseline_audit.py
      - name: Compile and test read-only Mac evidence exporter
        working-directory: crypto-300-profit-mission/local-agent
        run: |
          python -B -m py_compile scripts/monster_v4_export_event_packet.py tests/test_monster_v4_export_event_packet.py
          python -B -m unittest discover -v -s tests -p test_monster_v4_export_event_packet.py
      - name: Full-universe research replay synthetic tests
        working-directory: crypto-300-profit-mission/local-agent
        run: |
          python -B -m py_compile scripts/monster_full_market_history_diagnostic.py tests/test_monster_full_market_history_diagnostic.py
          python -B -m unittest discover -v -s tests -p test_monster_full_market_history_diagnostic.py
      - name: Hermetic Monster V4 shadow queue and failure-recovery regression
        working-directory: crypto-300-profit-mission/local-agent
        run: |
          python -B -m py_compile scripts/monster_v4_shadow.py tests/test_monster_v4_shadow.py
          python -B -m unittest discover -v -s tests -p test_monster_v4_shadow.py
      - name: Stage5 frozen 60-case plus 18 short-listing integrity gate
        working-directory: crypto-300-profit-mission/local-agent
        run: |
          python -B -m py_compile scripts/monster_stage5_integrity.py tests/test_monster_stage5_integrity.py
          python -B -m unittest discover -v -s tests -p test_monster_stage5_integrity.py
          python -B scripts/monster_stage5_integrity.py
      - name: Print research-only machine summary
        working-directory: crypto-300-profit-mission/local-agent
        run: python -B scripts/monster_v4_baseline_audit.py
