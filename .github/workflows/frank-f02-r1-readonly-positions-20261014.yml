name: Frank F02-R1 isolated readonly research positions
on:
  push:
    branches:
      - dev/frank-f02-r1-isolated-readonly-position-api-20261014
  workflow_dispatch:
permissions:
  contents: read
jobs:
  module:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependencies
        working-directory: crypto-300-profit-mission/local-agent
        run: python -m pip install -e '.[dev]' numpy==2.3.3 pyflakes==3.4.0
      - name: Static and JS syntax
        working-directory: crypto-300-profit-mission/local-agent
        run: |
          python -B -m compileall -q scripts/frank_f02_readonly_positions_api.py tests/test_frank_f02_r1_readonly_positions_api.py
          python -m pyflakes scripts/frank_f02_readonly_positions_api.py tests/test_frank_f02_r1_readonly_positions_api.py
          node --check mission_agent/mission_control/static/app.js
      - name: F02 research API plus original A05 sources
        working-directory: crypto-300-profit-mission/local-agent
        run: |
          python -B -m pytest -q -p no:cacheprovider tests/test_frank_f02_r1_readonly_positions_api.py tests/test_frank_a05_r2_frozen32_offline.py tests/test_frank_a05_complete_rpc_receipts.py tests/test_frank_a05_f02_latest_inventory.py
      - name: Full local-agent regression with actual Git evidence
        working-directory: crypto-300-profit-mission/local-agent
        env:
          FRANK_EXPECT_REAL_GIT_REPLAY: '1'
        run: python -B -m pytest -q -p no:cacheprovider tests
  combined:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exact source plus C02 and F01 on latest main (disposable)
        run: |
          set -eu
          git config user.name "F02 CI"
          git config user.email "ci@example.invalid"
          git fetch --no-tags origin "+refs/heads/*:refs/remotes/origin/*"
          git switch --force-create f02-isolated-combined origin/main
          echo "MAIN_AT_RUN=$(git rev-parse HEAD)"
          for ref in "$GITHUB_SHA" 8898134a8a302e1187138f7fb3da87a554567e6d 516e3335a134c608f477019b79027982f43af32a
          do
            git merge --no-edit --no-ff "$ref"
            echo "INTEGRATED_INPUT=$ref"
          done
          echo "INTEGRATED_SHA=$(git rev-parse HEAD)"
      - name: Dependencies
        working-directory: crypto-300-profit-mission/local-agent
        run: python -m pip install -e '.[dev]' numpy==2.3.3 pyflakes==3.4.0
      - name: F02 A05 C02 F01 focused and JS integration
        working-directory: crypto-300-profit-mission/local-agent
        run: |
          node --check mission_agent/mission_control/static/app.js
          node tests/ca_identity_render.cjs
          python -B -m pytest -q -p no:cacheprovider tests/test_frank_f02_r1_readonly_positions_api.py tests/test_frank_a05_r2_frozen32_offline.py tests/test_frank_a05_complete_rpc_receipts.py tests/test_frank_a05_f02_latest_inventory.py tests/test_follow_opportunity_f01.py tests/test_follow_opportunity_f01_integration.py tests/test_frank_ca_c02_claude_review_regression.py
      - name: Full disposable integration regression
        working-directory: crypto-300-profit-mission/local-agent
        env:
          FRANK_EXPECT_REAL_GIT_REPLAY: '1'
        run: python -B -m pytest -q -p no:cacheprovider tests
