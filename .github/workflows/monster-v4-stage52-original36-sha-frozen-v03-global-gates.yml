name: Monster Stage52 Frozen P1v03 Original36 USD-M Global Urgent Budget Evidence
on:
  push:
    branches:
      - research/monster-v4-local-discovery-20261010
    paths:
      - 'crypto-300-profit-mission/local-agent/scripts/monster_v4_stage52_original36_sha_frozen_v03_global_urgent_gates.py'
      - '.github/workflows/monster-v4-stage52-original36-sha-frozen-v03-global-gates.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  strict_original36_sha_frozen_stage49_v03_actual_global_budget:
    runs-on: ubuntu-latest
    timeout-minutes: 95
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Require exact source36 original run SUCCESS, never merge incomplete shards
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 270); do
            gh api repos/lxxlx2/ChatGPT_mission_record/actions/runs/38218974455 >/tmp/monster51_run.json
            state=$(python -c 'import json;print(json.load(open("/tmp/monster51_run.json"))["status"])')
            if test "$state" = completed; then
              python - <<'PY'
          import json
          j=json.load(open('/tmp/monster51_run.json'))
          if j['conclusion']!='success':raise SystemExit('STAGE52_NEEDS_ALL36_ORIGINAL_REAL_SHA_PASS')
          print('STAGE52_ORIGINAL_SOURCE36_ALL_SUCCESS')
          PY
              break
            fi
            sleep 15
          done
          test "$state" = completed
      - name: Freeze exact SHA of all real original36 GitHub ZIP artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api 'repos/lxxlx2/ChatGPT_mission_record/actions/runs/38218974455/artifacts?per_page=100' >/tmp/monster51_artifacts.json
          python - <<'PY'
          import json,re
          from pathlib import Path
          art=json.load(open('/tmp/monster51_artifacts.json'))['artifacts']
          if len(art)!=36:raise SystemExit('STAGE52_EXPECT36_SOURCE_ARTIFACTS')
          keys=set();entries=[]
          for a in art:
            m=re.fullmatch(r'monster-stage51-fresh-real1m-(\d{4}-\d\d-\d\d)-shard([0-5])-V4-P1v03-SHA',a['name'])
            if not m or a.get('expired') or not a.get('digest','').startswith('sha256:'):
              raise SystemExit('STAGE52_BAD_ORIGINAL_GITHUB_SOURCE_IDENTITY_OR_SHA')
            k=(m.group(1),int(m.group(2)))
            if k in keys:raise SystemExit('STAGE52_DUPLICATE_SHARD')
            keys.add(k)
            entries.append({'date':k[0],'shard':k[1],'artifact_id':a['id'],'zip_sha256':a['digest'].split(':')[1]})
          Path('/tmp/monster52_manifest.json').write_text(json.dumps({'source_run_id':38218974455,'artifacts':entries}))
          Path('/tmp/monster52_ids').write_text('\n'.join(str(x['artifact_id']) for x in entries)+'\n')
          print('STAGE52_ALL36_ORIGINAL_ARTIFACT_HASHES_FROZEN')
          PY
      - name: Redownload all36 exact original GitHub ZIP bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/monster52_zips
          while read -r aid; do
            gh api -H 'Accept: application/vnd.github+json' "repos/lxxlx2/ChatGPT_mission_record/actions/artifacts/$aid/zip" > "/tmp/monster52_zips/$aid.zip"
          done </tmp/monster52_ids
      - name: Original V4 first 2x5x10x true-minutes and Stage49 frozen globally budgeted urgent priority
        run: |
          python -B -m py_compile crypto-300-profit-mission/local-agent/scripts/monster_v4_stage52_original36_sha_frozen_v03_global_urgent_gates.py
          python -B crypto-300-profit-mission/local-agent/scripts/monster_v4_stage52_original36_sha_frozen_v03_global_urgent_gates.py \
            --manifest /tmp/monster52_manifest.json \
            --zip-dir /tmp/monster52_zips \
            --out /tmp/monster52_results
      - name: Retain original36 byte-SHA source-backed full5400 model result and all global budget fates
        uses: actions/upload-artifact@v4
        with:
          name: monster-stage52-original36-sha-frozen-v03-global-limit-full5400
          path: /tmp/monster52_results/*
          retention-days: 30
      - name: Persist actual passed OR failed gates and original full market into same Monster PR
        run: |
          test "$GITHUB_REF_NAME" = research/monster-v4-local-discovery-20261010
          dest=crypto-300-profit-mission/monster/evidence
          cp /tmp/monster52_results/monster_stage52_* "$dest/"
          git add "$dest/monster_stage52_pinned_v03_all5400_36SHA_true_global_cap_metrics.json" "$dest/monster_stage52_all5400_originalV4_P1v03_true_minute_source_cases.jsonl" "$dest/monster_stage52_all_real_v03_eligible_and_global_budget_fates.jsonl"
          if git diff --cached --quiet; then
            echo STAGE52_ALREADY_COMMITTED
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'monster: persist Stage52 actual official source36 SHA global P1v03 full market frozen gates'
          for attempt in 1 2 3 4; do
            git fetch origin "$GITHUB_REF_NAME"
            git rebase FETCH_HEAD
            if git push origin "HEAD:$GITHUB_REF_NAME"; then exit 0; fi
          done
          echo STAGE52_GIT_NOT_FASTFORWARD_NO_FORCE
          exit 1
