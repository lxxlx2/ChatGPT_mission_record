name: Monster Stage29 All1132 Official Meme WATCH Burst Vs Net Cost Regime Research
on:
  push:
    branches:
      - research/monster-v4-local-discovery-20261010
    paths:
      - 'crypto-300-profit-mission/local-agent/scripts/monster_v4_stage29_watch_burst_price_research.py'
      - 'crypto-300-profit-mission/local-agent/tests/test_monster_v4_stage29_watch_burst_price_research.py'
      - '.github/workflows/monster-v4-stage29-meme-watch-regime-source-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: monster-stage29-1132-watch-original-source-${{ github.ref }}
  cancel-in-progress: true
jobs:
  all-original-stage26-36-zip-actual-1123-meme-signal-cost-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Source identity, burst group leakage and censored outcome regressions
        working-directory: crypto-300-profit-mission/local-agent
        run: |
          python -B -m py_compile scripts/monster_v4_stage29_watch_burst_price_research.py tests/test_monster_v4_stage29_watch_burst_price_research.py
          python -B -m unittest discover -v -s tests -p test_monster_v4_stage29_watch_burst_price_research.py
      - name: Fetch exactly all 36 original SHA registered Stage26 real Binance-verified full-week Spot V4 artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY' > /tmp/monster29_prior_artifacts.tsv
          import json
          from pathlib import Path
          p=Path("crypto-300-profit-mission/monster/evidence/monster_stage26_verified_sharded_168h_artifact_proof_20261011.json")
          x=json.loads(p.read_text())
          if x["source_ci_conclusion"]!="SUCCESS_ALL_36" or len(x["artifacts"])!=36:
              raise SystemExit("STAGE29_FROZEN_ORIGINAL_SOURCE_SHAS_BAD")
          for r in sorted(x["artifacts"],key=lambda y:(y["date"],y["shard"])):
              print(r["date"],r["shard"],r["artifact_id"])
          PY
          while read -r day shard artifact; do
            gh api -H 'Accept: application/vnd.github+json' repos/lxxlx2/ChatGPT_mission_record/actions/artifacts/"$artifact"/zip > "/tmp/monster_stage26_${day}_shard${shard}.zip"
          done < /tmp/monster29_prior_artifacts.tsv
      - name: Rehash all original source ZIP and JSON and measure all 1132 old WATCHs with 20bps and 100bps real archived price proxies
        working-directory: crypto-300-profit-mission/local-agent
        run: |
          args=()
          while read -r day shard artifact; do
            args+=("/tmp/monster_stage26_${day}_shard${shard}.zip")
          done < /tmp/monster29_prior_artifacts.tsv
          python -B scripts/monster_v4_stage29_watch_burst_price_research.py --stage26-original-zips "${args[@]}" --output /tmp/monster_stage29_all1132_watch_burst_vs_price_proxy_regime.json
      - name: Persist every 98 simultaneous meme signal, day strata and actual missed/censored cash opportunity
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: monster-stage29-original36-sha-meme-burst-1132-watch-cost-diagnostic
          path: /tmp/monster_stage29_all1132_watch_burst_vs_price_proxy_regime.json
          if-no-files-found: warn
          retention-days: 30
