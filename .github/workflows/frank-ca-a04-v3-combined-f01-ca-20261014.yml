name: Frank A04 V3 combined F01 C02 current-main integration
on:
  push:
    branches:
      - fix/frank-ca-a04-v3-immutable-view-upgrade-20261014
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-merges:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build actual combined A04, CA and F01 source tree
        run: |
          set -eu
          git config user.name "CI integration only"
          git config user.email "ci-only@example.invalid"
          git fetch --no-tags origin "+refs/heads/*:refs/remotes/origin/*"
          git switch --force-create ci-frank-v3-merged origin/main
          for ref in             origin/fix/frank-ca-a04-v3-immutable-view-upgrade-20261014             origin/fix/frank-ca-c02-identity-preview-casefold-review-20261014             origin/dev/frank-ca-f01-actionable-view-20261013
          do
            echo "COMBINED_MERGE_START: $ref"
            if ! git merge --no-edit --no-ff "$ref"; then
              echo "COMBINED_MERGE_CONFLICT: $ref"
              git diff --name-only --diff-filter=U
              exit 2
            fi
            echo "COMBINED_MERGE_PASS: $ref"
          done
          echo "COMBINED_MERGE_SHA=$(git rev-parse HEAD)"
      - name: Install test-only deps
        working-directory: crypto-300-profit-mission/local-agent
        run: |
          python -m pip install -e '.[dev]' numpy==2.3.3 pyflakes==3.4.0
      - name: Cross-module UI, real ATA and V2 to V3 regression
        working-directory: crypto-300-profit-mission/local-agent
        run: |
          node --check mission_agent/mission_control/static/app.js
          node tests/ca_identity_render.cjs
          python -B -m pytest -q -p no:cacheprovider tests/test_frank_a04_v2_v3_upgrade.py tests/test_frank_a04_claude_fourth_review.py tests/test_frank_ca_c02_claude_review_regression.py tests/test_follow_opportunity_f01.py tests/test_follow_opportunity_f01_integration.py tests/test_frank_ca_c01_c08_no_default_quote.py
      - name: Whole merged source real Git test suite
        working-directory: crypto-300-profit-mission/local-agent
        env:
          FRANK_EXPECT_REAL_GIT_REPLAY: '1'
        run: |
          python -B -m pytest -q -p no:cacheprovider tests
