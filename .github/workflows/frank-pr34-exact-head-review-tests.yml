name: Frank PR34 exact-head integration review tests

on:
  push:
    branches:
      - review/frank-pr31-pr32-pr33-integration-20261012
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-branch-head:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Assert tested Git SHA is workflow HEAD
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git status --porcelain)" = ""
          echo "EXACT_PR34_HEAD=$GITHUB_SHA"
          echo "EXACT_TREE=$(git rev-parse HEAD^{tree})"
      - name: Install pinned development tooling
        working-directory: crypto-300-profit-mission/local-agent
        run: |
          python -m pip install -e '.[dev]'
          python -m pip install numpy==2.3.3 pyflakes==3.4.0
      - name: Compile combined backend and frontend
        working-directory: crypto-300-profit-mission/local-agent
        run: |
          python -B -m compileall -q mission_agent/mission_control scripts tests
          node --check mission_agent/mission_control/static/app.js
          python -m pyflakes mission_agent/mission_control/evidence_sync.py mission_agent/mission_control/delivery_review.py scripts/reauthorize_existing_gmail.py scripts/deploy_frank_dashboard_review_badge.py
      - name: R6 Google OAuth value and historic-delivery wording regression
        working-directory: crypto-300-profit-mission/local-agent
        run: |
          python -B -m pytest -q -p no:cacheprovider \
            tests/test_meme_evidence_sync.py::test_r6_unkeyed_google_oauth_material_is_redacted \
            tests/research/test_delivery_review_breakdown.py::test_r6_dashboard_text_only_claims_sqlite_record
      - name: PR31 PR32 PR33 combined regression suite
        working-directory: crypto-300-profit-mission/local-agent
        run: |
          python -B -m pytest -q -p no:cacheprovider \
            tests/test_frank_ata_backfill_v1.py \
            tests/test_meme_evidence_sync.py \
            tests/test_frank_wallet_watchlist_v2.py \
            tests/research/test_frank_git_real_transfer_replay.py \
            tests/research/test_reauthorize_existing_gmail.py \
            tests/research/test_delivery_review_breakdown.py \
            tests/research/test_delivery_review_integration.py \
            tests/research/test_frank_dashboard_deploy.py \
            tests/research/test_frank_dashboard_readonly_acceptance.py
      - name: Full Frank local-agent suite with real Git replay
        working-directory: crypto-300-profit-mission/local-agent
        env:
          FRANK_EXPECT_REAL_GIT_REPLAY: "1"
        run: python -B -m pytest -q -p no:cacheprovider tests
