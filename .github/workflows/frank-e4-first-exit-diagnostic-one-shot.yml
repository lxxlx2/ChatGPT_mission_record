name: Frank E4 First Exit Final Instruction Diagnosis
on:
  push:
    branches: [review/meme-ca-v3-integrate-main-20261008]
    paths: ['.github/workflows/frank-e4-first-exit-diagnostic-one-shot.yml']
permissions:
  contents: read
jobs:
  e4-swap-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Inspect one known root signed token-to-USDC transaction
        run: |
          python3 - <<'PY'
          import json,urllib.request,hashlib,re
          sig="2aemk5HoVVnCFfYQD1sci4B4Fddr5govJLbcJe9aHEBXaFSr4K7ht9PudQ5taVmyWXio4Y87iBiF6HyFqu3kiShZ"
          body=json.dumps({"jsonrpc":"2.0","id":1,"method":"getTransaction",
            "params":[sig,{"encoding":"jsonParsed","commitment":"finalized",
                             "maxSupportedTransactionVersion":1}]}).encode()
          try:
            r=urllib.request.Request("https://api.mainnet-beta.solana.com",data=body,
                                     headers={"Content-Type":"application/json"})
            with urllib.request.urlopen(r,timeout=20) as f:tx=json.load(f)["result"]
            if not tx:raise ValueError("TX_NOT_FOUND")
            meta=tx["meta"];keys=tx["transaction"]["message"]["accountKeys"]
            names=[x["pubkey"] for x in keys];logs=meta.get("logMessages") or []
            stack=[];bound=[]
            invocation=re.compile(r"^Program ([1-9A-HJ-NP-Za-km-z]{32,44}) invoke \[(\d+)\]$")
            returned=re.compile(r"^Program ([1-9A-HJ-NP-Za-km-z]{32,44}) (?:success|failed:.*)$")
            for line in logs:
              q=invocation.fullmatch(line)
              if q:stack.append(q.group(1));continue
              q=returned.fullmatch(line)
              if q:
                if stack and stack[-1]==q.group(1):stack.pop()
                continue
              if "Instruction: " in line:
                bound.append({"program":stack[-1] if stack else None,
                              "name":line.split("Instruction: ",1)[1][:80]})
            alpha="123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz"
            def b58(v):
              n=0
              for char in v:n=n*58+alpha.index(char)
              return bytes([0])*(len(v)-len(v.lstrip("1")))+(
                   n.to_bytes((n.bit_length()+7)//8,"big") if n else b"")
            programs=[]
            groups=[tx["transaction"]["message"].get("instructions") or []]
            groups += [x.get("instructions") or [] for x in meta.get("innerInstructions") or []]
            opcodes={k:hashlib.sha256(("global:"+k).encode()).digest()[:8].hex()
                     for k in ("swap2","sell","swap","swap_base_input","swap_base_output",
                               "swap_exact_in","swap_exact_out","route")}
            for group in groups:
              for x in group:
                program=x.get("programId")
                if program is None and isinstance(x.get("programIdIndex"),int):
                  program=names[x["programIdIndex"]]
                if not isinstance(program,str):continue
                if isinstance(x.get("data"),str):
                  raw=b58(x["data"]);header=raw[:8].hex()
                  programs.append({"program":program,"prefix_hex":header,
                      "matches":[k for k,v in opcodes.items() if v==header]})
            result={"success":meta.get("err") is None,
              "signers":[x["pubkey"] for x in keys if x.get("signer")],
              "opcode_logs":bound[:50],"raw_instruction_headers":programs[:60],
              "last_logs":logs[-6:],"open_log_stack":stack[-4:]}
            print("DIAGNOSTIC_JSON:",json.dumps(result,separators=(",",":")))
            print("STATUS: OBSERVED_PUBLIC_FINALIZED_TRANSACTION")
          except Exception as e:
            print("STATUS: UNVERIFIED_PUBLIC_RPC",type(e).__name__,str(e)[:140])
          PY
