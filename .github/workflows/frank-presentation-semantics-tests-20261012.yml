name: Frank historical-payment presentation safety

on:
  push:
    branches:
      - fix/frank-presentation-history-semantics-20261012
  workflow_dispatch:

permissions:
  contents: read

jobs:
  presentation-and-full-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pin exact tested commit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo "PRESENTATION_FIX_HEAD=$GITHUB_SHA"
      - name: Install local test dependencies
        working-directory: crypto-300-profit-mission/local-agent
        run: |
          python -m pip install -e '.[dev]'
          python -m pip install numpy==2.3.3
      - name: JS syntax and targeted presentation / delivery tests
        working-directory: crypto-300-profit-mission/local-agent
        run: |
          node --check mission_agent/mission_control/static/app.js
          python -B -m pytest -q -p no:cacheprovider tests/research/test_frank_dashboard_priority_layout.py tests/test_mission_control_delivery.py
      - name: Full local agent regression including genuine Git replay
        working-directory: crypto-300-profit-mission/local-agent
        env:
          FRANK_EXPECT_REAL_GIT_REPLAY: '1'
        run: python -B -m pytest -q -p no:cacheprovider tests
