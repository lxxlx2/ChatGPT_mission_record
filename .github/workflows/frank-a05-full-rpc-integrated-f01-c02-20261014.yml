name: Frank A05 exact-wire full RPC disposable F01 C02 integration
on:
  push:
    branches:
      - dev/frank-a05-complete-owner-rpc-evidence-20261014
      - fix/frank-a05-rpc-transport-integrity-20261014
  workflow_dispatch:
permissions:
  contents: read
jobs:
  combined:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Combine source exact SHA and frozen approved C02 + F01 on current main
        run: |
          set -eu
          git config user.name "CI isolated integration"
          git config user.email "ci-only@example.invalid"
          git fetch --no-tags origin "+refs/heads/*:refs/remotes/origin/*"
          git switch --force-create ci-a05-wire-source origin/main
          echo "MAIN_AT_RUN=$(git rev-parse HEAD)"
          for ref in             "$GITHUB_SHA"             8898134a8a302e1187138f7fb3da87a554567e6d             516e3335a134c608f477019b79027982f43af32a
          do
            echo "INTEGRATION_ADD: $ref"
            if ! git merge --no-edit --no-ff "$ref"; then
              echo "INTEGRATION_CONFLICT: $ref"
              git diff --name-only --diff-filter=U
              exit 2
            fi
            echo "INTEGRATION_PASS: $ref"
          done
          echo "INTEGRATED_SHA=$(git rev-parse HEAD)"
      - name: Install test deps
        working-directory: crypto-300-profit-mission/local-agent
        run: |
          python -m pip install -e '.[dev]' numpy==2.3.3 pyflakes==3.4.0
      - name: Focused full-response, latest source, A04, F01/C02 integration
        working-directory: crypto-300-profit-mission/local-agent
        run: |
          node --check mission_agent/mission_control/static/app.js
          node tests/ca_identity_render.cjs
          python -B -m pytest -q -p no:cacheprovider tests/test_frank_a05_complete_rpc_receipts.py tests/test_frank_a05_f02_latest_inventory.py tests/test_frank_a04_a05_chain_capture.py tests/test_frank_ca_c02_claude_review_regression.py tests/test_follow_opportunity_f01.py tests/test_follow_opportunity_f01_integration.py
      - name: Full combined local-agent real Git regression
        working-directory: crypto-300-profit-mission/local-agent
        env:
          FRANK_EXPECT_REAL_GIT_REPLAY: '1'
        run: |
          python -B -m pytest -q -p no:cacheprovider tests
