name: Monster Stage21 Strict SHA Ten Date Artifact Recompute
on:
  push:
    branches:
      - research/monster-v4-local-discovery-20261010
    paths:
      - 'crypto-300-profit-mission/local-agent/scripts/monster_v4_stage21_aggregate.py'
      - 'crypto-300-profit-mission/monster/evidence/monster_stage21_real_10date_ci_artifact_proof_20261011.json'
      - '.github/workflows/monster-v4-stage21-verify-ten-official-artifacts.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: monster-stage21-verify-ten-artifacts-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify-every-byte-and-recompute:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile source-verified independent aggregation logic
        working-directory: crypto-300-profit-mission/local-agent
        run: python -B -m py_compile scripts/monster_v4_stage21_aggregate.py
      - name: Retrieve ten unchanged original GitHub Actions ZIPs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -H 'Accept: application/vnd.github+json' repos/lxxlx2/ChatGPT_mission_record/actions/artifacts/11699770461/zip > /tmp/monster21_2025-03-09.zip
          gh api -H 'Accept: application/vnd.github+json' repos/lxxlx2/ChatGPT_mission_record/actions/artifacts/11699530963/zip > /tmp/monster21_2025-04-09.zip
          gh api -H 'Accept: application/vnd.github+json' repos/lxxlx2/ChatGPT_mission_record/actions/artifacts/11698873764/zip > /tmp/monster21_2025-05-09.zip
          gh api -H 'Accept: application/vnd.github+json' repos/lxxlx2/ChatGPT_mission_record/actions/artifacts/11698144486/zip > /tmp/monster21_2025-06-09.zip
          gh api -H 'Accept: application/vnd.github+json' repos/lxxlx2/ChatGPT_mission_record/actions/artifacts/11699139954/zip > /tmp/monster21_2025-07-09.zip
          gh api -H 'Accept: application/vnd.github+json' repos/lxxlx2/ChatGPT_mission_record/actions/artifacts/11699371447/zip > /tmp/monster21_2025-08-09.zip
          gh api -H 'Accept: application/vnd.github+json' repos/lxxlx2/ChatGPT_mission_record/actions/artifacts/11698564156/zip > /tmp/monster21_2025-09-09.zip
          gh api -H 'Accept: application/vnd.github+json' repos/lxxlx2/ChatGPT_mission_record/actions/artifacts/11699566060/zip > /tmp/monster21_2025-10-09.zip
          gh api -H 'Accept: application/vnd.github+json' repos/lxxlx2/ChatGPT_mission_record/actions/artifacts/11699261748/zip > /tmp/monster21_2026-03-09.zip
          gh api -H 'Accept: application/vnd.github+json' repos/lxxlx2/ChatGPT_mission_record/actions/artifacts/11698194639/zip > /tmp/monster21_2026-06-09.zip
      - name: Strict SHA256 ZIP and original raw JSON match, exact 7580 cases, paired and capital limit
        working-directory: crypto-300-profit-mission/local-agent
        run: |
          python -B scripts/monster_v4_stage21_aggregate.py --artifact-zips /tmp/monster21_2025-03-09.zip /tmp/monster21_2025-04-09.zip /tmp/monster21_2025-05-09.zip /tmp/monster21_2025-06-09.zip /tmp/monster21_2025-07-09.zip /tmp/monster21_2025-08-09.zip /tmp/monster21_2025-09-09.zip /tmp/monster21_2025-10-09.zip /tmp/monster21_2026-03-09.zip /tmp/monster21_2026-06-09.zip --output /tmp/monster_stage21_verified_10date_recomputed.json
      - name: Preserve verified ten-date exact pooled results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: monster-stage21-verified-original-10zip-7580-cases
          path: /tmp/monster_stage21_verified_10date_recomputed.json
          if-no-files-found: warn
          retention-days: 30
