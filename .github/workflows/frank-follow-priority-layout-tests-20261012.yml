name: Frank follow opportunity first layout

on:
  push:
    branches:
      - ui/frank-follow-opportunity-first-20261012
  workflow_dispatch:

permissions:
  contents: read

jobs:
  layout-static-and-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pin tested commit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo "EXACT_LAYOUT_HEAD=$GITHUB_SHA"
      - name: Install local test dependencies
        working-directory: crypto-300-profit-mission/local-agent
        run: |
          python -m pip install -e '.[dev]'
          python -m pip install numpy==2.3.3
      - name: Validate layout markup and frontend JavaScript
        working-directory: crypto-300-profit-mission/local-agent
        run: |
          python -B -m pytest -q -p no:cacheprovider tests/research/test_frank_dashboard_priority_layout.py
          node --check mission_agent/mission_control/static/app.js
      - name: Complete source regression including real Git archive replay
        working-directory: crypto-300-profit-mission/local-agent
        env:
          FRANK_EXPECT_REAL_GIT_REPLAY: '1'
        run: python -B -m pytest -q -p no:cacheprovider tests
