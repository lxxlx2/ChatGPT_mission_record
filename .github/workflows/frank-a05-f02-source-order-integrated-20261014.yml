name: Frank A05 F02 Claude P2 disposable F01 C02 integration
on:
  push:
    branches:
      - fix/frank-a05-f02-full-slot-source-order-review-20261014
  workflow_dispatch:
permissions:
  contents: read
jobs:
  disposable:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Combine reviewed ancestors and new source order with F01 C02
        run: |
          set -eu
          git config user.name "Isolated Review CI"
          git config user.email "ci-only@example.invalid"
          git fetch --no-tags origin "+refs/heads/*:refs/remotes/origin/*"
          git switch --force-create ci-a05-source-order origin/main
          for ref in             origin/fix/frank-a05-f02-full-slot-source-order-review-20261014             origin/fix/frank-ca-c02-identity-preview-casefold-review-20261014             origin/dev/frank-ca-f01-actionable-view-20261013
          do
            echo "COMBINED_MERGE_START: $ref"
            if ! git merge --no-edit --no-ff "$ref"; then
              echo "COMBINED_MERGE_CONFLICT: $ref"
              git diff --name-only --diff-filter=U
              exit 2
            fi
            echo "COMBINED_MERGE_PASS: $ref"
          done
          echo "COMBINED_MERGE_SHA=$(git rev-parse HEAD)"
      - name: Install test-only dependencies
        working-directory: crypto-300-profit-mission/local-agent
        run: |
          python -m pip install -e '.[dev]' numpy==2.3.3 pyflakes==3.4.0
      - name: A05 F02 C02 F01 shared tests
        working-directory: crypto-300-profit-mission/local-agent
        run: |
          node --check mission_agent/mission_control/static/app.js
          node tests/ca_identity_render.cjs
          python -B -m pytest -q -p no:cacheprovider tests/test_frank_a05_f02_latest_inventory.py tests/test_frank_ca_c02_claude_review_regression.py tests/test_follow_opportunity_f01.py tests/test_follow_opportunity_f01_integration.py tests/test_frank_a04_a05_chain_capture.py
      - name: Full combined real Git regression
        working-directory: crypto-300-profit-mission/local-agent
        env:
          FRANK_EXPECT_REAL_GIT_REPLAY: '1'
        run: |
          python -B -m pytest -q -p no:cacheprovider tests
