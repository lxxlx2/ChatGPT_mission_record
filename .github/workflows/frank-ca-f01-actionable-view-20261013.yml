name: Frank F01 actionable-only view regression
on:
  push:
    branches:
      - dev/frank-ca-f01-actionable-view-20261013
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dashboard-presentation:
    runs-on: ubuntu-latest
    timeout-minutes: 23
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install local-agent test dependencies
        working-directory: crypto-300-profit-mission/local-agent
        run: |
          python -m pip install -e '.[dev]'
          python -m pip install numpy==2.3.3
      - name: F01 presentation contract regression
        working-directory: crypto-300-profit-mission/local-agent
        run: |
          python -B -m pytest -q -p no:cacheprovider tests/test_follow_opportunity_f01.py
      - name: All Mission local-agent tests
        working-directory: crypto-300-profit-mission/local-agent
        env:
          FRANK_EXPECT_REAL_GIT_REPLAY: '1'
        run: |
          python -B -m pytest -q -p no:cacheprovider tests
      - name: Static Dashboard syntax
        working-directory: crypto-300-profit-mission/local-agent
        run: |
          python -B -m compileall -q mission_agent/mission_control
          node --check mission_agent/mission_control/static/app.js
