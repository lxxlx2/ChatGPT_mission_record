name: Frank F01 current research source context UI integration
on:
  push:
    branches:
      - feat/frank-f01-source-context-pane-20261017
      - fix/frank-pr91-safe-primary-f01-and-gateway-20261017
      - fix/frank-pr92-mixed-f01-route-p1-20261017
      - fix/frank-pr93-executable-quote-binding-p2-20261018
      - qa/frank-pr94-real-webkit-ui-acceptance-20261018
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ui-and-gateway:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependencies
        working-directory: crypto-300-profit-mission/local-agent
        run: python -m pip install -e '.[dev]' numpy==2.3.3 pyflakes==3.4.0
      - name: Browser JS and native same-origin localhost route
        working-directory: crypto-300-profit-mission/local-agent
        run: |
          python -B -m compileall -q mission_agent/mission_control/server.py tests/test_frank_source_context_gateway.py
          python -m pyflakes mission_agent/mission_control/server.py tests/test_frank_source_context_gateway.py
          node --check mission_agent/mission_control/static/frank_source_context.js
          node --check mission_agent/mission_control/static/frank_f01_primary_freshness.js
          node tests/frank_source_context_render.cjs
          node tests/frank_source_context_mount.cjs
          node tests/frank_f01_primary_freshness.cjs
          python -B -m pytest -q -p no:cacheprovider tests/test_frank_source_context_gateway.py tests/test_frank_joint_current_follow_context.py tests/test_frank_joint_readonly_http.py
      - name: Complete unmodified-source regression with real historical Git replay
        working-directory: crypto-300-profit-mission/local-agent
        env:
          FRANK_EXPECT_REAL_GIT_REPLAY: '1'
        run: python -B -m pytest -q -p no:cacheprovider tests

  reviewed-sources-disposable:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Explicit pinned reviewed source integration
        id: assembly
        env:
          C02: 8d425e4d0e9db9f27abd8ad662e4d59e64b57e53
          F01: d2eeebc1b49d2bae38e05d7d01f6839e3ba237f4
          QA_HARNESS: 40febd8275c7710a8697af5a0503569a2bb5cb8d
          EVIDENCE: b9fb6e6df9032a0e6f49c1274bb4ba61c9e4c2da
          APPROVED_PARENT: 925043254d646bccc3570c7c3078b1d23ff12ecd
        run: |
          set -euo pipefail
          git fetch --no-tags origin "refs/heads/fix/frank-c02-pr82-authority-presence-20261016:refs/remotes/origin/fix/frank-c02-pr82-authority-presence-20261016"
          git fetch --no-tags origin "refs/heads/fix/frank-f01-pr81-js-range-20261016:refs/remotes/origin/fix/frank-f01-pr81-js-range-20261016"
          git fetch --no-tags origin "refs/heads/qa/frank-f01-pr83-c02-pr84-f02-p73-isolated-20261016:refs/remotes/origin/qa/frank-f01-pr83-c02-pr84-f02-p73-isolated-20261016"
          git fetch --no-tags origin "refs/heads/evidence/frank-ca-local:refs/remotes/origin/evidence/frank-ca-local"
          test "$(git rev-parse refs/remotes/origin/fix/frank-c02-pr82-authority-presence-20261016)" = "$C02"
          test "$(git rev-parse refs/remotes/origin/fix/frank-f01-pr81-js-range-20261016)" = "$F01"
          test "$(git rev-parse refs/remotes/origin/qa/frank-f01-pr83-c02-pr84-f02-p73-isolated-20261016)" = "$QA_HARNESS"
          test "$(git rev-parse refs/remotes/origin/evidence/frank-ca-local)" = "$EVIDENCE"
          git merge-base --is-ancestor "$APPROVED_PARENT" "$GITHUB_SHA"
          dest="$(mktemp -d "$RUNNER_TEMP/frank-source-ui-XXXXXXXX")"
          git clone --no-local --quiet "$GITHUB_WORKSPACE" "$dest"
          git -C "$dest" checkout --quiet --detach "$GITHUB_SHA"
          git -C "$dest" fetch --no-tags --quiet "$GITHUB_WORKSPACE" "$C02" "$F01" "$QA_HARNESS"
          git -C "$dest" fetch --no-tags --quiet "$GITHUB_WORKSPACE" "refs/remotes/origin/evidence/frank-ca-local:refs/remotes/origin/evidence/frank-ca-local"
          test "$(git -C "$dest" rev-parse refs/remotes/origin/evidence/frank-ca-local)" = "$EVIDENCE"
          for sha in "$C02" "$F01" "$QA_HARNESS"; do
            if test "$sha" = "$F01"; then
              if ! git -C "$dest" -c user.name="Frank isolated F01 UI" -c user.email="frank-ui-qa@example.invalid" merge --no-ff --no-edit --no-gpg-sign "$sha"; then
                only_conflict="crypto-300-profit-mission/local-agent/mission_agent/mission_control/server.py"
                test "$(git -C "$dest" diff --name-only --diff-filter=U)" = "$only_conflict"
                git -C "$dest" checkout --ours -- "$only_conflict"
                git -C "$dest" add -- "$only_conflict"
                test -z "$(git -C "$dest" diff --name-only --diff-filter=U)"
                git -C "$dest" -c user.name="Frank isolated F01 UI" -c user.email="frank-ui-qa@example.invalid" commit --no-edit --no-gpg-sign
                git -C "$dest" show "HEAD:$only_conflict" | grep -Fq 'def follow_opportunities(self):'
                git -C "$dest" show "HEAD:$only_conflict" | grep -Fq 'context = _opt_in_research_follow_context('
                git -C "$dest" show "HEAD:$only_conflict" | grep -Fq 'quote_observed_at'
                git -C "$dest" show "HEAD:$only_conflict" | grep -Fq 'def frank_observed_watchlist(self):'
              fi
              reviewed_file="crypto-300-profit-mission/local-agent/mission_agent/mission_control/follow_view.py"
              test "$(git -C "$dest" rev-parse "HEAD:$reviewed_file")" = "$(git -C "$dest" rev-parse "$F01:$reviewed_file")"
            else
              git -C "$dest" -c user.name="Frank isolated F01 UI" -c user.email="frank-ui-qa@example.invalid" merge --no-ff --no-edit --no-gpg-sign "$sha"
            fi
            git -C "$dest" merge-base --is-ancestor "$sha" HEAD
          done
          test -z "$(git -C "$dest" status --porcelain=v1 --untracked-files=all --ignored=matching)"
          DEST="$dest" python - <<'PY'
          import ast
          import os
          import pathlib
          import subprocess

          path = "crypto-300-profit-mission/local-agent/mission_agent/mission_control/server.py"
          dest = pathlib.Path(os.environ["DEST"])
          reviewed = subprocess.check_output(
              ["git", "-C", str(dest), "show", os.environ["F01"] + ":" + path],
              text=True,
          )
          combined = (dest / path).read_text(encoding="utf-8")

          def approved_f01_function(source):
              module = ast.parse(source)
              klass = next(n for n in module.body if isinstance(n, ast.ClassDef)
                           and n.name == "DashboardState")
              method = next(n for n in klass.body if isinstance(n, ast.FunctionDef)
                            and n.name == "follow_opportunities")
              return ast.dump(method, include_attributes=False)

          assert approved_f01_function(reviewed) == approved_f01_function(combined), (
              "FRANK_F01_REVIEWED_ELIGIBILITY_AST_DRIFT"
          )
          print("FRANK_F01_REVIEWED_ELIGIBILITY_AST_IDENTICAL=PASS")
          PY
          echo "FRANK_UI_COMBINED_TREE=$(git -C "$dest" rev-parse HEAD^{tree})"
          echo "dest=$dest" >> "$GITHUB_OUTPUT"
      - name: Install disposable reviewed dependencies
        working-directory: ${{ steps.assembly.outputs.dest }}/crypto-300-profit-mission/local-agent
        run: python -m pip install -e '.[dev]' numpy==2.3.3 pyflakes==3.4.0
      - name: Actual combined formal F01 C02 and new context view regressions
        working-directory: ${{ steps.assembly.outputs.dest }}/crypto-300-profit-mission/local-agent
        run: |
          node --check mission_agent/mission_control/static/app.js
          node --check mission_agent/mission_control/static/frank_source_context.js
          node --check mission_agent/mission_control/static/frank_f01_primary_freshness.js
          node tests/frank_f01_excluded_badge_render.cjs
          node tests/frank_f01_quote_projection_render.cjs
          node tests/ca_identity_render.cjs
          node tests/frank_f02_r2_render.cjs
          node tests/frank_source_context_render.cjs
          node tests/frank_source_context_mount.cjs
          node tests/frank_f01_primary_freshness.cjs
          python -B -m pytest -q -p no:cacheprovider tests/test_frank_source_context_gateway.py tests/test_frank_joint_current_follow_context.py tests/test_frank_joint_readonly_http.py tests/test_frank_f01_c02_f02_alignment.py integration_tests/test_frank_joint_native_control_http.py
      - name: Install isolated WebKit browser for PR94 synthetic native-HTTP acceptance
        working-directory: ${{ steps.assembly.outputs.dest }}/crypto-300-profit-mission/local-agent
        run: |
          python -m pip install 'playwright==1.56.0'
          python -m playwright install --with-deps webkit
      - name: True WebKit PR94 product UI smoke with native localhost HTTP
        working-directory: ${{ steps.assembly.outputs.dest }}/crypto-300-profit-mission/local-agent
        env:
          FRANK_PR94_EXPECTED_SHA: 19d5d8be92b944f1c9814a1f527d233290bf2dfc
          FRANK_PR94_WEBKIT_EVIDENCE_DIR: ${{ runner.temp }}/frank-pr94-webkit-evidence
        run: |
          python -B scripts/frank_pr94_webkit_ui_acceptance.py
      - name: Archive isolated synthetic browser screenshots and console
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frank-pr94-webkit-synthetic-qa-${{ github.sha }}
          path: ${{ runner.temp }}/frank-pr94-webkit-evidence/
          if-no-files-found: ignore
          retention-days: 14
      - name: Full disposable real Git historical regression
        working-directory: ${{ steps.assembly.outputs.dest }}/crypto-300-profit-mission/local-agent
        env:
          FRANK_EXPECT_REAL_GIT_REPLAY: '1'
        run: python -B -m pytest -q -p no:cacheprovider tests
