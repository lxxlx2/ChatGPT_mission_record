name: Monster Stage26 Strict Original 36 ZIP SHA and 168h Full Market Cost Aggregation
on:
  push:
    branches:
      - research/monster-v4-local-discovery-20261010
    paths:
      - 'crypto-300-profit-mission/monster/evidence/monster_stage26_verified_sharded_168h_artifact_proof_20261011.json'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: monster-stage26-source-proof-aggregate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  strict-36-original-artifact-reaggregate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test original ZIP tamper detection, 30U and ten-slot 300U capital chronology
        working-directory: crypto-300-profit-mission/local-agent
        run: |
          python -B -m py_compile scripts/monster_v4_stage26_aggregate.py tests/test_monster_v4_stage26_aggregate.py
          python -B -m unittest discover -v -s tests -p test_monster_v4_stage26_aggregate.py
      - name: Re-download exact 36 pre-registered ZIPs by permanent GitHub Actions artifact id
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY' > /tmp/monster26_artifact_identity.txt
          import json
          from pathlib import Path
          doc=json.loads(Path("crypto-300-profit-mission/monster/evidence/monster_stage26_verified_sharded_168h_artifact_proof_20261011.json").read_text())
          for x in sorted(doc["artifacts"],key=lambda r:(r["date"],r["shard"])):
              print(x["date"],x["shard"],x["artifact_id"])
          PY
          while read -r day shard artifact; do
            gh api -H 'Accept: application/vnd.github+json' repos/lxxlx2/ChatGPT_mission_record/actions/artifacts/"$artifact"/zip > "/tmp/monster_stage26_${day}_shard${shard}.zip"
          done < /tmp/monster26_artifact_identity.txt
      - name: SHA verify original 36 ZIPs plus JSON and recompute every one of 4548 symbol dates, 2x 5x and 30/300U funding
        working-directory: crypto-300-profit-mission/local-agent
        run: |
          args=()
          while read -r day shard artifact; do
            args+=("/tmp/monster_stage26_${day}_shard${shard}.zip")
          done < /tmp/monster26_artifact_identity.txt
          python -B scripts/monster_v4_stage26_aggregate.py --artifact-zips "${args[@]}" --output /tmp/monster_stage26_verified_168h_4548_aggregate.json
      - name: Retain exact proof of every watch event, first minute crossing and one/ten funded capital slots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: monster-stage26-36-shard-168h-4548-verified-original-proof
          path: /tmp/monster_stage26_verified_168h_4548_aggregate.json
          if-no-files-found: warn
          retention-days: 30
