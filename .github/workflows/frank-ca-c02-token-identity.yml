name: Frank CA C02 exact mint identity
on:
  push:
    branches: [codex/frank-ca-c02-token-identity-20261014]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  identity:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        working-directory: crypto-300-profit-mission/local-agent
        run: |
          python -m pip install -e '.[dev]' numpy==2.3.3 pyflakes==3.4.0
      - name: Old PR46 actual assertion red
        run: |
          git worktree add --detach "$RUNNER_TEMP/c02-red" e2fdb48e1e7d98a3f39d3153997b3b76f4d413ae
          cp crypto-300-profit-mission/local-agent/tests/test_ca_market_c02_red.py "$RUNNER_TEMP/c02-red/crypto-300-profit-mission/local-agent/tests/"
          set +e
          (cd "$RUNNER_TEMP/c02-red/crypto-300-profit-mission/local-agent" && python -m pytest -q tests/test_ca_market_c02_red.py) > "$RUNNER_TEMP/c02-red.txt" 2>&1
          result=$?
          set -e
          cat "$RUNNER_TEMP/c02-red.txt"
          test "$result" -eq 1
          grep -q '2 failed' "$RUNNER_TEMP/c02-red.txt"
      - name: Identity and actual UI render
        working-directory: crypto-300-profit-mission/local-agent
        run: |
          python -m pytest -q tests/test_ca_identity_c02.py tests/test_ca_market_c02_red.py
          node tests/ca_identity_render.cjs
          node --check mission_agent/mission_control/static/app.js
          python -m pyflakes mission_agent/meme/identity.py mission_agent/meme/market.py mission_agent/meme/cluster.py mission_agent/mission_control/server.py
          python -m compileall -q mission_agent
      - name: Full real Git regression
        working-directory: crypto-300-profit-mission/local-agent
        env:
          FRANK_EXPECT_REAL_GIT_REPLAY: '1'
        run: python -B -m pytest -q -p no:cacheprovider tests
