name: Frank C2A F1b offline independent recovery

on:
  push:
    branches: [feature/frank-c2a-f1b-offline-emergency-rollback-20261026]
  pull_request:
    branches: [feature/frank-c2a-f1-offline-bootstrap-evidence-20261026]

permissions:
  contents: read

jobs:
  synthetic-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install synthetic test dependency only
        run: python -m pip install pytest==8.3.5
      - name: Validate F1 and F1b syntax
        working-directory: crypto-300-profit-mission/local-agent
        run: |
          python -B -m py_compile scripts/frank_c2a_f1_evidence.py scripts/frank_c2a_f1b_offline_recovery.py tests/test_frank_c2a_f1_evidence.py tests/test_frank_c2a_f1b_offline_recovery.py
      - name: Synthetic evidence failure and independent rollback tests only
        working-directory: crypto-300-profit-mission/local-agent
        env:
          PYTHONPATH: .
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -B -m pytest -q -p no:cacheprovider tests/test_frank_c2a_f1_evidence.py tests/test_frank_c2a_f1b_offline_recovery.py
