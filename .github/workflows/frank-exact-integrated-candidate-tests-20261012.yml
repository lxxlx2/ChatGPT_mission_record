name: Frank exact integrated candidate tests

on:
  push:
    branches:
      - review/frank-pr31-pr32-pr33-mergegate-20261012
    paths:
      - '.github/workflows/frank-exact-integrated-candidate-tests-20261012.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-reviewed-tree:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dafb126e33338523630bb48d4fe838ddd9c7fb95
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Assert exactly pinned integrated commit and tree
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "dafb126e33338523630bb48d4fe838ddd9c7fb95"
          test "$(git rev-parse HEAD^{tree})" = "664ad39f42c7deed39c2b333d4cef1bf9172b592"
          echo 'INTEGRATED_EXACT_COMMIT_AND_TREE=PASS'
      - name: Install local-agent test dependencies
        working-directory: crypto-300-profit-mission/local-agent
        run: |
          python -m pip install -e '.[dev]'
          python -m pip install numpy==2.3.3 pyflakes==3.4.0
      - name: Syntax and static validation
        working-directory: crypto-300-profit-mission/local-agent
        run: |
          python -B -m compileall -q mission_agent/mission_control scripts tests
          node --check mission_agent/mission_control/static/app.js
          python -m pyflakes mission_agent/mission_control/delivery_review.py scripts/reauthorize_existing_gmail.py scripts/deploy_frank_dashboard_review_badge.py scripts/frank_dashboard_readonly_acceptance.py
      - name: Focused combined PR31 PR32 PR33 tests
        working-directory: crypto-300-profit-mission/local-agent
        run: |
          python -B -m pytest -q -p no:cacheprovider \
            tests/test_frank_ata_backfill_v1.py \
            tests/test_meme_evidence_sync.py \
            tests/test_frank_wallet_watchlist_v2.py \
            tests/research/test_frank_git_real_transfer_replay.py \
            tests/research/test_reauthorize_existing_gmail.py \
            tests/research/test_delivery_review_breakdown.py \
            tests/research/test_delivery_review_integration.py \
            tests/research/test_frank_dashboard_deploy.py \
            tests/research/test_frank_dashboard_readonly_acceptance.py
      - name: Full exact-tree local-agent regression including real Git replay
        working-directory: crypto-300-profit-mission/local-agent
        env:
          FRANK_EXPECT_REAL_GIT_REPLAY: '1'
        run: python -B -m pytest -q -p no:cacheprovider tests
