name: Monster Stage163 Post-T0 Clock Bridged Spot USDT Friction V3

on:
  push:
    branches:
      - research/monster-v4-local-discovery-20261010
    paths:
      - 'crypto-300-profit-mission/local-agent/scripts/monster_v4_stage163_spot_t0_quote_friction.py'
      - 'crypto-300-profit-mission/local-agent/tests/test_monster_v4_stage163_spot_t0_quote_friction.py'
      - '.github/workflows/monster-v4-stage163-offline-spot-t0-511-friction.yml'

permissions:
  contents: write

concurrency:
  group: monster-stage163-archived-t0-offline-source-only
  cancel-in-progress: true

jobs:
  archived_spot_t0_friction:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline source locked real 511 pair regressions
        working-directory: crypto-300-profit-mission/local-agent
        run: |
          python -B -m py_compile scripts/monster_v4_stage163_spot_t0_quote_friction.py tests/test_monster_v4_stage163_spot_t0_quote_friction.py
          python -B -m unittest discover -v -s tests -p test_monster_v4_stage163_spot_t0_quote_friction.py
      - name: Recompute research-only full511 from exact original git ZIP and receipts
        working-directory: crypto-300-profit-mission/local-agent
        run: |
          python -B scripts/monster_v4_stage163_spot_t0_quote_friction.py --output /tmp/monster_stage163_spot_post_t0_clock_bridge_v3.json
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('/tmp/monster_stage163_spot_post_t0_clock_bridge_v3.json')
          j=json.loads(p.read_text())
          assert j['schema']=='MONSTER_STAGE163_SPOT_POST_T0_CLOCK_BRIDGED_511_FRICTION_NO_TRADES_V3'
          assert len(j['rows'])==511
          assert j['source_zip_sha256']=='b47e206345c0a04b16b37c38795d726553ef83ca679f443f9fba89805483216b'
          assert j['G4']=='UNKNOWN' and j['G6']=='NO_GO'
          assert j['NO_DEPLOY'] and j['NO_MERGE'] and j['NO_GMAIL'] and j['NO_TRADE']
          assert j['research_notional_usdt']=='UNKNOWN_NOT_SPECIFIED'
          assert j['research_notional_displayed_top_level_size_coverage_only']=='NOT_EVALUATED_WITHOUT_EXPLICIT_RESEARCH_AMOUNT'
          assert j['historical_post_t0_quote_receipts_once_not_forward_live_signal']
          assert j['t0_causal_quote_at_t0_proven'] is False
          assert j['eligible_for_t0_asof_executable_execution_or_signal_backtest'] is False
          assert j['population_scope_is_all_binance_spot'] is False
          assert j['complete_archived_exchangeinfo_t0_eligible_cohort_represented'] is True
          assert j['population_counts_from_exchangeinfo']['usdt_all_statuses_including_spot_disallowed']==765
          assert j['population_counts_from_exchangeinfo']['usdt_break_all_spot_permissions']==254
          assert j['clock_bridge_calibration']['clock_drift_between_samples']=='UNVERIFIED'
          assert j['clock_bridge_calibration']['conditional_interval_not_certified_exchange_event_timestamp'] is True
          assert j['quote_status_counts']=={'DISPLAYED_TWO_SIDED':511,'LOCKED_QUOTE':0,'ZERO_DISPLAYED_SIZE':0}
          assert j['displayed_depth_distribution_evaluable_count']==511
          assert j['post_t0_receipt_windows_vs_exchangeinfo_t0_approx']['bookTicker']['start_offset_from_exchange_t0_ms_approx']=='2561.682'
          assert j['post_t0_receipt_windows_vs_exchangeinfo_t0_approx']['ticker24']['end_offset_from_exchange_t0_ms_approx']=='6835.464'
          assert j['excluded_market_symbols_not_in_exchangeinfo']['bookTicker']==['AXSBIDR','NBTBIDR','NBTUSDT']
          assert j['quote_bundle_not_available_until_client_receipt_utc']=='2026-10-17T22:04:46.929464Z'
          assert j['no_historical_exit_L2'] and j['no_observed_actual_fills']
          print('MONSTER163_POST_T0_QUOTE_BOUNDED_511_NO_TRADE_PASS')
          PY
      - name: Upload machine-readable source-derived full511 historical research
        uses: actions/upload-artifact@v4
        with:
          name: monster-stage163-archived-original-511-post-t0-quote-clock-v3
          path: /tmp/monster_stage163_spot_post_t0_clock_bridge_v3.json
          retention-days: 60
          if-no-files-found: error
      - name: Commit immutable one-snapshot 511 rows under existing Monster research evidence
        run: |
          set -eu
          branch=research/monster-v4-local-discovery-20261010
          target=crypto-300-profit-mission/monster/evidence/monster_stage163_spot_post_t0_original511_quote_friction_v3_clock_actual.json
          test ! -e "$target"
          cp /tmp/monster_stage163_spot_post_t0_clock_bridge_v3.json "$target"
          git config user.name monster-research-ci
          git config user.email monster-research-ci@users.noreply.github.com
          git add "$target"
          git commit -m "monster: archive post-T0 clock-bridged Stage163 511-pair quote friction v3 NO_GO"
          git fetch origin "refs/heads/$branch"
          if git cat-file -e "FETCH_HEAD:$target" 2>/dev/null; then
            echo MONSTER163_POST_T0_FRICTION_V3_REPORT_ALREADY_ARCHIVED
            exit 1
          fi
          git rebase FETCH_HEAD
          for source in crypto-300-profit-mission/local-agent/scripts/monster_v4_stage163_spot_t0_quote_friction.py crypto-300-profit-mission/local-agent/tests/test_monster_v4_stage163_spot_t0_quote_friction.py crypto-300-profit-mission/monster/evidence/monster_stage163_spot_original_http_t0_actual/source_raw_http.zip crypto-300-profit-mission/monster/evidence/monster_stage163_spot_original_http_t0_actual/source_receipts.json .github/workflows/monster-v4-stage163-offline-spot-t0-511-friction.yml; do
            test "$(git rev-parse "$GITHUB_SHA:$source")" = "$(git rev-parse "HEAD:$source")" || { echo MONSTER163_POST_T0_FRICTION_SOURCE_CHANGED_DURING_CI; exit 1; }
          done
          git push origin "HEAD:refs/heads/$branch"
          echo MONSTER163_POST_T0_511_V3_SOURCE_ARCHIVED_GIT_READBACK_REQUIRED
