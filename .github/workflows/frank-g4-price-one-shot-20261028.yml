name: Frank G4 2026-10-28 one-shot free causal price evidence
on:
  push:
    branches:
      - research/frank-g4-price-one-shot-20261028
    paths:
      - .github/workflows/frank-g4-price-one-shot-20261028.yml
permissions:
  contents: read
concurrency:
  group: frank-g4-one-shot-price-evidence-20261028
  cancel-in-progress: false
jobs:
  frozen-one-shot-public-price:
    if: github.event_name == 'push' && github.ref == 'refs/heads/research/frank-g4-price-one-shot-20261028' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout frozen research only (no write token)
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Verify exact one-shot first-commit gate before any provider contact
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "c87c64a30fd4694d83d08655ba0d851f504b9ea4"
          test "$(git diff-tree --no-commit-id --name-only -r HEAD)" = ".github/workflows/frank-g4-price-one-shot-20261028.yml"
          test "$(git status --porcelain)" = ""
      - name: Offline tests, frozen case preregistration and no-network default
        run: |
          set -euo pipefail
          python3 -B -m unittest discover -s crypto-300-profit-mission/meme/g0b -p 'test_g4_price_one_shot.py' -v
          python3 -B crypto-300-profit-mission/meme/g0b/g4_price_one_shot.py --max-http 18 --out-dir /tmp/frank-g4-offline-only
          python3 -B -c 'import json; p="/tmp/frank-g4-offline-only"; from pathlib import Path; assert not Path(p).exists()'
      - name: ONE AND ONLY authorized public 18-attempt price coverage probe
        run: |
          set -euo pipefail
          python3 -B crypto-300-profit-mission/meme/g0b/g4_price_one_shot.py --execute --max-http 18 --out-dir g4-price-once-output
      - name: Archive raw responses and exact HTTP attempt evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frank-g4-price-one-shot-20261028
          path: g4-price-once-output/g4_price_once_receipts.json
          if-no-files-found: warn
          retention-days: 30
