name: Monster ADR005 exposed real69 actual original SQLite once

on:
  push:
    branches:
      - research/monster-v4-local-discovery-20261010
    paths:
      - .github/workflows/monster-adr005-exposed69-original-sqlite-once.yml

permissions:
  contents: read
  actions: read

jobs:
  original-69-ephemeral-research:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Synthetic frozen event SHA, census and source-failure regressions
        env:
          PYTHONPATH: crypto-300-profit-mission/local-agent:crypto-300-profit-mission/local-agent/scripts
        run: |
          set -euo pipefail
          python -B -m py_compile crypto-300-profit-mission/local-agent/scripts/monster_v4_adr005_real69_original_sqlite_replay.py
          python -B -m unittest discover -s crypto-300-profit-mission/local-agent/tests -p test_monster_v4_adr005_real69_original_sqlite_replay.py -v
      - name: Fetch existing immutable source shards and original replay reports only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/monster-adr005-real69"
          mkdir -p "$root/shards" "$root/original" "$root/complete"
          n=0
          while IFS='|' read -r run_id artifact_name; do
            test -n "$run_id" && test -n "$artifact_name"
            n=$((n + 1))
            gh run download "$run_id" --name "$artifact_name" --dir "$root/shards/$n" --repo "$GITHUB_REPOSITORY"
          done <<'PINNED_EXISTING_ONLY'
          40027484781|monster-spot511-2026-10-18-slice-0-40027484781
          40027484781|monster-spot511-2026-10-18-slice-128-40027484781
          40027484781|monster-spot511-2026-10-18-slice-256-40027484781
          40027484781|monster-spot511-2026-10-18-slice-320-40027484781
          40027484781|monster-spot511-2026-10-18-slice-64-40027484781
          40027484781|monster-spot511-2026-10-19-slice-0-40027484781
          40027484781|monster-spot511-2026-10-19-slice-192-40027484781
          40027484781|monster-spot511-2026-10-19-slice-256-40027484781
          40027484781|monster-spot511-2026-10-19-slice-320-40027484781
          40027484781|monster-spot511-2026-10-19-slice-384-40027484781
          40027484781|monster-spot511-2026-10-19-slice-64-40027484781
