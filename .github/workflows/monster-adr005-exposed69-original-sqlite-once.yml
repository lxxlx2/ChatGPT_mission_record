          40171792607|monster-spot511-oct24-original-slice-384
          40171792607|monster-spot511-oct24-original-slice-448
          PINNED_EXISTING_ONLY
          gh run download 40087231856 --name monster-spot511-4088-original-global-replay-40087231856 --dir "$root/original" --repo "$GITHUB_REPOSITORY"
          gh run download 40172014267 --name monster-spot511-original4599-frozen-global-paired-proof --dir "$root/complete" --repo "$GITHUB_REPOSITORY"
          test -f "$root/original/paired-4088.json"
          test -f "$root/complete/paired-4599.json"
      - name: Merge issuer ZIP/CHECKSUM source pairs with no arbitrary metadata overwrites
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import os,shutil
          root=Path(os.environ["RUNNER_TEMP"])/"monster-adr005-real69"
          folders=sorted((root/"shards").iterdir(),key=lambda p:int(p.name))
          if len(folders)!=42:raise SystemExit("REAL69_EXPECTED_PREPINNED_42_ARTIFACT_SHARDS")
          dst=root/"selected-source"/"source"
          amount=0
          for folder in folders:
              src=folder/"source"
              if not src.is_dir():raise SystemExit("SOURCE_ARCHIVE_FOLDER_MISSING:"+folder.name)
              for item in src.rglob("*"):
                  if item.is_symlink():raise SystemExit("SOURCE_SYMLINK_REJECTED")
                  if not item.is_file():continue
                  sub=item.relative_to(src)
                  if len(sub.parts)!=3 or sub.parts[1]!="1m":
                      raise SystemExit("SOURCE_PATH_NOT_SPOT_SYMBOL_MINUTE_FILE")
                  dest=dst/sub
                  if dest.exists():raise SystemExit("DUPLICATE_ORIGINAL_SOURCE_PAIR_MEMBER:"+str(sub))
                  dest.parent.mkdir(parents=True,exist_ok=True)
                  shutil.move(str(item),str(dest))
                  amount+=1
          if amount<138 or amount%2:raise SystemExit("REAL69_TOO_FEW_OR_ODD_SOURCE_ITEMS")
          print("MONSTER_REAL69_42_OLD_OFFICIAL_ARTIFACTS_REUSED",amount)
          PY
      - name: Run exact original 69 D0 events through existing isolated SQLite D1
        env:
          PYTHONPATH: crypto-300-profit-mission/local-agent:crypto-300-profit-mission/local-agent/scripts
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/monster-adr005-real69"
          python -B crypto-300-profit-mission/local-agent/scripts/monster_v4_adr005_real69_original_sqlite_replay.py \
            --original-4599 "$root/complete/paired-4599.json" \
            --original-4088 "$root/original/paired-4088.json" \
            --original53-exploration crypto-300-profit-mission/monster/evidence/MONSTER_ADR005_REAL53_OFFICIAL_MINUTE_INDEPENDENT_EXPLORATION_20261025.json \
            --publisher-dir "$root/selected-source/source" \
            --ledger-out "$root/real69.sqlite" \
            --out "$root/real69.json" \
            --asof-utc 2026-10-25T07:20:00Z
      - name: Preserve researched ledger, comparison and source proof only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monster-adr005-real69-exposed-original-sqlite-offline
          path: |
            ${{ runner.temp }}/monster-adr005-real69/real69.sqlite
            ${{ runner.temp }}/monster-adr005-real69/real69.json
          retention-days: 30
          if-no-files-found: warn
