name: Frank A04 native fee-only combined F01 CA release smoke
on:
  push:
    branches:
      - fix/frank-ca-a04-sol-native-gap-policy-20261014
  workflow_dispatch:
permissions:
  contents: read
jobs:
  disposable-combined:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Merge complete A04, CA and F01 on isolated runner
        run: |
          set -eu
          git config user.name "CI isolated integration"
          git config user.email "ci-only@example.invalid"
          git fetch --no-tags origin "+refs/heads/*:refs/remotes/origin/*"
          git switch --force-create ci-frank-combined origin/main
          for ref in             origin/fix/frank-ca-a04-sol-native-gap-policy-20261014             origin/fix/frank-ca-c02-identity-preview-casefold-review-20261014             origin/dev/frank-ca-f01-actionable-view-20261013
          do
            echo "INTEGRATION_MERGE_START: $ref"
            if ! git merge --no-edit --no-ff "$ref"; then
              echo "INTEGRATION_CONFLICT: $ref"
              git diff --name-only --diff-filter=U
              exit 2
            fi
            echo "INTEGRATION_MERGE_PASS: $ref"
          done
          echo "INTEGRATION_COMBINED_HEAD=$(git rev-parse HEAD)"
      - name: Install test-only requirements
        working-directory: crypto-300-profit-mission/local-agent
        run: |
          python -m pip install -e '.[dev]' numpy==2.3.3 pyflakes==3.4.0
      - name: Cross-module audited source, dashboard and true ATA fixture
        working-directory: crypto-300-profit-mission/local-agent
        run: |
          node --check mission_agent/mission_control/static/app.js
          node tests/ca_identity_render.cjs
          python -B -m pytest -q -p no:cacheprovider tests/test_frank_a04_claude_fourth_review.py tests/test_frank_a04_claude_third_review.py tests/test_frank_ca_c02_claude_review_regression.py tests/test_follow_opportunity_f01.py tests/test_follow_opportunity_f01_integration.py tests/test_frank_ca_c01_c08_no_default_quote.py
      - name: Whole actual integrated local-agent real Git regression
        working-directory: crypto-300-profit-mission/local-agent
        env:
          FRANK_EXPECT_REAL_GIT_REPLAY: '1'
        run: |
          python -B -m pytest -q -p no:cacheprovider tests
