name: BSC F0 offline unittest
on:
  pull_request:
    paths:
      - 'crypto-300-profit-mission/bsc-forward-follow-model/**'
      - '.github/workflows/bsc-f0-offline-unittest.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact pinned D1 Ed25519 backend
        run: |
          python -m pip install --disable-pip-version-check -r crypto-300-profit-mission/bsc-forward-follow-model/f0/requirements-d1-offline.txt
      - name: Verify F0 offline test suite
        run: |
          python3 -m unittest discover -s crypto-300-profit-mission/bsc-forward-follow-model/f0/tests -p 'test_*.py' -v
