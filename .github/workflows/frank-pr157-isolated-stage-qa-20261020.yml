name: Frank PR157 exact source isolated staging smoke
on:
  push:
    branches: [qa/frank-pr157-mac-integrated-snapshot-20261020]
    paths:
      - '.github/workflows/frank-pr157-isolated-stage-qa-20261020.yml'
      - 'crypto-300-profit-mission/local-agent/scripts/frank_pr157_mac_integrated_staging.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  staging-import:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install existing project test dependencies
        working-directory: crypto-300-profit-mission/local-agent
        run: python -m pip install -e '.[dev]'
      - name: Check isolated harness syntax and package imports
        working-directory: crypto-300-profit-mission/local-agent
        run: |
          python -B -m py_compile scripts/frank_pr157_mac_integrated_staging.py
          python -B scripts/frank_pr157_mac_integrated_staging.py --help
          node --check mission_agent/mission_control/static/app.js
      - name: Reuse verified PR157 product integration regressions
        working-directory: crypto-300-profit-mission/local-agent
        run: |
          python -B -m pytest -q -p no:cacheprovider tests/test_frank_activity_watch_dashboard.py tests/test_frank_intelligence_dashboard_integration.py
