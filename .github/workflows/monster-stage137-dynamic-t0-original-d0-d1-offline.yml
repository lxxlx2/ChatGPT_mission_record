name: Monster Stage137 dynamic T0 unchanged original D0 D1 causal archive replay

on:
  push:
    branches:
      - research/monster-v4-local-discovery-20261010
    paths:
      - 'crypto-300-profit-mission/local-agent/scripts/monster_v4_stage137_dynamic_t0_original_core_causal_replay.py'
      - 'crypto-300-profit-mission/local-agent/scripts/test_monster_v4_stage137_dynamic_t0_original_core_causal_replay.py'
      - '.github/workflows/monster-stage137-dynamic-t0-original-d0-d1-offline.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'crypto-300-profit-mission/local-agent/scripts/monster_v4_stage137_dynamic_t0_original_core_causal_replay.py'
      - 'crypto-300-profit-mission/local-agent/scripts/test_monster_v4_stage137_dynamic_t0_original_core_causal_replay.py'
      - '.github/workflows/monster-stage137-dynamic-t0-original-d0-d1-offline.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-locked-dynamic-causal:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile and execute complete 11520 official-format 1m original V4 shadow SQLite and Stage80 D1 closed-bar causal replay
        run: |
          cd crypto-300-profit-mission/local-agent/scripts
          python -m py_compile monster_v4_stage135_full_market_publisher_minute_coverage.py monster_v4_stage137_dynamic_t0_original_core_causal_replay.py
          python -m unittest -v test_monster_v4_stage137_dynamic_t0_original_core_causal_replay.py
      - name: Offline-only runner refuses missing explicit raw T0 and archive source
        shell: bash
        run: |
          if python crypto-300-profit-mission/local-agent/scripts/monster_v4_stage137_dynamic_t0_original_core_causal_replay.py --out /tmp/monster-stage137-no-user.json; then
            echo 'STAGE137_MISSING_T0_FAIL_OPEN'
            exit 1
          fi
          test ! -f /tmp/monster-stage137-no-user.json
          echo 'STAGE137_NO_LIVE_SOURCE_NO_SCHEDULE_NO_GMAIL_NO_MAC=PASS'
