name: Frank expired historical review - readonly browser acknowledgement
on:
  push:
    branches: [feature/frank-review-expiry-ack-20261022]
  pull_request:
    branches: [feature/frank-amount-free-intelligence-p1p2-20261020]
permissions:
  contents: read
jobs:
  offline-ack:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install existing test dependencies
        working-directory: crypto-300-profit-mission/local-agent
        run: python -m pip install -e '.[dev]'
      - name: JS/Python syntax and scoped regressions
        working-directory: crypto-300-profit-mission/local-agent
        run: |
          python -B -m py_compile mission_agent/mission_control/delivery_review.py mission_agent/mission_control/server.py
          node --check mission_agent/mission_control/static/app.js
          python -B -m pytest -q -p no:cacheprovider tests/test_frank_expired_review_ack.py tests/test_mission_control_dashboard.py tests/test_frank_activity_watch_dashboard.py tests/test_frank_intelligence_dashboard_integration.py
