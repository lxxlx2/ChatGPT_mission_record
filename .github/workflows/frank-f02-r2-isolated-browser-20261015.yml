name: Frank F02-R2 isolated localhost browser
on:
  push:
    branches:
      - dev/frank-f02-r2-isolated-browser-20261015
      - fix/frank-f02-r2-ttl-live-expiry-20261015
      - codex/frank-f02-manual-source-refresh-20261015
      - dev/frank-f02-r3-offline-session-attestation-20261015
      - dev/frank-f01-c02-f02-joined-evidence-20261015
      - dev/frank-f01-c02-f02-http-readonly-20261015
      - fix/frank-pr70-http-source-contract-p2-20261015
      - dev/frank-f01-c02-f02-pinned-isolated-workspace-20261015
  workflow_dispatch:
permissions:
  contents: read
jobs:
  module:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install developer test dependencies
        working-directory: crypto-300-profit-mission/local-agent
        run: python -m pip install -e '.[dev]' numpy==2.3.3 pyflakes==3.4.0
      - name: Python/Node syntax and real JS DOM render
        working-directory: crypto-300-profit-mission/local-agent
        run: |
          python -B -m compileall -q scripts/frank_f02_manual_refresh.py scripts/frank_f02_r3_offline_attestation.py scripts/frank_f02_readonly_positions_api.py scripts/frank_joint_readonly_http.py scripts/frank_pinned_joint_workspace.py mission_agent/mission_control/frank_ca_f02_alignment.py tests/test_frank_f01_c02_f02_alignment.py tests/test_frank_joint_readonly_http.py tests/test_frank_joint_http_p2_regression.py tests/test_frank_pinned_joint_workspace.py tests/test_frank_f02_manual_refresh.py tests/test_frank_f02_r3_offline_attestation.py tests/test_frank_f02_r2_isolated_browser.py
          python -m pyflakes scripts/frank_f02_manual_refresh.py scripts/frank_f02_r3_offline_attestation.py scripts/frank_f02_readonly_positions_api.py scripts/frank_joint_readonly_http.py scripts/frank_pinned_joint_workspace.py mission_agent/mission_control/frank_ca_f02_alignment.py tests/test_frank_f01_c02_f02_alignment.py tests/test_frank_joint_readonly_http.py tests/test_frank_joint_http_p2_regression.py tests/test_frank_pinned_joint_workspace.py tests/test_frank_f02_manual_refresh.py tests/test_frank_f02_r2_isolated_browser.py
          node --check scripts/frank_f02_web/positions.js
          node --check tests/frank_f02_r2_render.cjs
          node tests/frank_f02_r2_render.cjs
      - name: F02-R2 real localhost HTTP and upstream A05/F02
        working-directory: crypto-300-profit-mission/local-agent
        run: |
          python -B -m pytest -q -p no:cacheprovider tests/test_frank_f01_c02_f02_alignment.py tests/test_frank_joint_readonly_http.py tests/test_frank_joint_http_p2_regression.py tests/test_frank_pinned_joint_workspace.py tests/test_frank_f02_manual_refresh.py tests/test_frank_f02_r2_isolated_browser.py tests/test_frank_f02_r1_readonly_positions_api.py tests/test_frank_a05_r2_frozen32_offline.py tests/test_frank_a05_complete_rpc_receipts.py tests/test_frank_a05_f02_latest_inventory.py
      - name: Full regression
        working-directory: crypto-300-profit-mission/local-agent
        env:
          FRANK_EXPECT_REAL_GIT_REPLAY: '1'
        run: python -B -m pytest -q -p no:cacheprovider tests
  combined:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Assemble disposable exact-SHA Git workspace (never main)
        run: |
          set -eu
          git fetch --no-tags origin "+refs/heads/*:refs/remotes/origin/*"
          python crypto-300-profit-mission/local-agent/scripts/frank_pinned_joint_workspace.py --assemble --source-repo "$GITHUB_WORKSPACE" --staging-root "$RUNNER_TEMP" --name frank-joint-ci --integration-sha "$GITHUB_SHA"
          python crypto-300-profit-mission/local-agent/scripts/frank_pinned_joint_workspace.py --verify --staging-root "$RUNNER_TEMP" --name frank-joint-ci
      - name: Install test deps
        working-directory: ${{ runner.temp }}/frank-joint-ci/crypto-300-profit-mission/local-agent
        run: python -m pip install -e '.[dev]' numpy==2.3.3 pyflakes==3.4.0
      - name: Combined JS and focused tests
        working-directory: ${{ runner.temp }}/frank-joint-ci/crypto-300-profit-mission/local-agent
        run: |
          python -m pyflakes integration_tests/test_frank_f01_c02_f02_exact_contract.py integration_tests/test_frank_joint_native_control_http.py
          node --check mission_agent/mission_control/static/app.js
          node tests/ca_identity_render.cjs
          node tests/frank_f02_r2_render.cjs
          python -B -m pytest -q -p no:cacheprovider tests/test_frank_f01_c02_f02_alignment.py tests/test_frank_joint_readonly_http.py tests/test_frank_joint_http_p2_regression.py tests/test_frank_pinned_joint_workspace.py tests/test_frank_f02_manual_refresh.py tests/test_frank_f02_r2_isolated_browser.py tests/test_frank_f02_r1_readonly_positions_api.py tests/test_frank_a05_r2_frozen32_offline.py tests/test_frank_a05_complete_rpc_receipts.py tests/test_frank_a05_f02_latest_inventory.py tests/test_follow_opportunity_f01.py tests/test_follow_opportunity_f01_integration.py tests/test_frank_ca_c02_claude_review_regression.py integration_tests/test_frank_f01_c02_f02_exact_contract.py integration_tests/test_frank_joint_native_control_http.py
      - name: Full combined regression
        working-directory: ${{ runner.temp }}/frank-joint-ci/crypto-300-profit-mission/local-agent
        env:
          FRANK_EXPECT_REAL_GIT_REPLAY: '1'
        run: python -B -m pytest -q -p no:cacheprovider tests
