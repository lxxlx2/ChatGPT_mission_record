name: Frank A05 F02 latest inventory combined C02 F01 regression
on:
  push:
    branches:
      - dev/frank-a05-f02-latest-inventory-evidence-20261014
  workflow_dispatch:
permissions:
  contents: read
jobs:
  merged-source-research:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Merge full independent research A04 F02, reviewed C02 and F01 on disposable tree
        run: |
          set -eu
          git config user.name "CI ephemeral integration"
          git config user.email "ci-only@example.invalid"
          git fetch --no-tags origin "+refs/heads/*:refs/remotes/origin/*"
          git switch --force-create ci-a05-f02-integrated origin/main
          for ref in             origin/dev/frank-a05-f02-latest-inventory-evidence-20261014             origin/fix/frank-ca-c02-identity-preview-casefold-review-20261014             origin/dev/frank-ca-f01-actionable-view-20261013
          do
            echo "SOURCE_MERGE_START: $ref"
            if ! git merge --no-edit --no-ff "$ref"; then
              echo "SOURCE_MERGE_CONFLICT: $ref"
              git diff --name-only --diff-filter=U
              exit 2
            fi
            echo "SOURCE_MERGE_PASS: $ref"
          done
          echo "SOURCE_MERGED_SHA=$(git rev-parse HEAD)"
      - name: Install CI deps
        working-directory: crypto-300-profit-mission/local-agent
        run: |
          python -m pip install -e '.[dev]' numpy==2.3.3 pyflakes==3.4.0
      - name: Focused A05 F02 and C02 F01 shared source read UI
        working-directory: crypto-300-profit-mission/local-agent
        run: |
          node --check mission_agent/mission_control/static/app.js
          node tests/ca_identity_render.cjs
          python -B -m pytest -q -p no:cacheprovider tests/test_frank_a05_f02_latest_inventory.py tests/test_frank_a04_a05_chain_capture.py tests/test_frank_ca_c02_claude_review_regression.py tests/test_follow_opportunity_f01.py tests/test_follow_opportunity_f01_integration.py
      - name: Full joint local-agent real Git suite
        working-directory: crypto-300-profit-mission/local-agent
        env:
          FRANK_EXPECT_REAL_GIT_REPLAY: '1'
        run: |
          python -B -m pytest -q -p no:cacheprovider tests
