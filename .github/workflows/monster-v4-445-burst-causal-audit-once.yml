name: Monster 445 true shared D0 burst queue audit once (research only)
on:
  push:
    branches: [research/monster-v4-local-discovery-20261010]
    paths:
      - 'crypto-300-profit-mission/monster/source-batches/monster_feb445_burst_audit_request.json'
permissions:
  contents: write
  actions: read
concurrency:
  group: monster445-true-burst-audit-research-once
  cancel-in-progress: false
jobs:
  real_source_pinned_burst_audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify explicit sole-file one-shot research request
        run: |
          set -eu
          python - <<'PY'
          import json,subprocess
          from pathlib import Path
          target='crypto-300-profit-mission/monster/source-batches/monster_feb445_burst_audit_request.json'
          changed=subprocess.check_output(
              ['git','diff-tree','--no-commit-id','--name-only','-r','HEAD'],
              text=True).splitlines()
          expected={'schema':'MONSTER445_SOURCE_PINNED_BURST_AUDIT_REQUEST_V5',
                    'artifact_id':12044872933,
                    'source_sha256':'370c34fbe8c2e914de54d87068b329405fc94c9d2624f7e3d8701155b10d67cf',
                    'research_only':True,'approved_scope':'POSTMORTEM_ONLY'}
          if changed!=[target] or json.loads(Path(target).read_text())!=expected:
              raise ValueError('MONSTER445_BURST_NOT_EXPLICIT_FROZEN_SINGLE_FILE_REQUEST')
          print('MONSTER445_BURST_ONCE_PINNED_REQUEST_OK')
          PY
          test "$GITHUB_REF_NAME" = "research/monster-v4-local-discovery-20261010"
      - name: Download real original shared 445 replay report and validate all inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          mkdir -p /tmp/monster445_real_burst
          gh run download 38898752712 --repo lxxlx2/ChatGPT_mission_record --dir /tmp/monster445_real_burst --name monster-feb445-all445-real-original-shared-D0D1-once
          test "$(find /tmp/monster445_real_burst -maxdepth 1 -type f | wc -l)" -eq 3
          printf '%s  %s\n' 370c34fbe8c2e914de54d87068b329405fc94c9d2624f7e3d8701155b10d67cf /tmp/monster445_real_burst/monster_feb445_all445_one_sqlite_full_result.json | sha256sum -c -
          python -m py_compile crypto-300-profit-mission/local-agent/scripts/monster_v4_shared_445_burst_audit.py
          (cd crypto-300-profit-mission/local-agent/scripts && python -m unittest -v test_monster_v4_shared_445_source_shards test_monster_v4_shared_445_archive_replay_runner test_monster_v4_shared_445_claude_review_fixes test_monster_v4_shared_d1_zeroquote_research_v2)
          (cd crypto-300-profit-mission/local-agent/scripts && python - <<'PY'
          import monster_v4_shadow as prod
          from decimal import Decimal
          now=1770000000000
          interval=5*60000
          bars=[]
          for i in range(8):
              end=now-(7-i)*interval-1
              bars.append([end-interval+1,"1","1.1","0.9","1.05",
                           "1",end,"100"])
          outcome=prod.evaluate_closed_5m(bars,now)
          assert outcome["closed_5m"]==6
          bars[0][7]="0"
          try:
              prod.evaluate_closed_5m(bars,now)
          except ValueError:
              print("MONSTER445_ORIGINAL_PRODUCTION_REJECTS_MARKET_NO_TRADE_EVEN_IN_FIRST_TWO_OF_EIGHT")
          else:
              raise AssertionError("original production silently accepts leading market zero")
          PY
          )
          python crypto-300-profit-mission/local-agent/scripts/monster_v4_shared_445_burst_audit.py --full /tmp/monster445_real_burst/monster_feb445_all445_one_sqlite_full_result.json --summary /tmp/monster445_real_burst/monster_feb445_all445_one_sqlite_summary.json --out /tmp/monster445_real_burst/monster445_true_burst_exact_anchor_audit.json
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('/tmp/monster445_real_burst/monster445_true_burst_exact_anchor_audit.json').read_text())
          assert r['peak_same_tick_watch']==98 and r['peak_related_late']==91
          assert r['overall_late']==93 and r['theoretical_max_one_pass_slots_for_peak_with_zero_competition']==48
          assert r['theoretical_min_peak_not_one_pass_served_by_deadline']==50
          assert r['G6']=='NO_GO'
          assert r['setup_event_matching']=='PRODUCTION_EVENT_KEY_SHA256_EXACT_QUEUE_ID'
          assert r['late_event_matching']=='PRODUCTION_EVENT_KEY_SHA256_EXACT_QUEUE_ID'
          assert r['watch_episodes_with_setup_in_15m']==120
          assert r['late_review_origin_counts']=={'D1_PROCESS_QUEUE_DEADLINE_EXPIRED':93}
          assert r['late_review_origin_reconciled_with_queue'] is True
          assert r['D1_market_no_trade_vs_missing_source_determined_from_event_rows']=='NOT_DETERMINABLE_FROM_EVENTS_ALONE'
          assert r['D1_zeroquote_legacy_terminal_by_symbol_from_queue']=={'ACAUSDT':2,'GUSDT':1}
          assert r['D1_zeroquote_legacy_terminal_count_from_queue']==3
          assert len(r['verified_model_code_git_blobs'])==3
          print('MONSTER445_REAL_EVENT_QUEUE_CAUSAL_ACCOUNTING_BURST98_LATE91_93_PASS')
          PY
      - name: Re-download all 18 historical originals and cross-check all 28 issuer manifests against Git proof
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          (cd crypto-300-profit-mission/local-agent/scripts && python monster_v4_shared_445_archive_replay_runner.py collect --source-dir /tmp/monster445_recheck_origins --audit /tmp/monster445_recheck_origin_audit.json)
          (cd crypto-300-profit-mission/local-agent/scripts && python - <<'PY'
          import hashlib,json
          from pathlib import Path
          import monster_v4_shared_445_official_source_shards as shards
          source=Path('/tmp/monster445_recheck_origins')
          total=0
          records=[]
          for idx in range(28):
              stem=f'monster_feb445_shard{idx:02d}'
              proof=json.loads((source/f'{stem}.proof.json').read_text())
              tuples=list(shards.read_archive(source/f'{stem}.zip',
                        proof=proof,expected_shard=idx))
              if [row[0] for row in tuples] != list(shards.members(idx)):
                  raise RuntimeError('MONSTER445_REVIEW_ORIGINAL_ROSTER_CHANGED')
              for symbol,bars,receipts,_ in tuples:
                  if len(bars)!=12960 or len(receipts)!=10:
                      raise RuntimeError('MONSTER445_REVIEW_RAW_SOURCE_INCOMPLETE')
                  total+=len(receipts)
              records.append({
                  'shard':idx,'symbols':len(tuples),
                  'publisher_days':sum(len(row[2]) for row in tuples),
                  'zip_sha256':proof['sha256_zip'],
                  'publisher_proof_equals_manifest':True})
          if total!=4450 or sum(x['symbols'] for x in records)!=445:
              raise RuntimeError('MONSTER445_REVIEW_4450_DAILY_SHA_SOURCE_COUNT_DRIFT')
          payload={
              'schema':'MONSTER445_REVIEW_ALL_28_ORIGINAL_SOURCE_PROOF_MANIFEST_CROSSCHECK_V1',
              'original_full_replay_artifact_id':12044872933,
              'source_complete_symbols':445,
              'historical_source_censored_original758':313,
              'publisher_days_sha_receipts':total,
              'all_28_raw_shards_directly_rechecked':True,
              'source_provenance_issuer_sha_equals_manifest':True,
              'per_shard':records,
              'research_only':True,'G4':'UNKNOWN','G6':'NO_GO'
          }
          dest=Path('/tmp/monster445_real_burst/monster445_original_source_proof_manifest_crosscheck.json')
          dest.write_text(json.dumps(payload,indent=2,sort_keys=True)+chr(10))
          if json.loads(dest.read_text()) != payload:
              raise RuntimeError('MONSTER445_SOURCE_AUDIT_JSON_ROUNDTRIP_FAILED')
          print('MONSTER445_REAL_28_ARCHIVES_4450_ISSUER_SHA_CROSSCHECKED_AGAINST_SOURCE_MANIFEST')
          PY
          )
      - uses: actions/upload-artifact@v4
        with:
          name: monster445-real-burst-claude-N1-N3-independent-review
          path: |
            /tmp/monster445_real_burst/monster445_true_burst_exact_anchor_audit.json
            /tmp/monster445_real_burst/monster445_original_source_proof_manifest_crosscheck.json
          retention-days: 60
          if-no-files-found: error
      - name: Git seal small read-only burst diagnostic with immutable source, no producer code mutation
        run: |
          set -eu
          branch=research/monster-v4-local-discovery-20261010
          report=crypto-300-profit-mission/monster/evidence/monster_feb445_true_burst_causal_audit_review_n1_n3_actual.json
          if test -e "$report"; then
            echo MONSTER445_BURST_REPORT_MUST_NOT_REPLACE_EXISTING
            exit 1
          fi
          cp /tmp/monster445_real_burst/monster445_true_burst_exact_anchor_audit.json "$report"
          extra=crypto-300-profit-mission/monster/evidence/monster_feb445_original28_publisher_sha_proof_manifest_review_n3_actual.json
          if test -e "$extra"; then
            echo MONSTER445_REVIEW_SOURCE_MANIFEST_ALREADY_ARCHIVED
            exit 1
          fi
          cp /tmp/monster445_real_burst/monster445_original_source_proof_manifest_crosscheck.json "$extra"
          git add "$report" "$extra"
          git config user.name monster-research-ci
          git config user.email monster-research-ci@users.noreply.github.com
          git commit -m "monster: immutable source anchor-exact 120 SETUP and 93 late; proof/core SHA verified"
          git fetch origin "refs/heads/$branch"
          if git cat-file -e "FETCH_HEAD:$extra" 2>/dev/null; then
            echo MONSTER445_REVIEW_REMOTE_SOURCE_AUDIT_ALREADY_EXISTS
            exit 1
          fi
          if git cat-file -e "FETCH_HEAD:$report" 2>/dev/null; then
            echo MONSTER445_BURST_REMOTE_REPORT_ALREADY_EXISTS
            exit 1
          fi
          git rebase FETCH_HEAD
          for file in crypto-300-profit-mission/local-agent/scripts/monster_v4_shared_445_burst_audit.py crypto-300-profit-mission/local-agent/scripts/test_monster_v4_shared_445_claude_review_fixes.py crypto-300-profit-mission/local-agent/scripts/monster_v4_shared_445_official_source_shards.py crypto-300-profit-mission/local-agent/scripts/test_monster_v4_shared_445_source_shards.py crypto-300-profit-mission/local-agent/scripts/monster_v4_shared_445_archive_replay_runner.py crypto-300-profit-mission/local-agent/scripts/test_monster_v4_shared_445_archive_replay_runner.py .github/workflows/monster-v4-445-burst-causal-audit-once.yml crypto-300-profit-mission/monster/source-batches/monster_feb445_burst_audit_request.json crypto-300-profit-mission/monster/evidence/monster_feb445_all445_one_sqlite_replay_actual.json; do
            test "$(git rev-parse "$GITHUB_SHA:$file")" = "$(git rev-parse "HEAD:$file")" || { echo "MONSTER445_BURST_FREEZE_FILE_CHANGED=$file"; exit 1; }
          done
          git push origin "HEAD:refs/heads/$branch"
          echo MONSTER445_REAL_BURST_POSTMORTEM_N1_N3_EXACT_REASON_SHA_PINNED_GIT_SEALED
