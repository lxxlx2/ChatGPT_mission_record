name: Monster Stage139 official as-of instrument and saved contract lifecycle evidence offline

on:
  push:
    branches:
      - research/monster-v4-local-discovery-20261010
    paths:
      - 'crypto-300-profit-mission/local-agent/scripts/monster_v4_stage139_official_t0_and_saved_contractinfo_evidence.py'
      - 'crypto-300-profit-mission/local-agent/scripts/test_monster_v4_stage139_official_t0_and_saved_contractinfo_evidence.py'
      - '.github/workflows/monster-stage139-official-asof-contract-info-offline.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'crypto-300-profit-mission/local-agent/scripts/monster_v4_stage139_official_t0_and_saved_contractinfo_evidence.py'
      - 'crypto-300-profit-mission/local-agent/scripts/test_monster_v4_stage139_official_t0_and_saved_contractinfo_evidence.py'
      - '.github/workflows/monster-stage139-official-asof-contract-info-offline.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  official-original-asof-only:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile and test actual Stage133/134 frozen receipt join and saved contractInfo event source integrity
        run: |
          cd crypto-300-profit-mission/local-agent/scripts
          python -m py_compile monster_v4_stage139_official_t0_and_saved_contractinfo_evidence.py
          python -m unittest -v test_monster_v4_stage139_official_t0_and_saved_contractinfo_evidence.py
      - name: Refuse absent Stage133 T0 instead of automatic source gathering
        shell: bash
        run: |
          if python crypto-300-profit-mission/local-agent/scripts/monster_v4_stage139_official_t0_and_saved_contractinfo_evidence.py --out /tmp/monster-stage139-unrequested.json; then
            echo 'STAGE139_IMPLICIT_NETWORK_OR_T0=FAIL'
            exit 1
          fi
          test ! -f /tmp/monster-stage139-unrequested.json
          echo 'STAGE139_SOURCE_AUDIT_ONLY_NO_LIVE_WS_NO_HTTP_NO_SCHEDULE_NO_GMAIL_NO_FRANK=PASS'
