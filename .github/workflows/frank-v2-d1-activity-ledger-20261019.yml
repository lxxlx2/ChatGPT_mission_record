name: Frank V2 D1 wallet activity feed
on:
  push:
    branches:
      - feat/frank-v2-d1-activity-ledger-gpt-20261019
  workflow_dispatch:
permissions:
  contents: read
jobs:
  readonly-ledger-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Immutable source and product exclusion
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo "FRANK_D1_LEDGER_SHA=$GITHUB_SHA"
          git diff --quiet ee4baaf5ffd9719094c91d3cd96eaf54bf22cb4a HEAD -- crypto-300-profit-mission/local-agent/mission_agent/ || (echo "PRODUCTION_MISSION_AGENT_CHANGED"; exit 1)
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Real SQLite read-only event and ATA evidence tests
        working-directory: crypto-300-profit-mission/local-agent
        run: |
          python -B -m unittest discover -s tests -p 'test_frank_d1_activity_ledger.py' -v
          python -B -m py_compile scripts/frank_d1_activity_ledger.py
      - name: Existing test dependencies
        working-directory: crypto-300-profit-mission/local-agent
        run: |
          python -m pip install -e '.[dev]'
          python -m pip install numpy==2.3.3
      - name: Full offline research replay
        working-directory: crypto-300-profit-mission/local-agent
        env:
          FRANK_EXPECT_REAL_GIT_REPLAY: '1'
        run: python -B -m pytest -q -p no:cacheprovider tests
