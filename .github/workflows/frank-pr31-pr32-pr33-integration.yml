name: Frank PR31 PR32 PR33 isolated merge matrix

on:
  push:
    branches:
      - research/frank-pr31-pr32-pr33-integration-20261011
    paths:
      - '.github/workflows/frank-pr31-pr32-pr33-integration.yml'
      - 'crypto-300-profit-mission/meme/FRANK_PR31_PR32_PR33_INTEGRATION_2026-10-11.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  merge-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        mode: [pr32, pr33, pr32-pr33, pr31-pr32-pr33]
    env:
      BASE_SHA: '383dddf517b221cc5366c6a2b67ca4f6779e597e'
      PR31_SHA: 'c65d04a8f14d7efe6e0956fa2914781ec2d96b5f'
      PR32_SHA: '85f1a792dd7d0fbf354c09ac83872887ed301c10'
      PR33_SHA: '33500489d611f2ef1b24421e7aa8127701411b5d'
      FRANK_EXPECT_REAL_GIT_REPLAY: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Construct exact isolated git merge tree with no remote writes
        shell: bash
        env:
          MODE: ${{ matrix.mode }}
        run: |
          set -euo pipefail
          git config user.name 'Frank Research CI'
          git config user.email 'frank-research-ci@users.noreply.github.com'
          for name in BASE_SHA PR31_SHA PR32_SHA PR33_SHA; do
            sha="${!name}"
            git cat-file -e "$sha^{commit}" || { echo "MISSING_PINNED_COMMIT $name $sha"; exit 9; }
          done
          git fetch origin 'refs/heads/evidence/frank-ca-local:refs/remotes/origin/evidence/frank-ca-local'
          git switch --detach "$BASE_SHA"
          git switch -c "frank-merge-${MODE}"
          if [[ "$MODE" == "pr32" || "$MODE" == "pr32-pr33" || "$MODE" == "pr31-pr32-pr33" ]]; then
            git merge --no-ff --no-edit -m "CI-only merge PR32" "$PR32_SHA"
          fi
          if [[ "$MODE" == "pr33" || "$MODE" == "pr32-pr33" || "$MODE" == "pr31-pr32-pr33" ]]; then
            git merge --no-ff --no-edit -m "CI-only merge PR33" "$PR33_SHA"
          fi
          if [[ "$MODE" == "pr31-pr32-pr33" ]]; then
            git merge --no-ff --no-edit -m "CI-only merge PR31" "$PR31_SHA"
          fi
          test -z "$(git ls-files --unmerged)"
          if git diff --name-only "$BASE_SHA" HEAD | grep -E '^crypto-300-profit-mission/local-agent/(mission_agent/frank/|mission_agent/signals/)' ; then
            echo 'FROZEN_V1_FILE_CHANGED'; exit 8
          fi
          echo "MATRIX_MODE=$MODE" >> "$GITHUB_ENV"
          echo "MERGED_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          printf "mode=%s\nbase=%s\npr31=%s\npr32=%s\npr33=%s\nresult=%s\n" "$MODE" "$BASE_SHA" "$PR31_SHA" "$PR32_SHA" "$PR33_SHA" "$(git rev-parse HEAD)" | tee merge-provenance.txt
          git diff --name-status "$BASE_SHA" HEAD > merge-changed-files.txt
          git status --porcelain
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project dev requirements
        working-directory: crypto-300-profit-mission/local-agent
        run: |
          python -m pip install -e '.[dev]' 'numpy>=2,<3' 'pyflakes==3.4.0'
      - name: Syntax and independent static verification
        working-directory: crypto-300-profit-mission/local-agent
        run: |
          python -B -m compileall -q mission_agent scripts tests
          python -m pyflakes mission_agent/mission_control/delivery_review.py mission_agent/mission_control/server.py mission_agent/mission_control/service.py
          if [ -f scripts/reauthorize_existing_gmail.py ]; then python -m pyflakes scripts/reauthorize_existing_gmail.py; fi
          if [ -f scripts/deploy_frank_dashboard_review_badge.py ]; then python -m pyflakes scripts/deploy_frank_dashboard_review_badge.py; fi
          node --check mission_agent/mission_control/static/app.js
      - name: Full regression suite against the actual CI merge tree
        working-directory: crypto-300-profit-mission/local-agent
        run: |
          python -m pytest -q tests --junitxml="../../frank-integration-junit.xml"
      - name: Upload immutable research evidence from ephemeral runner
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frank-merge-${{ matrix.mode }}-${{ github.sha }}
          path: |
            merge-provenance.txt
            merge-changed-files.txt
            frank-integration-junit.xml
          if-no-files-found: warn
          retention-days: 14
