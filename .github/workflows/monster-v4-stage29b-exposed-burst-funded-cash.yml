name: Monster Stage29b All110 Burst Meme Cash Real 30 300U Source Rehash
on:
  push:
    branches:
      - research/monster-v4-local-discovery-20261010
    paths:
      - 'crypto-300-profit-mission/local-agent/scripts/monster_v4_stage29b_posthoc_burst_cash.py'
      - 'crypto-300-profit-mission/local-agent/tests/test_monster_v4_stage29b_posthoc_burst_cash.py'
      - '.github/workflows/monster-v4-stage29b-exposed-burst-funded-cash.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: monster-stage29b-funded-110-actual-sha-${{ github.ref }}
  cancel-in-progress: true
jobs:
  actual-36-original-v4-burst-110-funded-budget:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate posthoc scope, source byte SHA gate, no-future 10-slot chronological capital safety
        working-directory: crypto-300-profit-mission/local-agent
        run: |
          python -B -m py_compile scripts/monster_v4_stage29b_posthoc_burst_cash.py tests/test_monster_v4_stage29b_posthoc_burst_cash.py
          python -B -m unittest discover -v -s tests -p test_monster_v4_stage29b_posthoc_burst_cash.py
      - name: Retrieve all36 actual Binance-verifiable original Stage26 market tapes and original Stage29 marked exposed result
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY' > /tmp/monster29b_originals.tsv
          import json
          from pathlib import Path
          root=Path("crypto-300-profit-mission/monster/evidence")
          proof=json.loads((root/"monster_stage26_verified_sharded_168h_artifact_proof_20261011.json").read_text())
          frozen=json.loads((root/"monster_stage29b_burst_cash_diagnostic_frozen_20261011.json").read_text())
          if len(proof["artifacts"])!=36 or frozen["original_source_artifact_id"]!=11706590853:
              raise SystemExit("STAGE29B_PRIOR_ARTIFACT_NOT_FROZEN")
          for a in sorted(proof["artifacts"],key=lambda x:(x["date"],x["shard"])):
              print(a["date"],a["shard"],a["artifact_id"])
          PY
          while read -r day shard artifact; do
            gh api -H 'Accept: application/vnd.github+json' repos/lxxlx2/ChatGPT_mission_record/actions/artifacts/"$artifact"/zip > "/tmp/monster_stage26_${day}_shard${shard}.zip"
          done < /tmp/monster29b_originals.tsv
          gh api -H 'Accept: application/vnd.github+json' repos/lxxlx2/ChatGPT_mission_record/actions/artifacts/11706590853/zip > /tmp/monster_stage29_verified_original.zip
      - name: Strict publisher-source SHA and original 110 WATCH funded 30/300U scenarios
        working-directory: crypto-300-profit-mission/local-agent
        run: |
          args=()
          while read -r day shard artifact; do
            args+=("/tmp/monster_stage26_${day}_shard${shard}.zip")
          done < /tmp/monster29b_originals.tsv
          python -B scripts/monster_v4_stage29b_posthoc_burst_cash.py --stage29-zip /tmp/monster_stage29_verified_original.zip --stage26-original-zips "${args[@]}" --output /tmp/monster_stage29b_exposed_110_burst_funded_cash_research.json
      - name: Save auditable 110-source burst chronological funded cash and 16 outcomes
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: monster-stage29b-posthoc-110-burst-36source-capital-audit
          path: /tmp/monster_stage29b_exposed_110_burst_funded_cash_research.json
          if-no-files-found: warn
          retention-days: 30
