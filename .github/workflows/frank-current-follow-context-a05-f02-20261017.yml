name: Frank current follow context A05 F02 read-only integration
on:
  push:
    branches:
      - dev/frank-current-follow-context-a05-f02-20261017
  workflow_dispatch:
permissions:
  contents: read
jobs:
  research-only:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependencies
        working-directory: crypto-300-profit-mission/local-agent
        run: python -m pip install -e '.[dev]' numpy==2.3.3 pyflakes==3.4.0
      - name: Syntax and scoped live localhost functional tests
        working-directory: crypto-300-profit-mission/local-agent
        run: |
          python -B -m compileall -q scripts/frank_joint_readonly_http.py tests/test_frank_joint_current_follow_context.py
          python -m pyflakes scripts/frank_joint_readonly_http.py tests/test_frank_joint_current_follow_context.py
          python -B -m pytest -q -p no:cacheprovider tests/test_frank_joint_current_follow_context.py tests/test_frank_joint_readonly_http.py tests/test_frank_f01_c02_f02_alignment.py tests/test_frank_f02_r1_readonly_positions_api.py
      - name: Full existing agent regression with real Git replay
        working-directory: crypto-300-profit-mission/local-agent
        env:
          FRANK_EXPECT_REAL_GIT_REPLAY: '1'
        run: python -B -m pytest -q -p no:cacheprovider tests
