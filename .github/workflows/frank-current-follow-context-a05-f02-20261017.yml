name: Frank current follow context A05 F02 read-only integration
on:
  push:
    branches:
      - dev/frank-current-follow-context-a05-f02-20261017
      - fix/frank-pr89-cross-source-review-p2-20261017
  workflow_dispatch:
permissions:
  contents: read
jobs:
  research-only:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependencies
        working-directory: crypto-300-profit-mission/local-agent
        run: python -m pip install -e '.[dev]' numpy==2.3.3 pyflakes==3.4.0
      - name: Syntax and scoped live localhost functional tests
        working-directory: crypto-300-profit-mission/local-agent
        run: |
          python -B -m compileall -q scripts/frank_joint_readonly_http.py tests/test_frank_joint_current_follow_context.py
          python -m pyflakes scripts/frank_joint_readonly_http.py tests/test_frank_joint_current_follow_context.py
          python -B -m pytest -q -p no:cacheprovider tests/test_frank_joint_current_follow_context.py tests/test_frank_joint_readonly_http.py tests/test_frank_f01_c02_f02_alignment.py tests/test_frank_f02_r1_readonly_positions_api.py
      - name: Full existing agent regression with real Git replay
        working-directory: crypto-300-profit-mission/local-agent
        env:
          FRANK_EXPECT_REAL_GIT_REPLAY: '1'
        run: python -B -m pytest -q -p no:cacheprovider tests

  combined-reviewed-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Assemble fixed reviewed F01 C02 and QA harness in disposable checkout
        id: assembly
        env:
          C02: 8d425e4d0e9db9f27abd8ad662e4d59e64b57e53
          F01: d2eeebc1b49d2bae38e05d7d01f6839e3ba237f4
          QA_HARNESS: 40febd8275c7710a8697af5a0503569a2bb5cb8d
          EVIDENCE: b9fb6e6df9032a0e6f49c1274bb4ba61c9e4c2da
          PARENT: 5755b8b96080f21635eaa5354588cbb8f6561ab0
        run: |
          set -euo pipefail
          git fetch --no-tags origin "refs/heads/fix/frank-c02-pr82-authority-presence-20261016:refs/remotes/origin/fix/frank-c02-pr82-authority-presence-20261016"
          git fetch --no-tags origin "refs/heads/fix/frank-f01-pr81-js-range-20261016:refs/remotes/origin/fix/frank-f01-pr81-js-range-20261016"
          git fetch --no-tags origin "refs/heads/qa/frank-f01-pr83-c02-pr84-f02-p73-isolated-20261016:refs/remotes/origin/qa/frank-f01-pr83-c02-pr84-f02-p73-isolated-20261016"
          git fetch --no-tags origin "refs/heads/evidence/frank-ca-local:refs/remotes/origin/evidence/frank-ca-local"
          test "$(git rev-parse refs/remotes/origin/fix/frank-c02-pr82-authority-presence-20261016)" = "$C02"
          test "$(git rev-parse refs/remotes/origin/fix/frank-f01-pr81-js-range-20261016)" = "$F01"
          test "$(git rev-parse refs/remotes/origin/qa/frank-f01-pr83-c02-pr84-f02-p73-isolated-20261016)" = "$QA_HARNESS"
          test "$(git rev-parse refs/remotes/origin/evidence/frank-ca-local)" = "$EVIDENCE"
          git merge-base --is-ancestor "$PARENT" "$GITHUB_SHA"
          dest="$(mktemp -d "$RUNNER_TEMP/frank-current-joint-XXXXXXXX")"
          git clone --no-local --quiet "$GITHUB_WORKSPACE" "$dest"
          git -C "$dest" checkout --quiet --detach "$GITHUB_SHA"
          git -C "$dest" fetch --no-tags --quiet "$GITHUB_WORKSPACE" "$C02" "$F01" "$QA_HARNESS"
          git -C "$dest" fetch --no-tags --quiet "$GITHUB_WORKSPACE" "refs/remotes/origin/evidence/frank-ca-local:refs/remotes/origin/evidence/frank-ca-local"
          test "$(git -C "$dest" rev-parse refs/remotes/origin/evidence/frank-ca-local)" = "$EVIDENCE"
          for sha in "$C02" "$F01" "$QA_HARNESS"; do
            git -C "$dest" -c user.name="Frank source QA" -c user.email="qa@example.invalid" merge --no-edit --no-ff --no-gpg-sign "$sha"
            git -C "$dest" merge-base --is-ancestor "$sha" HEAD
          done
          test -z "$(git -C "$dest" status --porcelain=v1 --untracked-files=all --ignored=matching)"
          echo "FRANK_DISPOSABLE_TREE=$(git -C "$dest" rev-parse HEAD^{tree})"
          echo "FRANK_DISPOSABLE_NO_PRODUCTION=true"
          echo "dest=$dest" >> "$GITHUB_OUTPUT"
      - name: Dependencies for combined sources
        working-directory: ${{ steps.assembly.outputs.dest }}/crypto-300-profit-mission/local-agent
        run: python -m pip install -e '.[dev]' numpy==2.3.3 pyflakes==3.4.0
      - name: Real combined F01 C02 F02 JavaScript render and current context HTTP
        working-directory: ${{ steps.assembly.outputs.dest }}/crypto-300-profit-mission/local-agent
        run: |
          node --check mission_agent/mission_control/static/app.js
          node tests/frank_f01_excluded_badge_render.cjs
          node tests/frank_f01_quote_projection_render.cjs
          node tests/ca_identity_render.cjs
          node tests/frank_f02_r2_render.cjs
          python -B -m pytest -q -p no:cacheprovider tests/test_frank_joint_current_follow_context.py tests/test_frank_joint_readonly_http.py tests/test_frank_f01_c02_f02_alignment.py integration_tests/test_frank_joint_native_control_http.py
      - name: Full combined source local-agent test suite
        working-directory: ${{ steps.assembly.outputs.dest }}/crypto-300-profit-mission/local-agent
        env:
          FRANK_EXPECT_REAL_GIT_REPLAY: '1'
        run: python -B -m pytest -q -p no:cacheprovider tests
