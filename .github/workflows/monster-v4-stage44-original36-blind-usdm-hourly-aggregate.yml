name: Monster Stage44 Strict 36 Blind Date Official Hourly SHA Aggregate
on:
  push:
    branches:
      - research/monster-v4-local-discovery-20261010
    paths:
      - 'crypto-300-profit-mission/local-agent/scripts/monster_v4_stage44_original36_blind_GT_aggregate.py'
      - '.github/workflows/monster-v4-stage44-original36-blind-usdm-hourly-aggregate.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  require36_original_and_persist_5400_source_truth:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Require successful original frozen six-date full900 source before touching outputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 220); do
            gh api repos/lxxlx2/ChatGPT_mission_record/actions/runs/38212473972 > /tmp/monster44_run.json
            status=$(python -c 'import json;print(json.load(open("/tmp/monster44_run.json"))["status"])')
            if test "$status" = completed; then
              python - <<'PY'
          import json
          j=json.load(open('/tmp/monster44_run.json'))
          if j['conclusion']!='success':raise SystemExit('STAGE44_NOT_ALL36_SOURCE_SHA_SUCCESS')
          print('STAGE44_ALL36_SOURCE_SHA_SUCCESS')
          PY
              break
            fi
            sleep 15
          done
          test "$status" = completed
      - name: Freeze original36 SHA from GitHub official artifact ledger
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api 'repos/lxxlx2/ChatGPT_mission_record/actions/runs/38212473972/artifacts?per_page=100' >/tmp/monster44_artifacts.json
          python - <<'PY'
          import json,re
          from pathlib import Path
          arr=json.load(open('/tmp/monster44_artifacts.json'))['artifacts']
          if len(arr)!=36:raise SystemExit('STAGE44_NOT_ALL36_ORIGINAL_SOURCE_ARCHIVES')
          items=[];seen=set()
          for a in arr:
            m=re.fullmatch(r'monster-stage44-locked-blind-(\d{4}-\d\d-\d\d)-shard([0-5])-SHA',a['name'])
            if not m or a.get('expired') or not a.get('digest','').startswith('sha256:'):
              raise SystemExit('STAGE44_INVALID_ORIGINAL_SOURCE_SHA')
            identity=(m.group(1),int(m.group(2)))
            if identity in seen:raise SystemExit('STAGE44_DUPLICATE_SOURCE')
            seen.add(identity)
            items.append({'date':identity[0],'shard':identity[1],
              'artifact_id':a['id'],'sha256':a['digest'].split(':')[1]})
          Path('/tmp/monster44_manifest.json').write_text(json.dumps({'source_run_id':38212473972,'artifacts':items}))
          Path('/tmp/monster44_ids').write_text('\n'.join(str(x['artifact_id']) for x in items)+'\n')
          print('STAGE44_ORIGINAL_SHA36_FROZEN')
          PY
      - name: Download original36 publisher-verified raw source artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/monster44_original36
          while read -r aid; do
            gh api -H 'Accept: application/vnd.github+json' "repos/lxxlx2/ChatGPT_mission_record/actions/artifacts/$aid/zip" > "/tmp/monster44_original36/$aid.zip"
          done </tmp/monster44_ids
      - name: Verify byte SHA and blind source-censored full900 GT in all six dates
        run: |
          python -B -m py_compile crypto-300-profit-mission/local-agent/scripts/monster_v4_stage44_original36_blind_GT_aggregate.py
          python -B crypto-300-profit-mission/local-agent/scripts/monster_v4_stage44_original36_blind_GT_aggregate.py \
            --manifest /tmp/monster44_manifest.json \
            --zip-dir /tmp/monster44_original36 \
            --out /tmp/monster44_out
      - name: Preserve strict independent original36 evidence artifact
        uses: actions/upload-artifact@v4
        with:
          name: monster-stage44-original36-sha-six-blind-900x6-futures-GT
          path: /tmp/monster44_out/*
          retention-days: 30
      - name: Commit full publisher-SHA actual blind GT without leakage to same research PR
        run: |
          test "$GITHUB_REF_NAME" = research/monster-v4-local-discovery-20261010
          dest=crypto-300-profit-mission/monster/evidence
          cp /tmp/monster44_out/monster_stage44_* "$dest/"
          git add "$dest/monster_stage44_original36_sha_six_blind_900x6_hourly_GT_summary.json" "$dest/monster_stage44_all5400_blind_dates_source_status_and_GT.csv" "$dest/monster_stage44_actual_complete_GT2x_registry.csv"
          if git diff --cached --quiet; then
            echo STAGE44_ALREADY_IDENTICAL_COMMIT
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'monster: persist Stage44 original36 SHA six frozen new-date official futures hourly truth'
          git push origin "HEAD:$GITHUB_REF_NAME"
