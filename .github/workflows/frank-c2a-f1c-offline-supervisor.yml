name: Frank C2A F1c offline release supervisor

on:
  push:
    branches: [feature/frank-c2a-f1c-offline-release-supervisor-20261026]
  pull_request:
    branches: [feature/frank-c2a-f1b-offline-emergency-rollback-20261026]

permissions:
  contents: read

jobs:
  synthetic-supervisor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install offline test dependency
        run: python -m pip install pytest==8.3.5
      - name: Syntax check all offline source and tests
        working-directory: crypto-300-profit-mission/local-agent
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python -B -m py_compile scripts/frank_c2a_f1_evidence.py scripts/frank_c2a_f1b_offline_recovery.py scripts/frank_c2a_f1c_offline_supervisor.py tests/test_frank_c2a_f1_evidence.py tests/test_frank_c2a_f1b_offline_recovery.py tests/test_frank_c2a_f1c_offline_supervisor.py
      - name: Synthetic-only F1, F1b, F1c matrix
        working-directory: crypto-300-profit-mission/local-agent
        env:
          PYTHONPATH: .
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -B -m pytest -q -p no:cacheprovider tests/test_frank_c2a_f1_evidence.py tests/test_frank_c2a_f1b_offline_recovery.py tests/test_frank_c2a_f1c_offline_supervisor.py
