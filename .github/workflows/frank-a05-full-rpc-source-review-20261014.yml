name: Frank A05 full RPC bytes archive and read-only replay research
on:
  push:
    branches:
      - dev/frank-a05-complete-owner-rpc-evidence-20261014
      - fix/frank-a05-rpc-transport-integrity-20261014
  workflow_dispatch:
permissions:
  contents: read
jobs:
  module-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test-only packages
        working-directory: crypto-300-profit-mission/local-agent
        run: |
          python -m pip install -e '.[dev]' numpy==2.3.3 pyflakes==3.4.0
      - name: Static and JS syntax
        working-directory: crypto-300-profit-mission/local-agent
        run: |
          python -B -m compileall -q mission_agent/mission_control/wallet_full_rpc_evidence.py scripts/frank_capture_owner_full_receipts.py tests/test_frank_a05_complete_rpc_receipts.py
          python -m pyflakes mission_agent/mission_control/wallet_full_rpc_evidence.py scripts/frank_capture_owner_full_receipts.py tests/test_frank_a05_complete_rpc_receipts.py
          node --check mission_agent/mission_control/static/app.js
      - name: A05 full source and approved latest inventory regression
        working-directory: crypto-300-profit-mission/local-agent
        run: |
          python -B -m pytest -q -p no:cacheprovider tests/test_frank_a05_complete_rpc_receipts.py tests/test_frank_a05_f02_latest_inventory.py tests/test_frank_a04_a05_chain_capture.py tests/test_frank_a04_generic_tx_versions.py
      - name: Full local-agent real Git source tests
        working-directory: crypto-300-profit-mission/local-agent
        env:
          FRANK_EXPECT_REAL_GIT_REPLAY: '1'
        run: |
          python -B -m pytest -q -p no:cacheprovider tests
