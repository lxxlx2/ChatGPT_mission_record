name: Monster Stage27 Source SHA Verified Shared Queue and Actual Cash Budget
on:
  push:
    branches:
      - research/monster-v4-local-discovery-20261010
    paths:
      - 'crypto-300-profit-mission/local-agent/scripts/monster_v4_stage27_shared_queue_cash_ledger.py'
      - 'crypto-300-profit-mission/local-agent/tests/test_monster_v4_stage27_shared_queue_cash_ledger.py'
      - 'crypto-300-profit-mission/monster/evidence/monster_stage27_shared_queue_cash_budget_prereg_20261011.json'
      - '.github/workflows/monster-v4-stage27-shared-queue-funded-cash-ledger.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: monster-stage27-36original-sha-cash-${{ github.ref }}
  cancel-in-progress: true
jobs:
  real-frozen-source-shared-d1-queue-and-no-overdraft:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Enforce original queue capacity and funded wallet regression gates
        working-directory: crypto-300-profit-mission/local-agent
        run: |
          python -B -m py_compile scripts/monster_v4_stage27_shared_queue_cash_ledger.py tests/test_monster_v4_stage27_shared_queue_cash_ledger.py
          python -B -m unittest discover -v -s tests -p test_monster_v4_stage27_shared_queue_cash_ledger.py
      - name: Re-download all original SHA-listed 36 official seven-day full market V4 evidence shards
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY' > /tmp/monster27_originals.tsv
          import json
          from pathlib import Path
          p=Path("crypto-300-profit-mission/monster/evidence/monster_stage26_verified_sharded_168h_artifact_proof_20261011.json")
          x=json.loads(p.read_text())
          if x["source_ci_conclusion"]!="SUCCESS_ALL_36" or len(x["artifacts"])!=36:
              raise SystemExit("STAGE27_SOURCE_PROOF_INVALID")
          for a in sorted(x["artifacts"],key=lambda y:(y["date"],y["shard"])):
              print(a["date"],a["shard"],a["artifact_id"])
          PY
          while read -r day shard artifact; do
            gh api -H 'Accept: application/vnd.github+json' repos/lxxlx2/ChatGPT_mission_record/actions/artifacts/"$artifact"/zip > "/tmp/monster_stage26_${day}_shard${shard}.zip"
          done < /tmp/monster27_originals.tsv
      - name: SHA verify every original 36 ZIP and 36 JSON, simulate 1132 WATCH shared D1 queue and fully funded cash with stress limits
        working-directory: crypto-300-profit-mission/local-agent
        run: |
          args=()
          while read -r day shard artifact; do
            args+=("/tmp/monster_stage26_${day}_shard${shard}.zip")
          done < /tmp/monster27_originals.tsv
          python -B scripts/monster_v4_stage27_shared_queue_cash_ledger.py --artifact-zips "${args[@]}" --output /tmp/monster_stage27_original_shard_queue_cash_ledger.json
      - name: Preserve complete time-ordered shared D1 pressure and funded 30/300 U cash cases
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: monster-stage27-36source-fullqueue-fundedcash-audit
          path: /tmp/monster_stage27_original_shard_queue_cash_ledger.json
          retention-days: 30
          if-no-files-found: warn
