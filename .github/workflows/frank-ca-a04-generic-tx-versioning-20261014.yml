name: Frank A04 Claude generic TX V2 to V3 identity fix
on:
  push:
    branches:
      - fix/frank-ca-a04-versioned-generic-tx-20261014
  workflow_dispatch:
permissions:
  contents: read
jobs:
  generic-version-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dedicated tests
        working-directory: crypto-300-profit-mission/local-agent
        run: |
          python -m pip install -e '.[dev]' numpy==2.3.3 pyflakes==3.4.0
      - name: Python and JS checks
        working-directory: crypto-300-profit-mission/local-agent
        run: |
          python -B -m compileall -q mission_agent/mission_control/wallet_evidence_store.py tests/test_frank_a04_generic_tx_versions.py tests/_a04_generic_tx_v2_parent_create.py tests/_a04_generic_tx_v3_upgrade_verify.py
          python -m pyflakes mission_agent/mission_control/wallet_evidence_store.py tests/test_frank_a04_generic_tx_versions.py tests/_a04_generic_tx_v2_parent_create.py tests/_a04_generic_tx_v3_upgrade_verify.py
          node --check mission_agent/mission_control/static/app.js
      - name: Create actual old unversioned generic TX through frozen PR52
        env:
          FRANK_A04_LEGACY_GENERIC_TX_PATH: ${{ runner.temp }}/old-generic-v2.sqlite
        run: |
          git worktree add --detach "${RUNNER_TEMP}/frank-old-v2-parent" e547203c6e4b00c80372c125785c9feb72fb8e87
          PYTHONPATH="${RUNNER_TEMP}/frank-old-v2-parent/crypto-300-profit-mission/local-agent:${RUNNER_TEMP}/frank-old-v2-parent/crypto-300-profit-mission/local-agent/tests" python crypto-300-profit-mission/local-agent/tests/_a04_generic_tx_v2_parent_create.py
      - name: Import V3 through current generic TX API and prove source unchanged
        working-directory: crypto-300-profit-mission/local-agent
        env:
          FRANK_A04_LEGACY_GENERIC_TX_PATH: ${{ runner.temp }}/old-generic-v2.sqlite
        run: |
          python -B tests/_a04_generic_tx_v3_upgrade_verify.py
      - name: Focused A04 owner gap migration and generic TX tests
        working-directory: crypto-300-profit-mission/local-agent
        run: |
          python -B -m pytest -q -p no:cacheprovider tests/test_frank_a04_generic_tx_versions.py tests/test_frank_a04_v2_v3_upgrade.py tests/test_frank_a04_claude_fourth_review.py tests/test_frank_a04_claude_third_review.py tests/test_frank_a04_claude_owner_review.py tests/test_frank_a04_a05_chain_capture.py tests/test_frank_a04_history_resume.py tests/test_frank_a04_history_cli.py
      - name: Full local-agent real Git regression
        working-directory: crypto-300-profit-mission/local-agent
        env:
          FRANK_EXPECT_REAL_GIT_REPLAY: '1'
        run: |
          python -B -m pytest -q -p no:cacheprovider tests
