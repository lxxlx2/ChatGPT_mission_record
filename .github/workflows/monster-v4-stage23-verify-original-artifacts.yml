name: Monster Stage23 Reverify Ten Original ZIP and Limited Capital Return
on:
  push:
    branches:
      - research/monster-v4-local-discovery-20261010
    paths:
      - 'crypto-300-profit-mission/local-agent/scripts/monster_v4_stage23_aggregate.py'
      - 'crypto-300-profit-mission/local-agent/tests/test_monster_v4_stage23_aggregate.py'
      - 'crypto-300-profit-mission/monster/evidence/monster_stage23_real10_frozen_d1_overextension_artifact_proof_20261011.json'
      - '.github/workflows/monster-v4-stage23-verify-original-artifacts.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: monster-stage23-rehash-original-artifacts-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ten-date-original-artifact-independent-recomputation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test deterministic same-second chronology and immutable evidence fail-closed
        working-directory: crypto-300-profit-mission/local-agent
        run: |
          python -B -m py_compile scripts/monster_v4_stage23_aggregate.py tests/test_monster_v4_stage23_aggregate.py
          python -B -m unittest discover -v -s tests -p test_monster_v4_stage23_aggregate.py
      - name: Fetch ten original untouched market replay ZIPs by exact Actions artifact IDs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -H 'Accept: application/vnd.github+json' repos/lxxlx2/ChatGPT_mission_record/actions/artifacts/11699674179/zip > /tmp/monster23_2025-01-23.zip
          gh api -H 'Accept: application/vnd.github+json' repos/lxxlx2/ChatGPT_mission_record/actions/artifacts/11700440106/zip > /tmp/monster23_2025-02-23.zip
          gh api -H 'Accept: application/vnd.github+json' repos/lxxlx2/ChatGPT_mission_record/actions/artifacts/11700196580/zip > /tmp/monster23_2025-03-23.zip
          gh api -H 'Accept: application/vnd.github+json' repos/lxxlx2/ChatGPT_mission_record/actions/artifacts/11699379740/zip > /tmp/monster23_2025-04-23.zip
          gh api -H 'Accept: application/vnd.github+json' repos/lxxlx2/ChatGPT_mission_record/actions/artifacts/11699479683/zip > /tmp/monster23_2025-05-23.zip
          gh api -H 'Accept: application/vnd.github+json' repos/lxxlx2/ChatGPT_mission_record/actions/artifacts/11699927392/zip > /tmp/monster23_2025-06-23.zip
          gh api -H 'Accept: application/vnd.github+json' repos/lxxlx2/ChatGPT_mission_record/actions/artifacts/11700326406/zip > /tmp/monster23_2025-07-23.zip
          gh api -H 'Accept: application/vnd.github+json' repos/lxxlx2/ChatGPT_mission_record/actions/artifacts/11700306455/zip > /tmp/monster23_2025-08-23.zip
          gh api -H 'Accept: application/vnd.github+json' repos/lxxlx2/ChatGPT_mission_record/actions/artifacts/11700385963/zip > /tmp/monster23_2025-09-23.zip
          gh api -H 'Accept: application/vnd.github+json' repos/lxxlx2/ChatGPT_mission_record/actions/artifacts/11699774296/zip > /tmp/monster23_2025-10-23.zip
      - name: Reverify every ZIP and original JSON SHA256, full 7580 outcomes and all six frozen profitability gates
        working-directory: crypto-300-profit-mission/local-agent
        run: |
          python -B scripts/monster_v4_stage23_aggregate.py --artifact-zips /tmp/monster23_2025-01-23.zip /tmp/monster23_2025-02-23.zip /tmp/monster23_2025-03-23.zip /tmp/monster23_2025-04-23.zip /tmp/monster23_2025-05-23.zip /tmp/monster23_2025-06-23.zip /tmp/monster23_2025-07-23.zip /tmp/monster23_2025-08-23.zip /tmp/monster23_2025-09-23.zip /tmp/monster23_2025-10-23.zip --output /tmp/monster_stage23_recomputed.json
      - name: Preserve independently recomputed loss attribution, missed opportunities and constrained portfolio
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: monster-stage23-all-ten-verified-zip-paired-capital-results
          path: /tmp/monster_stage23_recomputed.json
          if-no-files-found: warn
          retention-days: 30
