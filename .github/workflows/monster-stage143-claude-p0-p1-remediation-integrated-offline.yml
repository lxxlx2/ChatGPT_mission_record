name: Monster Stage143 Claude P0 P1 real-code offline integration all stages

on:
  push:
    branches:
      - research/monster-v4-local-discovery-20261010
    paths:
      - 'crypto-300-profit-mission/local-agent/scripts/monster_v4_stage134_t0_population_readiness_bridge.py'
      - 'crypto-300-profit-mission/local-agent/scripts/monster_v4_stage135_full_market_publisher_minute_coverage.py'
      - 'crypto-300-profit-mission/local-agent/scripts/monster_v4_stage136_manual_publisher_archive_acquisition.py'
      - 'crypto-300-profit-mission/local-agent/scripts/monster_v4_stage137_dynamic_t0_original_core_causal_replay.py'
      - 'crypto-300-profit-mission/local-agent/scripts/monster_v4_stage138_manual_evidence_scorecard.py'
      - 'crypto-300-profit-mission/local-agent/scripts/test_monster_v4_stage134_t0_population_readiness_bridge.py'
      - 'crypto-300-profit-mission/local-agent/scripts/test_monster_v4_stage135_full_market_publisher_minute_coverage.py'
      - 'crypto-300-profit-mission/local-agent/scripts/test_monster_v4_stage136_manual_publisher_archive_acquisition.py'
      - 'crypto-300-profit-mission/local-agent/scripts/test_monster_v4_stage137_dynamic_t0_original_core_causal_replay.py'
      - 'crypto-300-profit-mission/local-agent/scripts/test_monster_v4_stage138_manual_evidence_scorecard.py'
      - '.github/workflows/monster-stage143-claude-p0-p1-remediation-integrated-offline.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'crypto-300-profit-mission/local-agent/scripts/monster_v4_stage13*.py'
      - 'crypto-300-profit-mission/local-agent/scripts/test_monster_v4_stage13*.py'
      - '.github/workflows/monster-stage143-claude-p0-p1-remediation-integrated-offline.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-d0-d1-and-three-cohorts-full-venue-source:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile exact original-source path and execute all source, cold-start, full G3 and cross-window integration
        shell: bash
        run: |
          cd crypto-300-profit-mission/local-agent/scripts
          python -m py_compile monster_v4_stage134_t0_population_readiness_bridge.py monster_v4_stage135_full_market_publisher_minute_coverage.py monster_v4_stage136_manual_publisher_archive_acquisition.py monster_v4_stage137_dynamic_t0_original_core_causal_replay.py monster_v4_stage138_manual_evidence_scorecard.py
          python -m unittest -v test_monster_v4_stage134_t0_population_readiness_bridge.py test_monster_v4_stage135_full_market_publisher_minute_coverage.py test_monster_v4_stage136_manual_publisher_archive_acquisition.py test_monster_v4_stage137_dynamic_t0_original_core_causal_replay.py test_monster_v4_stage138_manual_evidence_scorecard.py
      - name: Refuse implicit T0 or later publisher downloads and any background schedule
        shell: bash
        run: |
          test ! -f /tmp/monster-stage143-unrequested.json
          if python crypto-300-profit-mission/local-agent/scripts/monster_v4_stage138_manual_evidence_scorecard.py --out /tmp/monster-stage143-unrequested.json; then
            echo 'STAGE143_UNAUTHORIZED_SOURCE_ACCEPTED=FAIL'
            exit 1
          fi
          test ! -f /tmp/monster-stage143-unrequested.json
          echo 'STAGE143_NO_LIVE_SOURCE_NO_AUTOMATIC_PUBLISHER_NO_SCHEDULE_NO_GMAIL_NO_TRADE_NO_FRANK=PASS'
