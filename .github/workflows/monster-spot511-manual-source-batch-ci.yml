name: Monster Spot511 Manual Publisher Batch Offline CI

on:
  push:
    branches:
      - research/monster-v4-local-discovery-20261010
    paths:
      - "crypto-300-profit-mission/local-agent/scripts/monster_spot511_manual_publisher_batch.py"
      - "crypto-300-profit-mission/local-agent/tests/test_monster_spot511_manual_publisher_batch.py"
      - "crypto-300-profit-mission/local-agent/scripts/monster_v4_spot511_closed_minute_feed.py"
      - "crypto-300-profit-mission/local-agent/tests/test_monster_v4_spot511_closed_minute_feed.py"
      - "crypto-300-profit-mission/local-agent/scripts/monster_v4_spot511_d0_d1_tape.py"
      - "crypto-300-profit-mission/local-agent/tests/test_monster_v4_spot511_d0_d1_tape.py"
      - "crypto-300-profit-mission/local-agent/scripts/monster_v4_spot511_paired_sqlite.py"
      - "crypto-300-profit-mission/local-agent/tests/test_monster_v4_spot511_paired_sqlite.py"
      - "crypto-300-profit-mission/local-agent/mission_agent/early/spot_d1_event_audit.py"
      - "crypto-300-profit-mission/local-agent/tests/test_monster_spot_d1_event_audit.py"
      - ".github/workflows/monster-spot511-manual-source-batch-ci.yml"
  pull_request:
    paths:
      - "crypto-300-profit-mission/local-agent/scripts/monster_spot511_manual_publisher_batch.py"
      - "crypto-300-profit-mission/local-agent/tests/test_monster_spot511_manual_publisher_batch.py"
      - "crypto-300-profit-mission/local-agent/scripts/monster_v4_spot511_closed_minute_feed.py"
      - "crypto-300-profit-mission/local-agent/tests/test_monster_v4_spot511_closed_minute_feed.py"
      - "crypto-300-profit-mission/local-agent/scripts/monster_v4_spot511_d0_d1_tape.py"
      - "crypto-300-profit-mission/local-agent/tests/test_monster_v4_spot511_d0_d1_tape.py"
      - "crypto-300-profit-mission/local-agent/scripts/monster_v4_spot511_paired_sqlite.py"
      - "crypto-300-profit-mission/local-agent/tests/test_monster_v4_spot511_paired_sqlite.py"
      - "crypto-300-profit-mission/local-agent/mission_agent/early/spot_d1_event_audit.py"
      - "crypto-300-profit-mission/local-agent/tests/test_monster_spot_d1_event_audit.py"
      - ".github/workflows/monster-spot511-manual-source-batch-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-batch-offline-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout research-only code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Syntax check
        run: |
          python -B -m py_compile crypto-300-profit-mission/local-agent/scripts/monster_spot511_manual_publisher_batch.py
          python -B -m py_compile crypto-300-profit-mission/local-agent/tests/test_monster_spot511_manual_publisher_batch.py
          python -B -m py_compile crypto-300-profit-mission/local-agent/scripts/monster_v4_spot511_closed_minute_feed.py
          python -B -m py_compile crypto-300-profit-mission/local-agent/tests/test_monster_v4_spot511_closed_minute_feed.py
          python -B -m py_compile crypto-300-profit-mission/local-agent/scripts/monster_v4_spot511_d0_d1_tape.py
          python -B -m py_compile crypto-300-profit-mission/local-agent/tests/test_monster_v4_spot511_d0_d1_tape.py
          python -B -m py_compile crypto-300-profit-mission/local-agent/scripts/monster_v4_spot511_paired_sqlite.py
          python -B -m py_compile crypto-300-profit-mission/local-agent/tests/test_monster_v4_spot511_paired_sqlite.py
          python -B -m py_compile crypto-300-profit-mission/local-agent/mission_agent/early/spot_d1_event_audit.py
          python -B -m py_compile crypto-300-profit-mission/local-agent/tests/test_monster_spot_d1_event_audit.py
      - name: Synthetic official-format publisher intake tests (no HTTP)
        env:
          PYTHONPATH: crypto-300-profit-mission/local-agent:crypto-300-profit-mission/local-agent/scripts
        run: |
          python -B -m unittest discover -s crypto-300-profit-mission/local-agent/tests -p "test_monster_spot511_manual_publisher_batch.py" -v
          python -B -m unittest discover -s crypto-300-profit-mission/local-agent/tests -p "test_monster_v4_spot511_closed_minute_feed.py" -v
          python -B -m unittest discover -s crypto-300-profit-mission/local-agent/tests -p "test_monster_v4_spot511_d0_d1_tape.py" -v
          python -B -m unittest discover -s crypto-300-profit-mission/local-agent/tests -p "test_monster_v4_spot511_paired_sqlite.py" -v
          python -B -m unittest discover -s crypto-300-profit-mission/local-agent/tests -p "test_monster_spot_d1_event_audit.py" -v

  one-shot-4088-fullglobal-sqlite-fifo-fair-replay:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/research/monster-v4-local-discovery-20261010' && contains(github.event.head_commit.message, '[MONSTER_ONESHOT_REPLAY_4088]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout fixed Monster original-core and immutable research ledger
        uses: actions/checkout@v4
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Restore verified publisher symbol days Oct16–21 (3066)
        uses: actions/download-artifact@v4
        with:
          run-id: 40027484781
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pattern: monster-spot511-2026-10-*-slice-*-40027484781
          merge-multiple: true
          path: ${{ runner.temp }}/monster-source
      - name: Restore Oct22 original publisher 0–63
        uses: actions/download-artifact@v4
        with:
          run-id: 40006012284
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pattern: monster-spot511-20261022-first64-original-publisher-*
          merge-multiple: true
          path: ${{ runner.temp }}/monster-source
      - name: Restore Oct22 original publisher 64–510
        uses: actions/download-artifact@v4
        with:
          run-id: 40007027318
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pattern: monster-spot511-20261022-original-slice-*
          merge-multiple: true
          path: ${{ runner.temp }}/monster-source
      - name: Restore independently verified Oct23 original publisher (511)
        uses: actions/download-artifact@v4
        with:
          run-id: 40086780992
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pattern: monster-spot511-2026-10-23-slice-*-40086780992
          merge-multiple: true
          path: ${{ runner.temp }}/monster-source
      - name: Restore prior independently matched 3577 original-core event baseline
        uses: actions/download-artifact@v4
        with:
          run-id: 40083267351
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pattern: monster-spot511-3577-originalcore-ledger-check-40083267351
          merge-multiple: true
          path: ${{ runner.temp }}/monster-baseline
      - name: Re-execute fixed original-core global D0/D1 with 4088 admitted source days
        env:
          PYTHONPATH: crypto-300-profit-mission/local-agent:crypto-300-profit-mission/local-agent/scripts
        shell: bash
        run: |
          set -euo pipefail
          export SOURCE="$RUNNER_TEMP/monster-source/source"
          export OUTPUT="$RUNNER_TEMP/monster-4088-original-global"
          mkdir -p "$OUTPUT"
          python - <<'PY'
          import os
          from pathlib import Path
          root=Path(os.environ['SOURCE'])
          pairs=list(root.glob('*/1m/*.zip'))
          sums=list(root.glob('*/1m/*.zip.CHECKSUM'))
          if len(pairs)!=4088 or len(sums)!=4088:
              raise SystemExit(f'MONSTER_4088_FROZEN_PUBLISHER_CENSUS_FAILURE:{len(pairs)}/{len(sums)}')
          s22=sum('2026-10-22.zip' in x.name for x in pairs)
          s23=sum('2026-10-23.zip' in x.name for x in pairs)
          if (s22,s23)!=(511,511):raise SystemExit('MONSTER_CENSUS_DATE_DRIFT')
          print('MONSTER_ADMITTED_PUBLISHER_INPUT_4088_SOURCE_CANDIDATES',len(pairs),s22,s23)
          PY
          python -B crypto-300-profit-mission/local-agent/scripts/monster_v4_spot511_paired_sqlite.py \
            --source-dir "$SOURCE" --index "$OUTPUT/source-index.sqlite" \
            --output "$OUTPUT/paired-4088.json" --asof "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          python - <<'PY'
          import json,os,hashlib
          from pathlib import Path
          root=Path(os.environ['OUTPUT'])
          oldfile=Path(os.environ['RUNNER_TEMP'])/'monster-baseline'/'paired-new.json'
          old=json.loads(oldfile.read_text())
          new=json.loads((root/'paired-4088.json').read_text())
          if (new['frozen_roster']!=511 or new['ticks']!=3360
              or new['verified_full_publisher_symbol_days']!=4088
              or new['required_full_publisher_symbol_days']!=4599
              or new['all_511_historical_sources_verified'] or
              new['G0']!='PARTIAL' or new['G1']!='NOT_SCORABLE' or new['G6']!='NO_GO'
              or new['first_seen_listing_pit_proven'] or
              new['publisher_original_tick_available_at_proven']):
              raise SystemExit('MONSTER_4088_GATE_OR_SOURCE_CENSUS_INVALID')
          if new['full_d0_ticks']<=old['full_d0_ticks'] or new['censored_d0_ticks']>=old['censored_d0_ticks']:
              raise SystemExit('MONSTER_4088_SOURCE_COVERAGE_NOT_INCREASED')
          if not new['same_d0_watch_id_and_time'] or new['fifo_watch_events']!=new['fair8_watch_events']:
              raise SystemExit('MONSTER_FIFO_FAIR_D0_ID_PAYLOAD_DRIFT')
          for k in ('fifo_watch_events','fair8_watch_events','fifo_setup_events','fair8_setup_events'):
              oldrows={(v['event_id'],v['symbol'],v['observed_ms']) for v in old[k]}
              newrows={(v['event_id'],v['symbol'],v['observed_ms']) for v in new[k]}
              missing=oldrows-newrows
              if missing:raise SystemExit('MONSTER_OLD_IMMUTABLE_EVENT_DISAPPEARED:'+k+':'+str(len(missing)))
          raw=(root/'paired-4088.json').read_bytes()
          info={'status':'4088_PUBLISHER_SYMBOL_DAYS_VALID_ORIGINAL_GLOBAL_D0_D1_REPLAY',
            'source_utc_days':'2026-10-16 through 2026-10-23',
            'original_3577_report_sha256':hashlib.sha256(oldfile.read_bytes()).hexdigest(),
            'new_4088_report_sha256':hashlib.sha256(raw).hexdigest(),
            'verified_full_publisher_symbol_days':new['verified_full_publisher_symbol_days'],
            'required_full_publisher_symbol_days':4599,
            'full_d0_ticks':new['full_d0_ticks'],
            'censored_d0_ticks':new['censored_d0_ticks'],
            'old_watch':old['d0_watch_count'],'new_watch':new['d0_watch_count'],
            'old_fifo_setup':old['fifo_setups'],'new_fifo_setup':new['fifo_setups'],
            'old_fair8_setup':old['fair8_setups'],'new_fair8_setup':new['fair8_setups'],
            'fair8_only_new_setup_ids':new['new_setup_ids'],
            'fair8_lost_setup_ids':new['lost_setup_ids'],
            'fifo_fair8_shared_setup_time_changed':new['shared_setup_time_changed_ids'],
            'original_3577_event_ids_retained':True,
            'publisher_later_archive_not_historical_rest_receipt':True,
            'historical_asset_type_pit':'NOT_PROVEN',
            'executable_bid_ask_fee_net_pnl':'UNKNOWN',
            'G0':'PARTIAL','G1':'NOT_SCORABLE','G4':'UNKNOWN','G6':'NO_GO',
            'NO_MERGE':True,'NO_DEPLOY':True,'NO_GMAIL':True,'NO_TRADES':True,'NO_AUTOMATIONS':True}
          (root/'summary.json').write_text(json.dumps(info,sort_keys=True,indent=2)+'\n')
          print('MONSTER_4088_PUBLISHER_ORIGINAL_GLOBAL_REPLAY',json.dumps(info,sort_keys=True))
          PY
      - name: Archive fixed-source global replay report and gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monster-spot511-4088-original-global-replay-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/monster-4088-original-global/paired-4088.json
            ${{ runner.temp }}/monster-4088-original-global/summary.json
          retention-days: 30
          if-no-files-found: warn
