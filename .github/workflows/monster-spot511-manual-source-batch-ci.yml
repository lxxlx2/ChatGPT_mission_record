name: Monster Spot511 Manual Publisher Batch Offline CI

on:
  push:
    branches:
      - research/monster-v4-local-discovery-20261010
    paths:
      - "crypto-300-profit-mission/local-agent/scripts/monster_spot511_manual_publisher_batch.py"
      - "crypto-300-profit-mission/local-agent/tests/test_monster_spot511_manual_publisher_batch.py"
      - "crypto-300-profit-mission/local-agent/scripts/monster_v4_spot511_closed_minute_feed.py"
      - "crypto-300-profit-mission/local-agent/tests/test_monster_v4_spot511_closed_minute_feed.py"
      - "crypto-300-profit-mission/local-agent/scripts/monster_v4_spot511_d0_d1_tape.py"
      - "crypto-300-profit-mission/local-agent/tests/test_monster_v4_spot511_d0_d1_tape.py"
      - "crypto-300-profit-mission/local-agent/scripts/monster_v4_spot511_paired_sqlite.py"
      - "crypto-300-profit-mission/local-agent/tests/test_monster_v4_spot511_paired_sqlite.py"
      - "crypto-300-profit-mission/local-agent/mission_agent/early/spot_d1_event_audit.py"
      - "crypto-300-profit-mission/local-agent/tests/test_monster_spot_d1_event_audit.py"
      - ".github/workflows/monster-spot511-manual-source-batch-ci.yml"
  pull_request:
    paths:
      - "crypto-300-profit-mission/local-agent/scripts/monster_spot511_manual_publisher_batch.py"
      - "crypto-300-profit-mission/local-agent/tests/test_monster_spot511_manual_publisher_batch.py"
      - "crypto-300-profit-mission/local-agent/scripts/monster_v4_spot511_closed_minute_feed.py"
      - "crypto-300-profit-mission/local-agent/tests/test_monster_v4_spot511_closed_minute_feed.py"
      - "crypto-300-profit-mission/local-agent/scripts/monster_v4_spot511_d0_d1_tape.py"
      - "crypto-300-profit-mission/local-agent/tests/test_monster_v4_spot511_d0_d1_tape.py"
      - "crypto-300-profit-mission/local-agent/scripts/monster_v4_spot511_paired_sqlite.py"
      - "crypto-300-profit-mission/local-agent/tests/test_monster_v4_spot511_paired_sqlite.py"
      - "crypto-300-profit-mission/local-agent/mission_agent/early/spot_d1_event_audit.py"
      - "crypto-300-profit-mission/local-agent/tests/test_monster_spot_d1_event_audit.py"
      - ".github/workflows/monster-spot511-manual-source-batch-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-batch-offline-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout research-only code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Syntax check
        run: |
          python -B -m py_compile crypto-300-profit-mission/local-agent/scripts/monster_spot511_manual_publisher_batch.py
          python -B -m py_compile crypto-300-profit-mission/local-agent/tests/test_monster_spot511_manual_publisher_batch.py
          python -B -m py_compile crypto-300-profit-mission/local-agent/scripts/monster_v4_spot511_closed_minute_feed.py
          python -B -m py_compile crypto-300-profit-mission/local-agent/tests/test_monster_v4_spot511_closed_minute_feed.py
          python -B -m py_compile crypto-300-profit-mission/local-agent/scripts/monster_v4_spot511_d0_d1_tape.py
          python -B -m py_compile crypto-300-profit-mission/local-agent/tests/test_monster_v4_spot511_d0_d1_tape.py
          python -B -m py_compile crypto-300-profit-mission/local-agent/scripts/monster_v4_spot511_paired_sqlite.py
          python -B -m py_compile crypto-300-profit-mission/local-agent/tests/test_monster_v4_spot511_paired_sqlite.py
          python -B -m py_compile crypto-300-profit-mission/local-agent/mission_agent/early/spot_d1_event_audit.py
          python -B -m py_compile crypto-300-profit-mission/local-agent/tests/test_monster_spot_d1_event_audit.py
      - name: Synthetic official-format publisher intake tests (no HTTP)
        env:
          PYTHONPATH: crypto-300-profit-mission/local-agent:crypto-300-profit-mission/local-agent/scripts
        run: |
          python -B -m unittest discover -s crypto-300-profit-mission/local-agent/tests -p "test_monster_spot511_manual_publisher_batch.py" -v
          python -B -m unittest discover -s crypto-300-profit-mission/local-agent/tests -p "test_monster_v4_spot511_closed_minute_feed.py" -v
          python -B -m unittest discover -s crypto-300-profit-mission/local-agent/tests -p "test_monster_v4_spot511_d0_d1_tape.py" -v
          python -B -m unittest discover -s crypto-300-profit-mission/local-agent/tests -p "test_monster_v4_spot511_paired_sqlite.py" -v
          python -B -m unittest discover -s crypto-300-profit-mission/local-agent/tests -p "test_monster_spot_d1_event_audit.py" -v

  one-shot-3577-exact-event-ledger:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/research/monster-v4-local-discovery-20261010' && contains(github.event.head_commit.message, '[MONSTER_ONESHOT_VERIFY_EVENT_LEDGER_3577]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout exact pinned Monster research code
        uses: actions/checkout@v4
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Restore exactly 3066 original publisher ZIPs for Oct16–21
        uses: actions/download-artifact@v4
        with:
          run-id: 40027484781
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pattern: monster-spot511-2026-10-*-slice-*-40027484781
          merge-multiple: true
          path: ${{ runner.temp }}/monster-source
      - name: Restore first 64 original Oct22 ZIPs
        uses: actions/download-artifact@v4
        with:
          run-id: 40006012284
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pattern: monster-spot511-20261022-first64-original-publisher-*
          merge-multiple: true
          path: ${{ runner.temp }}/monster-source
      - name: Restore remaining 447 original Oct22 ZIPs
        uses: actions/download-artifact@v4
        with:
          run-id: 40007027318
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pattern: monster-spot511-20261022-original-slice-*
          merge-multiple: true
          path: ${{ runner.temp }}/monster-source
      - name: Restore original 3577 immutable replay evidence
        uses: actions/download-artifact@v4
        with:
          run-id: 40028725264
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pattern: monster-spot511-official7dates-partial-fifo8-fair8-40028725264
          path: ${{ runner.temp }}/monster-original
      - name: Replay exactly original source with new original-SQLite event export and strict independent matching
        shell: bash
        env:
          PYTHONPATH: crypto-300-profit-mission/local-agent:crypto-300-profit-mission/local-agent/scripts
        run: |
          set -euo pipefail
          export SOURCE_ROOT="$RUNNER_TEMP/monster-source/source"
          export RESULT_ROOT="$RUNNER_TEMP/monster-ledger-verify"
          mkdir -p "$RESULT_ROOT"
          python - <<'PY'
          from pathlib import Path
          import os
          files=list(Path(os.environ['SOURCE_ROOT']).glob('*/1m/*.zip'))
          sums=list(Path(os.environ['SOURCE_ROOT']).glob('*/1m/*.zip.CHECKSUM'))
          if len(files)!=3577 or len(sums)!=3577:
              raise SystemExit(f'MONSTER_FROZEN_SOURCE_CENSUS_DRIFT:{len(files)}/{len(sums)}')
          print('MONSTER_FROZEN_SOURCE_CENSUS_PASS',len(files),len(sums))
          PY
          python -B crypto-300-profit-mission/local-agent/scripts/monster_v4_spot511_paired_sqlite.py --source-dir "$SOURCE_ROOT" --index "$RESULT_ROOT/source.sqlite" --output "$RESULT_ROOT/paired-new.json" --asof "2026-10-23T21:39:27Z"
          python -B -m mission_agent.early.spot_d1_event_audit --original-replay-json "$RESULT_ROOT/paired-new.json" --independent-json crypto-300-profit-mission/monster/evidence/MONSTER_SPOT511_46WATCH_42SETUP_ACTUAL_PUBLISHER_INDEPENDENT_D1_20261024.json --require-equal-lanes > "$RESULT_ROOT/id-match.json"
          python - <<'PY'
          import os,json,hashlib
          from pathlib import Path
          result=Path(os.environ['RESULT_ROOT'])
          old=json.loads((Path(os.environ['RUNNER_TEMP'])/'monster-original'/'paired-partial.json').read_text())
          new=json.loads((result/'paired-new.json').read_text())
          report=json.loads((result/'id-match.json').read_text())
          keys=['frozen_roster','ticks','source_ready_symbol_ticks','source_censored_symbol_ticks',
                'full_d0_ticks','censored_d0_ticks','d0_watch_count','d0_watch_3m_baseline_audit',
                'fifo_setups','fair8_setups','fifo_queue_status','fair8_queue_status',
                'fifo_first_service','fair8_first_service','fifo_episodes','fair8_episodes',
                'new_setup_ids','lost_setup_ids','shared_setup_time_changed_ids',
                'verified_full_publisher_symbol_days','required_full_publisher_symbol_days',
                'G0','G1','G4','G6']
          diffs=[k for k in keys if old.get(k)!=new.get(k)]
          if diffs: raise SystemExit('MONSTER_ORIGINAL_REPLAY_OUTPUT_DRIFT:'+','.join(diffs))
          if (len(new.get('fifo_watch_events',[]))!=46 or len(new.get('fair8_watch_events',[]))!=46
              or len(new.get('fifo_setup_events',[]))!=42 or len(new.get('fair8_setup_events',[]))!=42
              or not report.get('original_core_fifo_setup_export_ids_and_times_matched')
              or report.get('recomputed_setup_count')!=42
              or report.get('G6')!='NO_GO'):
              raise SystemExit('MONSTER_EVENT_LEDGER_NOT_EXACT')
          oldbytes=(Path(os.environ['RUNNER_TEMP'])/'monster-original'/'paired-partial.json').read_bytes()
          oldsha=hashlib.sha256(oldbytes).hexdigest()
          if oldsha!='d3aef422dfc6be7c5b04b7935ef6b8b4c456293ee47bfb4ede7f8084f552a18a':
              raise SystemExit('MONSTER_PRIOR_REPORT_SHA_DRIFT')
          hashes={name:hashlib.sha256((result/name).read_bytes()).hexdigest() for name in ('paired-new.json','id-match.json')}
          out={'status':'SOURCE_REPLAY_3577_AND_EXACT_ORIGINAL_SQLITE_SETUP_ID_MATCH',
               'old_report_sha256':oldsha,'new_report_sha256':hashes['paired-new.json'],
               'id_match_report_sha256':hashes['id-match.json'],'immutable_baseline_fields_equal':keys,
               'full_source_symbol_days':3577,'source_censored_3m_ticks':921,
               'watch':46,'setup':42,'research_only':True,'original_PIT':'UNPROVEN',
               'original_L2_executable_net_PnL':'UNKNOWN','G6':'NO_GO',
               'no_trade_mail_or_deploy':True}
          (result/'summary.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print('MONSTER_3577_ORIGINAL_CORE_EXACT_EVENT_LEDGER_MATCH',json.dumps(out,sort_keys=True))
          PY
      - name: Archive only research JSON, never raw publisher ZIP or private data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monster-spot511-3577-originalcore-ledger-check-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/monster-ledger-verify/paired-new.json
            ${{ runner.temp }}/monster-ledger-verify/id-match.json
            ${{ runner.temp }}/monster-ledger-verify/summary.json
          retention-days: 30
          if-no-files-found: warn
