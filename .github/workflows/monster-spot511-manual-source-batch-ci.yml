name: Monster Spot511 Manual Publisher Batch Offline CI

on:
  push:
    branches:
      - research/monster-v4-local-discovery-20261010
    paths:
      - "crypto-300-profit-mission/local-agent/scripts/monster_spot511_manual_publisher_batch.py"
      - "crypto-300-profit-mission/local-agent/tests/test_monster_spot511_manual_publisher_batch.py"
      - "crypto-300-profit-mission/local-agent/scripts/monster_v4_spot511_closed_minute_feed.py"
      - "crypto-300-profit-mission/local-agent/tests/test_monster_v4_spot511_closed_minute_feed.py"
      - "crypto-300-profit-mission/local-agent/scripts/monster_v4_spot511_d0_d1_tape.py"
      - "crypto-300-profit-mission/local-agent/tests/test_monster_v4_spot511_d0_d1_tape.py"
      - "crypto-300-profit-mission/local-agent/scripts/monster_v4_spot511_paired_sqlite.py"
      - "crypto-300-profit-mission/local-agent/tests/test_monster_v4_spot511_paired_sqlite.py"
      - ".github/workflows/monster-spot511-manual-source-batch-ci.yml"
  pull_request:
    paths:
      - "crypto-300-profit-mission/local-agent/scripts/monster_spot511_manual_publisher_batch.py"
      - "crypto-300-profit-mission/local-agent/tests/test_monster_spot511_manual_publisher_batch.py"
      - "crypto-300-profit-mission/local-agent/scripts/monster_v4_spot511_closed_minute_feed.py"
      - "crypto-300-profit-mission/local-agent/tests/test_monster_v4_spot511_closed_minute_feed.py"
      - "crypto-300-profit-mission/local-agent/scripts/monster_v4_spot511_d0_d1_tape.py"
      - "crypto-300-profit-mission/local-agent/tests/test_monster_v4_spot511_d0_d1_tape.py"
      - "crypto-300-profit-mission/local-agent/scripts/monster_v4_spot511_paired_sqlite.py"
      - "crypto-300-profit-mission/local-agent/tests/test_monster_v4_spot511_paired_sqlite.py"
      - ".github/workflows/monster-spot511-manual-source-batch-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-batch-offline-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout research-only code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Syntax check
        run: |
          python -B -m py_compile crypto-300-profit-mission/local-agent/scripts/monster_spot511_manual_publisher_batch.py
          python -B -m py_compile crypto-300-profit-mission/local-agent/tests/test_monster_spot511_manual_publisher_batch.py
          python -B -m py_compile crypto-300-profit-mission/local-agent/scripts/monster_v4_spot511_closed_minute_feed.py
          python -B -m py_compile crypto-300-profit-mission/local-agent/tests/test_monster_v4_spot511_closed_minute_feed.py
          python -B -m py_compile crypto-300-profit-mission/local-agent/scripts/monster_v4_spot511_d0_d1_tape.py
          python -B -m py_compile crypto-300-profit-mission/local-agent/tests/test_monster_v4_spot511_d0_d1_tape.py
          python -B -m py_compile crypto-300-profit-mission/local-agent/scripts/monster_v4_spot511_paired_sqlite.py
          python -B -m py_compile crypto-300-profit-mission/local-agent/tests/test_monster_v4_spot511_paired_sqlite.py
      - name: Synthetic official-format publisher intake tests (no HTTP)
        env:
          PYTHONPATH: crypto-300-profit-mission/local-agent/scripts
        run: |
          python -B -m unittest discover -s crypto-300-profit-mission/local-agent/tests -p "test_monster_spot511_manual_publisher_batch.py" -v
          python -B -m unittest discover -s crypto-300-profit-mission/local-agent/tests -p "test_monster_v4_spot511_closed_minute_feed.py" -v
          python -B -m unittest discover -s crypto-300-profit-mission/local-agent/tests -p "test_monster_v4_spot511_d0_d1_tape.py" -v
          python -B -m unittest discover -s crypto-300-profit-mission/local-agent/tests -p "test_monster_v4_spot511_paired_sqlite.py" -v

  one-shot-spot511-first64-official-20261022:
    if: \${{ github.event_name == 'push' && github.ref == 'refs/heads/research/monster-v4-local-discovery-20261010' && contains(github.event.head_commit.message, '[MONSTER_ONESHOT_SPOT511_20261022_SLICE0_64]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout fixed Monster code
        uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Capture and validate exactly 64 original T0 symbols for one past UTC day
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/monster-spot511-first64"
          python -B crypto-300-profit-mission/local-agent/scripts/monster_spot511_manual_publisher_batch.py --day 2026-10-22 --start-index 0 --count 64 --dest "$RUNNER_TEMP/monster-spot511-first64/source" --out "$RUNNER_TEMP/monster-spot511-first64/attempts.json" --download
          python - <<'PY'
          import collections
          import json
          import os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"]) / "monster-spot511-first64"
          m = json.loads((root / "attempts.json").read_text())
          rows = m["source_records"]
          if (m["execution"] != "MANUAL_DOWNLOAD" or m["frozen_total"] != 511
                  or m["day_utc"] != "2026-10-22" or m["start_index"] != 0
                  or m["batch_size"] != 64 or len(rows) != 64
                  or m["actual_d0_d1_replay"] is not False
                  or m["G6"] != "NO_GO"
                  or len({r["symbol"] for r in rows}) != 64):
              raise SystemExit("MONSTER_FIRST64_CENSUS_OR_AUTHORIZATION_DRIFT")
          counts = collections.Counter(row["status"] for row in rows)
          verified = counts["VERIFIED_FULL_DAY_1440"]
          if verified != m["verified_downloads"]:
              raise SystemExit("MONSTER_FIRST64_VERIFIED_COUNT_MISMATCH")
          for row in rows:
              if row["status"] == "VERIFIED_FULL_DAY_1440":
                  if (row["closed_one_minute_rows"] != 1440
                          or len(row["zip_sha256"]) != 64):
                      raise SystemExit("MONSTER_FIRST64_UNBACKED_SOURCE")
          summary = {
              "schema": "MONSTER_SPOT511_FIRST64_PUBLISHER_20261022_ACTUAL_V1",
              "venue": "Binance Spot",
              "frozen_original_T0_symbols": 511,
              "date_utc": "2026-10-22",
              "slice_start": 0,
              "attempted_symbol_days": 64,
              "verified_symbol_days": verified,
              "status_counts": dict(sorted(counts.items())),
              "source_zip_and_official_checksum_in_artifact": True,
              "original_day_zip_sha256_per_symbol_in_attempts_json": True,
              "remaining_original_4599_symbol_days_not_verified_by_this_run": 4599 - verified,
              "d0_d1_full_511_replay": "NOT_DONE",
              "historical_live_available_at": "UNPROVEN",
              "G0": "PARTIAL", "G4": "UNKNOWN", "G6": "NO_GO",
              "NO_MAC": True, "NO_SCHEDULE": True, "NO_PAID": True, "NO_TRADES": True,
          }
          (root / "summary.json").write_text(json.dumps(summary, indent=2, sort_keys=True) + "\n")
          print("MONSTER_SPOT511_FIRST64_ACTUAL_SOURCE_SUMMARY", json.dumps(summary, sort_keys=True))
          if not verified:
              raise SystemExit("MONSTER_FIRST64_ZERO_VERIFIED_STOP_EXPANSION")
          PY
      - name: Keep all verified original ZIPs checksums and manifest in one auditable artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monster-spot511-20261022-first64-original-publisher-\${{ github.run_id }}
          path: \${{ runner.temp }}/monster-spot511-first64/
          retention-days: 30
          if-no-files-found: warn
