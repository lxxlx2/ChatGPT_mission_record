name: Monster Spot511 Manual Publisher Batch Offline CI

on:
  push:
    branches:
      - research/monster-v4-local-discovery-20261010
    paths:
      - "crypto-300-profit-mission/local-agent/scripts/monster_spot511_manual_publisher_batch.py"
      - "crypto-300-profit-mission/local-agent/tests/test_monster_spot511_manual_publisher_batch.py"
      - "crypto-300-profit-mission/local-agent/scripts/monster_v4_spot511_closed_minute_feed.py"
      - "crypto-300-profit-mission/local-agent/tests/test_monster_v4_spot511_closed_minute_feed.py"
      - "crypto-300-profit-mission/local-agent/scripts/monster_v4_spot511_d0_d1_tape.py"
      - "crypto-300-profit-mission/local-agent/tests/test_monster_v4_spot511_d0_d1_tape.py"
      - "crypto-300-profit-mission/local-agent/scripts/monster_v4_spot511_paired_sqlite.py"
      - "crypto-300-profit-mission/local-agent/tests/test_monster_v4_spot511_paired_sqlite.py"
      - ".github/workflows/monster-spot511-manual-source-batch-ci.yml"
  pull_request:
    paths:
      - "crypto-300-profit-mission/local-agent/scripts/monster_spot511_manual_publisher_batch.py"
      - "crypto-300-profit-mission/local-agent/tests/test_monster_spot511_manual_publisher_batch.py"
      - "crypto-300-profit-mission/local-agent/scripts/monster_v4_spot511_closed_minute_feed.py"
      - "crypto-300-profit-mission/local-agent/tests/test_monster_v4_spot511_closed_minute_feed.py"
      - "crypto-300-profit-mission/local-agent/scripts/monster_v4_spot511_d0_d1_tape.py"
      - "crypto-300-profit-mission/local-agent/tests/test_monster_v4_spot511_d0_d1_tape.py"
      - "crypto-300-profit-mission/local-agent/scripts/monster_v4_spot511_paired_sqlite.py"
      - "crypto-300-profit-mission/local-agent/tests/test_monster_v4_spot511_paired_sqlite.py"
      - ".github/workflows/monster-spot511-manual-source-batch-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-batch-offline-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout research-only code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Syntax check
        run: |
          python -B -m py_compile crypto-300-profit-mission/local-agent/scripts/monster_spot511_manual_publisher_batch.py
          python -B -m py_compile crypto-300-profit-mission/local-agent/tests/test_monster_spot511_manual_publisher_batch.py
          python -B -m py_compile crypto-300-profit-mission/local-agent/scripts/monster_v4_spot511_closed_minute_feed.py
          python -B -m py_compile crypto-300-profit-mission/local-agent/tests/test_monster_v4_spot511_closed_minute_feed.py
          python -B -m py_compile crypto-300-profit-mission/local-agent/scripts/monster_v4_spot511_d0_d1_tape.py
          python -B -m py_compile crypto-300-profit-mission/local-agent/tests/test_monster_v4_spot511_d0_d1_tape.py
          python -B -m py_compile crypto-300-profit-mission/local-agent/scripts/monster_v4_spot511_paired_sqlite.py
          python -B -m py_compile crypto-300-profit-mission/local-agent/tests/test_monster_v4_spot511_paired_sqlite.py
      - name: Synthetic official-format publisher intake tests (no HTTP)
        env:
          PYTHONPATH: crypto-300-profit-mission/local-agent/scripts
        run: |
          python -B -m unittest discover -s crypto-300-profit-mission/local-agent/tests -p "test_monster_spot511_manual_publisher_batch.py" -v
          python -B -m unittest discover -s crypto-300-profit-mission/local-agent/tests -p "test_monster_v4_spot511_closed_minute_feed.py" -v
          python -B -m unittest discover -s crypto-300-profit-mission/local-agent/tests -p "test_monster_v4_spot511_d0_d1_tape.py" -v
          python -B -m unittest discover -s crypto-300-profit-mission/local-agent/tests -p "test_monster_v4_spot511_paired_sqlite.py" -v

  one-shot-partial-7days-paired-source-replay:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/research/monster-v4-local-discovery-20261010' && contains(github.event.head_commit.message, '[MONSTER_ONESHOT_REAL_SOURCE_PARTIAL_REPLAY]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout fixed Spot original-core research code
        uses: actions/checkout@v4
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Load exactly six previously verified UTC days (48 official archive batches)
        uses: actions/download-artifact@v4
        with:
          run-id: 40027484781
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pattern: monster-spot511-2026-10-*-slice-*-40027484781
          merge-multiple: true
          path: ${{ runner.temp }}/monster-seven-source
      - name: Load 2026-10-22 frozen 0-63 original source
        uses: actions/download-artifact@v4
        with:
          run-id: 40006012284
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pattern: monster-spot511-20261022-first64-original-publisher-*
          merge-multiple: true
          path: ${{ runner.temp }}/monster-seven-source
      - name: Load 2026-10-22 frozen 64-510 original source
        uses: actions/download-artifact@v4
        with:
          run-id: 40007027318
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pattern: monster-spot511-20261022-original-slice-*
          merge-multiple: true
          path: ${{ runner.temp }}/monster-seven-source
      - name: Verify 3577 source identities and run original D0 FIFO8 versus Fair8 partial same-source replay
        shell: bash
        run: |
          set -euo pipefail
          export SOURCE_ROOT="$RUNNER_TEMP/monster-seven-source/source"
          export REPORT_DIR="$RUNNER_TEMP/monster-partial-replay"
          mkdir -p "$REPORT_DIR"
          python - <<'PY'
          import os
          from pathlib import Path
          src=Path(os.environ['SOURCE_ROOT'])
          zipfiles=list(src.glob('*/1m/*.zip'))
          checksum=list(src.glob('*/1m/*.zip.CHECKSUM'))
          if len(zipfiles)!=3577 or len(checksum)!=3577:
              raise SystemExit(f"MONSTER_SOURCE_NOT_ALL_SEVEN_DAYS:{len(zipfiles)}/{len(checksum)}")
          print("MONSTER_SOURCE_7DATES_UNIQUE_FILES",len(zipfiles),len(checksum))
          PY
          python -B crypto-300-profit-mission/local-agent/scripts/monster_v4_spot511_paired_sqlite.py --source-dir "$SOURCE_ROOT" --index "$REPORT_DIR/source-index.sqlite" --output "$REPORT_DIR/paired-partial.json" --asof "2026-10-23T21:39:27Z"
          python - <<'PY'
          import os,json,hashlib
          from pathlib import Path
          target=Path(os.environ['REPORT_DIR'])
          report=json.loads((target/'paired-partial.json').read_text())
          if (report['schema']!='MONSTER_SPOT511_GLOBAL_SQLITE_FIFO_FAIR8_RESEARCH_V1'
                  or report['frozen_roster']!=511 or report['ticks']!=3360
                  or not report['same_d0_watch_id_and_time']
                  or report['required_full_publisher_symbol_days']!=4599
                  or report['verified_full_publisher_symbol_days']!=3577
                  or report['all_511_historical_sources_verified']
                  or report['G6']!='NO_GO'
                  or report['G1']!='NOT_SCORABLE'):
              raise SystemExit('MONSTER_REPLAY_SCOPE_OR_SOURCE_DRIFT')
          data=(target/'paired-partial.json').read_bytes()
          fields=['frozen_roster','ticks','source_ready_symbol_ticks','source_censored_symbol_ticks',
                  'full_d0_ticks','censored_d0_ticks','d0_watch_count','fifo_setups','fair8_setups',
                  'new_setup_ids','lost_setup_ids','fifo_first_service','fair8_first_service',
                  'verified_full_publisher_symbol_days','required_full_publisher_symbol_days','G0','G4','G6']
          s={x:report[x] for x in fields}
          s.update({'report_sha256':hashlib.sha256(data).hexdigest(),
                    'strict_full_7day_acceptance':'NOT_DONE',
                    'source_dates':'2026-10-16 through 2026-10-22 UTC only',
                    'other_two_days':'2026-10-23 and 2026-10-24 NOT_AVAILABLE_AT_ASOF',
                    'historical_real_ticker_original_available_at':'UNPROVEN',
                    'original_D0_frozen_rules_unchanged':True,
                    'research_not_live_deployment':True})
          (target/'summary.json').write_text(json.dumps(s,sort_keys=True,indent=2)+'\n')
          print("MONSTER_PARTIAL_REAL_PUBLISHER_SAME_SOURCE_FIFO8_FAIR8",json.dumps(s,sort_keys=True))
          PY
      - name: Save partial research result without altering original repository or services
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monster-spot511-official7dates-partial-fifo8-fair8-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/monster-partial-replay/paired-partial.json
            ${{ runner.temp }}/monster-partial-replay/summary.json
          retention-days: 30
          if-no-files-found: error
