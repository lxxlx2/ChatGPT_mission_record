name: Frank 18 Mint DefiLlama Historical Batch One Shot
on:
  push:
    branches: [review/meme-ca-v3-integrate-main-20261008]
    paths: ['.github/workflows/frank-defillama-18-mint-one-shot.yml']
permissions:
  contents: read
jobs:
  no-key-frozen-history:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: One bounded price batch from public DefiLlama
        run: |
          python3 - <<'PY'
          import json,urllib.request,urllib.error,statistics
          from pathlib import Path
          src=Path("crypto-300-profit-mission/meme/evidence/frank-trade-coverage-sol-usdt-complex-2026-10-04.json")
          data=json.loads(src.read_text())
          assert data["history"]["raw_hash_verified"]==6874
          signals=data["models"]["M3"]["signals"]
          assert len(signals)==32
          first={}
          for sig in signals:
            if sig["signal_type"]=="FRANK_ACCUMULATION_SIGNAL":
              at=sig["triggered_at"]
              if sig["mint"] not in first or at<first[sig["mint"]]:
                first[sig["mint"]]=at
          assert len(first)==18
          delays=(300,900,1800,3600)
          horizons=(3600,21600,86400)
          asks={ "solana:"+mint:sorted({t+d for d in delays+horizons}) for mint,t in first.items()}
          req=urllib.request.Request("https://coins.llama.fi/batchHistorical",
             data=json.dumps({"coins":asks}).encode(),headers={
               "Content-Type":"application/json","User-Agent":"FrankResearchReadonly/1.0"},method="POST")
          try:
            with urllib.request.urlopen(req,timeout=35) as r:
              output=json.load(r)
          except Exception as e:
            print("STATUS: PUBLIC_DEFILLAMA_UNVERIFIED")
            print("SOURCE_FAILURE:",type(e).__name__,str(e)[:150])
            raise SystemExit(0)
          raw=output.get("coins") or {}
          print("SOURCE_RESPONSE_COIN_KEYS:",len(raw))
          print("RESPONSE_SAMPLE_SCHEMA:",json.dumps(next(iter(raw.values()),{}),separators=(",",":"))[:900])
          rows=[]
          for mint,at in sorted(first.items(),key=lambda x:x[1]):
            record=raw.get("solana:"+mint) or {}
            prices=record.get("prices") or []
            bytimestamp={int(x["timestamp"]):x for x in prices
               if isinstance(x,dict) and isinstance(x.get("timestamp"),(int,float))}
            def price(target):
              matches=[x for ts,x in bytimestamp.items() if abs(ts-target)<=300
                       and isinstance(x.get("price"),(int,float)) and x["price"]>0]
              if not matches:return None
              return min(matches,key=lambda x:abs(x["timestamp"]-target))["price"]
            out={"mint":mint,"signal_at":at,"num_prices":len(prices)}
            for delay in delays:
              ep=price(at+delay)
              for horizon in horizons:
                xp=price(at+horizon)
                out[f"d{delay}_h{horizon}"]=round((xp/ep-1)*100,6) if ep and xp else None
            rows.append(out)
            print("COIN_JSON:",json.dumps(out,separators=(",",":")))
          summary={"population":18,"rows_with_some_prices":sum(x["num_prices"]>0 for x in rows),
                   "source":"DefiLlama free batch historical, max 300s timestamp separation",
                   "no_trading":True,"not_executable_quote":True,
                   "price_outcomes_not_proven_pnl":True,"lag_matrix":{}}
          for d in delays:
            for h in horizons:
              key=f"d{d}_h{h}"
              vals=sorted(x[key] for x in rows if x[key] is not None)
              summary["lag_matrix"][key]={"n":len(vals),
                "positive":sum(x>0 for x in vals),
                "median_pct":statistics.median(vals) if vals else None,
                "trimmed_mean_pct":statistics.mean(vals[1:-1]) if len(vals)>=3 else None}
          print("STATUS: DEFILLAMA_BATCH_HISTORICAL_RESEARCH_OBSERVED")
          print("SUMMARY_JSON:",json.dumps(summary,separators=(",",":")))
          Path("frank-defillama-18-mint.json").write_text(json.dumps({
               "schema":1,"summary":summary,"cases":rows},indent=2))
          PY
      - name: Retain independent price batch source report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frank-defillama-18-mint-json
          path: frank-defillama-18-mint.json
          if-no-files-found: ignore
          retention-days: 7
