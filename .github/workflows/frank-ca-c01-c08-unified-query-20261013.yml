name: Frank CA C01 C08 single-mode research without default quote
on:
  push:
    branches:
      - dev/frank-ca-c01-c08-unified-research-no-default-quote-20261013
  workflow_dispatch:
permissions:
  contents: read
jobs:
  general-ca:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        working-directory: crypto-300-profit-mission/local-agent
        run: |
          python -m pip install -e '.[dev]'
          python -m pip install numpy==2.3.3 pyflakes==3.4.0
      - name: Validate CA code and UI syntax
        working-directory: crypto-300-profit-mission/local-agent
        run: |
          python -B -m compileall -q mission_agent/mission_control/server.py tests/test_frank_ca_c01_c08_no_default_quote.py
          python -m pyflakes mission_agent/mission_control/server.py tests/test_frank_ca_c01_c08_no_default_quote.py
          node --check mission_agent/mission_control/static/app.js
      - name: Confirm old main violates the same C01 C08 assertions
        working-directory: crypto-300-profit-mission/local-agent
        run: |
          git worktree add --detach "$RUNNER_TEMP/ca-red-main" 4ac0b1612e8d238ab9189de066ea16a6f6e66455
          cp tests/test_frank_ca_c01_c08_no_default_quote.py "$RUNNER_TEMP/ca-red-main/crypto-300-profit-mission/local-agent/tests/"
          set +e
          (
            cd "$RUNNER_TEMP/ca-red-main/crypto-300-profit-mission/local-agent"
            python -B -m pytest -q -p no:cacheprovider --tb=short tests/test_frank_ca_c01_c08_no_default_quote.py
          ) > "$RUNNER_TEMP/ca-red.log" 2>&1
          result=$?
          set -e
          if [ "$result" -eq 0 ]; then
            echo "BASELINE_UNEXPECTED_PASS"
            exit 1
          fi
          if ! grep -q "FAILED tests/test_frank_ca_c01_c08_no_default_quote.py" "$RUNNER_TEMP/ca-red.log"; then
            echo "BASELINE_FAILED_WITHOUT_EXPECTED_ASSERTIONS"
            tail -30 "$RUNNER_TEMP/ca-red.log"
            exit 1
          fi
          echo "OLD_MAIN_EXPECTED_RED_PASS"
      - name: C01 C08 mandatory no-auto-quote red-green
        working-directory: crypto-300-profit-mission/local-agent
        run: |
          python -B -m pytest -q -p no:cacheprovider tests/test_frank_ca_c01_c08_no_default_quote.py
      - name: Whole local-agent with real Git replay
        working-directory: crypto-300-profit-mission/local-agent
        env:
          FRANK_EXPECT_REAL_GIT_REPLAY: '1'
        run: |
          python -B -m pytest -q -p no:cacheprovider tests
