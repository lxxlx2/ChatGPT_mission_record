name: Frank Tweetcraft Historical Lag Research One Shot
on:
  push:
    branches: [review/meme-ca-v3-integrate-main-20261008]
    paths: ['.github/workflows/frank-tweetcraft-public-lag-one-shot.yml']
permissions:
  contents: read
jobs:
  historical-pool-candles:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Inspect public historical 5m pool candles - no trading, no keys
        run: |
          python3 - <<'PY'
          import json, urllib.request, urllib.parse, sys, datetime
          MINT="HzYCHqAN2uoHGRnL9v2ChCfFQX3bvJuJd5zu2Hd5MZQy"
          BUY=1791423976
          EXIT=1791509207
          BASE="https://api.geckoterminal.com/api/v2"
          def get(url):
            request=urllib.request.Request(url,headers={"Accept":"application/json","User-Agent":"ResearchEvidence/1.0"})
            with urllib.request.urlopen(request,timeout=18) as resp:return json.load(resp)
          try:
            data=get(BASE+"/networks/solana/tokens/"+MINT+"/pools?page=1")
            pools=[]
            for item in data.get("data") or []:
              attr=item.get("attributes") or {}
              rel=item.get("relationships") or {}
              base=(rel.get("base_token") or {}).get("data") or {}
              quote=(rel.get("quote_token") or {}).get("data") or {}
              side="base" if MINT in str(base.get("id","")) else "quote" if MINT in str(quote.get("id","")) else None
              address=attr.get("address")
              created=attr.get("pool_created_at")
              try:
                ts=datetime.datetime.fromisoformat(created.replace("Z","+00:00")).timestamp()
              except Exception:ts=None
              if side and address:
                pools.append({"pool":address,"name":attr.get("name"),
                   "side":side,"created_at":created,"valid_before_buy":bool(ts is not None and ts<=BUY),
                   "current_reserve_usd":attr.get("reserve_in_usd"),
                   "dex":(rel.get("dex") or {}).get("data",{}).get("id")})
            print("POOLS:",json.dumps(pools[:12],separators=(",",":")))
            choices=[x for x in pools if x["valid_before_buy"]]
            if not choices:
              print("STATUS: UNVERIFIED_NO_PREBUY_POOL_ON_PAGE");sys.exit(0)
            choices.sort(key=lambda x:float(x.get("current_reserve_usd") or 0),reverse=True)
            for pool in choices[:2]:
              params=urllib.parse.urlencode({
                  "aggregate":5,"before_timestamp":EXIT+900,"limit":350,
                  "currency":"usd","token":pool["side"]})
              url=BASE+"/networks/solana/pools/"+pool["pool"]+"/ohlcv/minute?"+params
              candles=get(url).get("data",{}).get("attributes",{}).get("ohlcv_list") or []
              candles=sorted(candles,key=lambda r:r[0])
              print("SELECTED_POOL:",json.dumps(pool,separators=(",",":")))
              print("BARS_COUNT:",len(candles))
              if not candles:
                print("STATUS: UNVERIFIED_NO_HISTORIC_POOL_CANDLES");sys.exit(0)
              print("BARS_TIME_RANGE:",candles[0][0],candles[-1][0])
              def first_after(t):
                x=next((r for r in candles if r[0]>=t and r[0]<t+900),None)
                return {"candle_start":x[0],"close_usd":x[4],"volume_usd":x[5]} if x else None
              exit_candle=first_after(EXIT)
              rows=[]
              for lag in (0,300,900,1800,3600):
                sample=first_after(BUY+lag)
                pct=None
                if sample and exit_candle and sample["close_usd"] and exit_candle["close_usd"]:
                  pct=(exit_candle["close_usd"]/sample["close_usd"]-1)*100
                rows.append({"lag_seconds":lag,"entry_proxy":sample,
                             "exit_proxy":exit_candle,"gross_pool_close_return_pct":pct})
              print("STATUS: PUBLIC_POOL_CANDLES_OBSERVED_NOT_EXECUTABLE_QUOTES")
              print("LAG_RESULT_JSON:",json.dumps({
                "mint":MINT,"pool":pool,"lags":rows,"bar_minutes":5,
                "max_lookahead_seconds":900,"scope":"ONE_PUBLIC_POOL_NOT_FOMO_ROUTER",
                "fees_slippage_omitted":True,"depth_at_trade_time_unknown":True,
                "profitability_copy_confirmed":False},separators=(",",":")))
              # Narrower 1-minute candles: both entry and exit sampled after each
              # target timestamp, never before; historical close is NOT a quote.
              def minute_bars(before,limit):
                opts=urllib.parse.urlencode({
                   "aggregate":1,"before_timestamp":before,"limit":limit,
                   "currency":"usd","token":pool["side"]})
                return sorted(get(BASE+"/networks/solana/pools/"+
                       pool["pool"]+"/ohlcv/minute?"+opts)
                       .get("data",{}).get("attributes",{})
                       .get("ohlcv_list") or [],key=lambda r:r[0])
              finer_entry=minute_bars(BUY+4500,160)
              finer_exit=minute_bars(EXIT+900,35)
              def minute_after(bars,ts):
                row=next((r for r in bars if ts<=r[0]<ts+120),None)
                return {"ts":row[0],"close_usd":row[4],"volume_usd":row[5]} if row else None
              e=minute_after(finer_exit,EXIT)
              lag_1m=[]
              for lag in (0,300,900,1800,3600):
                v=minute_after(finer_entry,BUY+lag)
                pct=(e["close_usd"]/v["close_usd"]-1)*100 if v and e and v["close_usd"] else None
                lag_1m.append({"delay_seconds":lag,"entry_proxy":v,
                               "exit_proxy":e,"gross_pool_close_return_pct":pct})
              print("LAG_1M_RESULT_JSON:",json.dumps({
                "pool":pool["pool"],"dex":pool["dex"],
                "bars_entry":len(finer_entry),"bars_exit":len(finer_exit),
                "lags":lag_1m,"candle_minutes":1,"price_execution_verified":False,
                "slippage_and_fees_omitted":True},separators=(",",":")))
          except Exception as e:
            print("STATUS: UNVERIFIED_PUBLIC_OHLCV_FAILURE")
            print("ERROR_TYPE:",type(e).__name__,"DETAIL:",str(e)[:180])
          PY
