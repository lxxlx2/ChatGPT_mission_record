name: Frank CA A00 A02 research registry validation

on:
  push:
    branches:
      - dev/frank-ca-registry-a00-a02-20261013
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research-registry:
    runs-on: ubuntu-latest
    timeout-minutes: 23
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install local-agent test requirements
        working-directory: crypto-300-profit-mission/local-agent
        run: |
          python -m pip install -e '.[dev]'
          python -m pip install numpy==2.3.3
          python -m pip install pyflakes==3.4.0
      - name: Check isolated schema and source syntax
        working-directory: crypto-300-profit-mission/local-agent
        run: |
          python -B -m compileall -q mission_agent/mission_control/person_registry.py tests/test_person_registry_research_v2.py tests/test_person_registry_a02_review_regression.py
          python -m pyflakes mission_agent/mission_control/person_registry.py tests/test_person_registry_research_v2.py tests/test_person_registry_a02_review_regression.py
          node --check mission_agent/mission_control/static/app.js
      - name: A02 research and legacy compatibility
        working-directory: crypto-300-profit-mission/local-agent
        run: |
          python -B -m pytest -q -p no:cacheprovider tests/test_person_registry_research_v2.py tests/test_person_registry_a02_review_regression.py
      - name: Full local-agent regression with actual Git replay
        working-directory: crypto-300-profit-mission/local-agent
        env:
          FRANK_EXPECT_REAL_GIT_REPLAY: '1'
        run: |
          python -B -m pytest -q -p no:cacheprovider tests
