[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-mission-local-agent"
version = "0.1.0"
description = "Private test data plane and bounded canary framework"
requires-python = ">=3.11"
dependencies = ["websockets==15.0.1"]

[project.optional-dependencies]
dev = ["pytest==8.3.5"]

[project.scripts]
mission-agent = "mission_agent.cli:main"

[tool.setuptools.packages.find]
include = ["mission_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
