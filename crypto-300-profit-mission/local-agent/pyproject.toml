[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-mission-local-agent"
version = "0.1.0"
description = "Synthetic-only local E2E foundation; no collectors or real delivery"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest==8.3.5"]

[project.scripts]
mission-agent = "mission_agent.cli:main"

[tool.setuptools.packages.find]
include = ["mission_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
